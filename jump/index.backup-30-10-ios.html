<title>משחק הרפתקאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* משחק הרפתקאות (חן, 29.10.26): הדמות הולכת וקופצת, אוספת רק את הצלילים הנכונים, קופצת מעל השאר ומעל האש או המים, ומגיעה לדלת.
   5 חיים, נפילה מחזירה לתחילת השלב, 5-6 שלבים ובסוף גביע. שליטה באצבע: למעלה קפיצה, ימינה/שמאלה הליכה, באלכסון קפיצה לצד. */
:root{--pink:#FDE1EA;--pink2:#FBC5D6;--fuchsia:#EF406E;--deep:#B8236B;--mint:#CFEFE3;--sky:#DDF1FB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#FEF6F5;font-family:Rubik,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:8px;gap:6px}
.hud{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;color:var(--deep)}
@media (max-width:600px){.hud{flex-wrap:wrap;row-gap:4px}.goal{order:9;flex:1 0 100%}}
.goal{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:clamp(17px,4.4vw,24px);text-align:center}
.hearts{display:flex;gap:3px;direction:ltr}

.hearts i.off{background:#F6D3DC;transform:scale(.8)}
.lvl{font-size:15px;color:#5F8DB5;white-space:nowrap}
.spk,.mute,.fs{width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 3px var(--pink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.spk svg,.mute svg,.fs svg{width:20px;height:20px}
#stage{position:relative;flex:1;min-height:0;width:100%;max-width:1100px;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;border-radius:22px;box-shadow:0 0 0 4px var(--pink),0 8px 22px rgba(239,64,110,.12);touch-action:none;display:block}
.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.85);border-radius:16px;padding:6px 14px;font-weight:700;color:var(--deep);font-size:15px;pointer-events:none;box-shadow:0 0 0 2px var(--pink2);transition:opacity .6s;display:flex;gap:10px;align-items:center;white-space:nowrap}
.hint svg{width:22px;height:22px}
.hint.gone{opacity:0}
.overlay{position:fixed;inset:0;background:rgba(253,225,234,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.hidden{display:none}
.card{background:#fff;border-radius:28px;padding:20px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(239,64,110,.18),0 0 0 4px var(--pink);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.card img.hero{width:110px;height:110px;object-fit:contain;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.card h2{margin:6px 0;color:var(--deep);font-size:26px}
.card p{margin:6px 0 12px;font-size:20px;font-weight:700;color:#444;display:flex;align-items:center;justify-content:center;gap:8px}
.big{font-size:56px;font-weight:800;color:var(--deep);line-height:1.1;margin:4px 0 8px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.big span{background:var(--pink);border-radius:18px;padding:2px 14px;min-width:70px}
.btn{font-family:inherit;font-size:21px;font-weight:800;color:#fff;background:var(--fuchsia);border:0;border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 5px 0 #C92E57}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #C92E57}
.trophy{width:150px;height:150px;object-fit:contain;animation:shine 1.4s ease-in-out infinite}
@keyframes shine{50%{transform:scale(1.08) rotate(4deg);filter:drop-shadow(0 0 16px #F2C94C)}}
</style>
