<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>משחק הרפתקאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* משחק הרפתקאות (חן, 29.10.26): הדמות הולכת וקופצת, אוספת רק את הצלילים הנכונים, קופצת מעל השאר ומעל האש או המים, ומגיעה לדלת.
   5 חיים, נפילה מחזירה לתחילת השלב, 5-6 שלבים ובסוף גביע. שליטה באצבע: למעלה קפיצה, ימינה/שמאלה הליכה, באלכסון קפיצה לצד. */
:root{--pink:#FDE1EA;--pink2:#FBC5D6;--fuchsia:#EF406E;--deep:#B8236B;--mint:#CFEFE3;--sky:#DDF1FB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#FEF6F5;font-family:Rubik,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:8px;gap:6px}
.hud{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;color:var(--deep)}
@media (max-width:600px){.hud{flex-wrap:wrap;row-gap:4px}.goal{order:9;flex:1 0 100%}}
.goal{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:clamp(17px,4.4vw,24px);text-align:center}
.hearts{display:flex;gap:3px;direction:ltr}
.hearts i{width:18px;height:16px;display:block;background:var(--fuchsia);clip-path:path('M9 16 L1.5 8.2 A4.4 4.4 0 0 1 9 3 A4.4 4.4 0 0 1 16.5 8.2 Z');transition:transform .3s}
.hearts i.off{background:#F6D3DC;transform:scale(.8)}
.lvl{font-size:15px;color:#5F8DB5;white-space:nowrap}
.spk,.mute,.fs{width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 3px var(--pink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.spk svg,.mute svg,.fs svg{width:20px;height:20px}
#stage{position:relative;flex:1;min-height:0;width:100%;max-width:1100px;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;border-radius:22px;box-shadow:0 0 0 4px var(--pink),0 8px 22px rgba(239,64,110,.12);touch-action:none;display:block}
.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.85);border-radius:16px;padding:6px 14px;font-weight:700;color:var(--deep);font-size:15px;pointer-events:none;box-shadow:0 0 0 2px var(--pink2);transition:opacity .6s;display:flex;gap:10px;align-items:center;white-space:nowrap}
.hint svg{width:22px;height:22px}
.hint.gone{opacity:0}
.overlay{position:fixed;inset:0;background:rgba(253,225,234,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.hidden{display:none}
.card{background:#fff;border-radius:28px;padding:20px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(239,64,110,.18),0 0 0 4px var(--pink);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.card img.hero{width:110px;height:110px;object-fit:contain;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.card h2{margin:6px 0;color:var(--deep);font-size:26px}
.card p{margin:6px 0 12px;font-size:20px;font-weight:700;color:#444;display:flex;align-items:center;justify-content:center;gap:8px}
.big{font-size:56px;font-weight:800;color:var(--deep);line-height:1.1;margin:4px 0 8px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.big span{background:var(--pink);border-radius:18px;padding:2px 14px;min-width:70px}
.btn{font-family:inherit;font-size:21px;font-weight:800;color:#fff;background:var(--fuchsia);border:0;border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 5px 0 #C92E57}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #C92E57}
.trophy{width:150px;height:150px;object-fit:contain;animation:shine 1.4s ease-in-out infinite}
@keyframes shine{50%{transform:scale(1.08) rotate(4deg);filter:drop-shadow(0 0 16px #F2C94C)}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hud">
  <span class="hearts" id="hearts"></span>
  <span class="goal"><span id="goal"></span><button class="spk" id="goalSpk" type="button" aria-label="להשמיע את ההנחיה"><svg viewBox="0 0 24 24" fill="#EF406E"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#EF406E" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button></span>
  <span class="lvl" id="lvlTxt"></span>
  <button class="mute" id="mute" type="button" aria-label="מוזיקה"><svg viewBox="0 0 24 24"><path d="M9 17V5l10-2v12" stroke="#EF406E" stroke-width="2.2" fill="none" stroke-linejoin="round"/><circle cx="6.5" cy="17" r="2.6" fill="#EF406E"/><circle cx="16.5" cy="15" r="2.6" fill="#EF406E"/><path id="muteX" d="M3 3l18 18" stroke="#B8236B" stroke-width="2.4" stroke-linecap="round" style="display:none"/></svg></button>
  <button class="mute" id="pause" type="button" aria-label="עצירה"><svg viewBox="0 0 24 24" fill="#EF406E"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  <button class="fs" id="fs" type="button" aria-label="מסך מלא"><svg viewBox="0 0 24 24" fill="none" stroke="#EF406E" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
 </div>
 <div id="stage"><canvas id="cv"></canvas>
  <div class="hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="#EF406E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 10l6-6 6 6"/></svg><span id="hintUp"></span></div>
 </div>
</div>
<div class="overlay" id="ov"><div class="card" id="card"></div></div>
<script src="../hen-voice.js"></script>
<script>
(function(){
var Q=new URLSearchParams(location.search), W=null, BASE='../';
var cv=document.getElementById('cv'), cx=cv.getContext('2d'), stage=document.getElementById('stage');
var IMG={}, muted=false, AC=null;
function key(t){t=String(t||'').replace(/\s+/g,' ').trim();var h=2166136261;for(var i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return('0000000'+h.toString(16)).slice(-8)}
/* ---------- קול: קודם הקלטה של חן, אחרת קול ג ---------- */
var aud=new Audio();
function say(t,cb){ if(muted||!t){cb&&setTimeout(cb,300);return}
  HenVoice.url(t,BASE+'play/assets/tts/'+key(t)+'.mp3',function(u){ try{aud.pause()}catch(e){} aud=new Audio(u); aud.onended=function(){cb&&cb()}; aud.onerror=function(){cb&&cb()}; aud.play().catch(function(){cb&&cb()}) }) }
function tone(f1,f2,d,type,vol){ if(muted)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime; o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(vol||.15,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d) }catch(e){} }
var SFX={jump:function(){tone(420,760,.16,'sine',.09)},good:function(){tone(660,990,.12,'triangle',.14);setTimeout(function(){tone(880,1320,.14,'triangle',.12)},90)},
 ouch:function(){tone(300,120,.35,'sawtooth',.07)},door:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,f*1.01,.18,'triangle',.12)},i*110)})}};
/* ---------- מסך ---------- */
var VH=360, VW=640, DPR=1;
function fit(){ stage.style.maxHeight=''; var r0=stage.getBoundingClientRect(); if(r0.height>r0.width*1.15){ stage.style.maxHeight=Math.round(r0.width*1.15)+'px'; stage.style.margin='auto 0' } else stage.style.margin=''; var r=stage.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(r.width*DPR); cv.height=Math.round(r.height*DPR); VH=360; VW=VH*r.width/Math.max(1,r.height); if(VW<360){VW=360;VH=360*r.height/r.width} GY=VH-72 }
addEventListener('resize',fit);
/* ---------- שלב ---------- */
var L=null, hero=null, cam=0, lives=5, li=0, items=[], tiles=[], pits=[], decor=[], door=null, parts=[], need=0, got=0, state='intro', tPrev=0, clock=0, shake=0;
var G=1900, JV=760, SPD=150, GY=290; // כוח משיכה, מהירות קפיצה, מהירות הליכה, גובה הקרקע
function rnd(a,b){return a+Math.random()*(b-a)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function build(lv){
  // מסלול (חן, 29.10.26: הדמות רצה לבד, הילד רק מקפיץ): מדרגות למעלה ולמטה, בורות אש/מים, צלילים נכונים (רבים באוויר, תופסים בקפיצה)
  // וצלילים אחרים שקופצים מעליהם. צליל נכון שפוספס חוזר שוב לפני הדלת, בלי עונש.
  tiles=[];pits=[];items=[];decor=[];parts=[];
  var good=lv.good, bad=lv.bad, seq=[], n=lv.count||6, i, hard=li>=3;
  for(i=0;i<n;i++) seq.push({g:1,t:good[i%good.length]});
  var nb=lv.bads!=null?lv.bads:Math.max(3,n-1); for(i=0;i<nb;i++) seq.push({g:0,t:bad[i%bad.length]});
  for(i=0;i<(lv.pits!=null?lv.pits:2);i++) seq.push({pit:1});
  for(i=0;i<(lv.stairs!=null?lv.stairs:2);i++) seq.push({st:1});
  shuffle(seq);
  var x=VW*.5+340, sx=0, cur=GY;
  function setH(at,h){ tiles.push({x:sx,w:at-sx,y:cur}); sx=at; cur=h }
  seq.forEach(function(e){
    if(e.pit){ var w=rnd(80,100); tiles.push({x:sx,w:x-sx,y:cur}); pits.push({x:x,w:w}); sx=x+w; x=sx+rnd(170,210); return }
    if(e.st){ var upw=cur>GY-60?1:cur<GY-40?-1:(Math.random()<.5?1:-1); for(var k=0;k<3;k++){ setH(x,cur-upw*26); x+=46 } x+=rnd(150,190); return }
    var high=e.g?Math.random()<.6:(hard&&Math.random()<.3);
    items.push({x:x,y:cur-(high?128:34),t:e.t,g:e.g,ph:rnd(0,6),dead:0,hi:high});
    x+=rnd(190,240);
  });
  door={x:x+40,open:0}; tiles.push({x:sx,w:door.x+500-sx,y:cur});
  for(i=0;i<Math.ceil((door.x+600)/260);i++) decor.push({k:W.decor[i%W.decor.length],x:i*260+rnd(-40,40),s:rnd(.8,1.15),far:i%2});
  need=items.filter(function(o){return o.g}).length; got=0;
  hero={x:VW*.5,y:GY,vy:0,on:1,face:1,sq:1,run:0,wait:1.2};
  cam=0;
}
function tileAt(x){ for(var i=0;i<tiles.length;i++){var t=tiles[i]; if(t.w>0&&x>=t.x&&x<=t.x+t.w) return t} return null }
function hAt(x){ for(var i=0;i<tiles.length;i++){var t=tiles[i]; if(t.w>0&&x>=t.x-4&&x<=t.x+t.w+4) return t.y} return null }
/* ---------- שליטה: נגיעה בכל מקום על המסך = קפיצה (גם רווח או חץ למעלה) ---------- */
function jump(){ if(state!=='play')return; hideHint(); if(hero.on){ hero.vy=-JV; hero.on=0; hero.sq=.7; SFX.jump(); puff(hero.x,hero.y,6) } }
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); jump() });
addEventListener('keydown',function(e){ if(e.repeat)return; if(e.key==='ArrowUp'||e.key===' '||e.key==='w'){ jump(); e.preventDefault() } if(e.key==='Enter'&&!ov.classList.contains('hidden')){var b=ov.querySelector('.btn');b&&b.click()} });
/* ---------- אפקטים ---------- */
function puff(x,y,n,col){ for(var i=0;i<n;i++) parts.push({x:x,y:y,vx:rnd(-90,90),vy:rnd(-160,-40),l:rnd(.35,.7),c:col||'rgba(255,255,255,.9)',r:rnd(3,7)}) }
function sparkle(x,y){ var C=['#EF406E','#F2C94C','#7FCFD9','#9BD97A','#FBC5D6']; for(var i=0;i<16;i++){var a=i/16*6.28; parts.push({x:x,y:y,vx:Math.cos(a)*rnd(120,260),vy:Math.sin(a)*rnd(120,260),l:rnd(.5,.9),c:C[i%5],r:rnd(3,6),star:1})} }
/* ---------- עדכון ---------- */
function step(dt){
  clock+=dt; if(shake>0) shake-=dt;
  parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt}); parts=parts.filter(function(p){return p.l>0});
  if(state!=='play') return;
  if(hero.wait>0){ hero.wait-=dt; return }
  cam+=SPD*dt;                                                                 // המסך מתקדם כל הזמן
  var mid=cam+VW*.5, py=hero.y, vx=hero.x<mid-4?SPD*1.7:SPD;                    // מאחור? רצה מהר יותר עד שחוזרת למרכז
  var nx=hero.x+vx*dt, ft=tileAt(nx+14);
  if(ft&&ft.y<hero.y-4&&nx+14>ft.x){ nx=Math.min(hero.x,ft.x-14); hero.blk=1 } else hero.blk=0; // מדרגה: נעצרים, צריך לקפוץ
  hero.x=nx; hero.vy+=G*dt; hero.y+=hero.vy*dt;
  var g=hAt(hero.x);
  if(g!=null){
    if(hero.vy>=0&&hero.y>=g&&py<=g+8){ if(!hero.on){hero.sq=1.3;puff(hero.x,g,5)} hero.y=g; hero.vy=0; hero.on=1 }
    else if(hero.y<g-2) hero.on=0;
  } else hero.on=0;
  if(hero.x<cam+22) return lose();                                             // המסך השאיר את הדמות מאחור
  hero.sq+=(1-hero.sq)*Math.min(1,dt*10); if(hero.on&&!hero.blk){ hero.run+=dt*12; if(Math.random()<dt*8) puff(hero.x-14,hero.y,1,'rgba(160,120,90,.35)') }
  if(hero.y>GY+60) return lose();
  items.forEach(function(o){ if(o.dead||state!=='play') return; var oy=o.y+Math.sin(clock*3+o.ph)*5;
    var near=Math.abs(hero.x-o.x), dyy=Math.abs((hero.y-30)-oy);
    if(o.g?(near<34&&dyy<44):(near<24&&dyy<30)){ // תפיסת צליל נכון סלחנית, פגיעה בצליל אחר רק בנגיעה ממשית
      if(o.g){ o.dead=1; got++; SFX.good(); sparkle(o.x,oy); say(o.t); if(got===need){door.open=1; setTimeout(SFX.door,350)} renderGoal() }
      else lose(o) }
    else if(o.g&&hero.x>o.x+70){
      var lt=tiles[tiles.length-1]; o.x=door.x+30; o.y=lt.y-(o.hi?128:34); door.x+=230; lt.w=door.x+500-lt.x } });
  if(state!=='play') return;
  if(hero.x>door.x+20&&door.open) return win();
}
function lose(o){ if(state!=='play')return; state='ouch'; lives--; SFX.ouch(); shake=.35; renderHearts(); if(o){o.hit=1}
  setTimeout(function(){ if(lives<=0){ lives=5; renderHearts(); show('over') } else { build(L); state='play'; renderGoal(); say(L.goal) } },1000) }
function win(){ state='win'; sparkle(door.x+30,hero.y-60); setTimeout(function(){ li++; if(li>=W.levels.length) show('trophy'); else show('level') },900) }
/* ---------- ציור ---------- */
function img(k){ return IMG[k] }
function draw(){
  var r=DPR*cv.width/(VW*DPR); var s=cv.height/VH; cx.setTransform(s,0,0,s,0,0);
  var sk=shake>0?Math.sin(clock*80)*4:0;
  // שמיים
  var g=cx.createLinearGradient(0,0,0,VH); g.addColorStop(0,W.sky[0]); g.addColorStop(1,W.sky[1]); cx.fillStyle=g; cx.fillRect(0,0,VW,VH);
  cx.save(); cx.translate(sk,0);
  // שכבה רחוקה: שמש ועננים
  if(img('sun')&&W.sun!==false) dImg('sun',VW-90-((cam*.05)%40),20,70,70,Math.sin(clock)*.05);
  for(var i=0;i<4;i++){ var cxp=((i*260-cam*.15+clock*8)%(VW+300)+VW+300)%(VW+300)-150; dImg('cloud',cxp,30+i%2*40,110,68,0,.75) }
  // נוף רחוק ונוף קרוב
  decor.forEach(function(d){ if(!d.far) return; var x=d.x-cam*.55; if(x<-200||x>VW+200) return; dImg(d.k,x,GY-150*d.s+10,150*d.s,150*d.s,0,.55) });
  cx.save(); cx.translate(-cam,0);
  decor.forEach(function(d){ if(d.far) return; var x=d.x+130; if(x-cam<-200||x-cam>VW+200) return; dImg(d.k,x,GY-110*d.s+8,110*d.s,110*d.s,Math.sin(clock*1.5+d.x)*.02) });
  // בורות: אש או מים
  pits.forEach(function(p){
    if(W.hazard==='water'){ var wg=cx.createLinearGradient(0,GY,0,VH); wg.addColorStop(0,'#9ED8EE'); wg.addColorStop(1,'#5FB3D9'); cx.fillStyle=wg; cx.fillRect(p.x,GY+14,p.w,VH);
      cx.strokeStyle='#fff'; cx.lineWidth=3; cx.beginPath(); for(var x=0;x<=p.w;x+=4) cx.lineTo(p.x+x,GY+18+Math.sin(x*.12+clock*4)*3); cx.stroke() }
    else { cx.fillStyle='#FCE3C4'; cx.fillRect(p.x,GY+30,p.w,VH); for(var k=0;k<Math.max(1,Math.round(p.w/48));k++){ var fx=p.x+8+k*(p.w-16)/Math.max(1,Math.round(p.w/48)), fl=1+Math.sin(clock*9+k*2)*.08; dImg('flame',fx,GY-6-14*(fl-1)*4,44,56*fl) } } });
  // קרקע ומדרגות
  tiles.forEach(function(gr){ if(gr.w<=0) return; cx.fillStyle=W.ground[1]; rr(gr.x,gr.y,gr.w,VH-gr.y+20,12); cx.fill(); cx.fillStyle=W.ground[0]; rr(gr.x,gr.y,gr.w,16,9); cx.fill();
    cx.fillStyle='rgba(255,255,255,.35)'; for(var x=gr.x+20;x<gr.x+gr.w-10;x+=46){ cx.beginPath(); cx.arc(x,gr.y+40+(x%3)*12,4,0,6.28); cx.fill() } });
  var DY=tiles.length?tiles[tiles.length-1].y:GY;
  // דלת
  var dw=70, dh=112; if(door.open){ cx.save(); cx.globalAlpha=.35+Math.sin(clock*5)*.15; var rg=cx.createRadialGradient(door.x+dw/2,DY-dh/2,10,door.x+dw/2,DY-dh/2,110); rg.addColorStop(0,'#FFF3B0'); rg.addColorStop(1,'rgba(255,243,176,0)'); cx.fillStyle=rg; cx.fillRect(door.x-80,DY-dh-80,dw+160,dh+120); cx.restore() }
  dImg('door',door.x,DY-dh,dw,dh,door.open?Math.sin(clock*4)*.03:0);
  // צלילים
  items.forEach(function(o){ if(o.dead) return; var y=o.y+Math.sin(clock*3+o.ph)*5, R=27;
    cx.save(); cx.translate(o.x,y); if(o.hit) cx.rotate(Math.sin(clock*30)*.2);
    cx.fillStyle='rgba(239,64,110,.12)'; cx.beginPath(); cx.arc(0,3,R+3,0,6.28); cx.fill();
    var bg=cx.createRadialGradient(-8,-10,4,0,0,R); bg.addColorStop(0,'#fff'); bg.addColorStop(1,W.bubble||'#FDE1EA'); cx.fillStyle=bg; cx.beginPath(); cx.arc(0,0,R,0,6.28); cx.fill();
    cx.lineWidth=3; cx.strokeStyle='#F2A7B8'; cx.stroke();
    cx.fillStyle='#4A2C3A'; cx.font='800 '+(o.t.length>2?26:32)+'px Rubik,Arial'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(o.t,0,3); cx.restore() });
  // דמות
  var hw=64, hh=64, bob=hero.on&&!(hero.wait>0)?Math.abs(Math.sin(hero.run))*5:0;
  if(state!=='ouch'||Math.floor(clock*12)%2){
    cx.save(); cx.translate(hero.x,hero.y-bob); cx.scale((W.heroFlip?-1:1)*(2-hero.sq),hero.sq); cx.rotate(hero.on?0:-hero.face*.12);
    if(state==='ouch') cx.globalAlpha=.6; var hi=img(W.hero); if(hi) cx.drawImage(hi,-hw/2,-hh,hw,hh); cx.restore() }
  // חלקיקים
  parts.forEach(function(p){ cx.globalAlpha=Math.max(0,Math.min(1,p.l*2)); cx.fillStyle=p.c; cx.beginPath(); if(p.star){ star(p.x,p.y,p.r) } else cx.arc(p.x,p.y,p.r,0,6.28); cx.fill() }); cx.globalAlpha=1;

  cx.save(); if(al!=null) cx.globalAlpha=al; if(rot){cx.translate(x+w/2,y+h);cx.rotate(rot);cx.drawImage(im,-w/2,-h,w,h)} else cx.drawImage(im,x,y,w,h); cx.restore() }
