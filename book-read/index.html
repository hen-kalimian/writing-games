<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>בואו נקרא יחד: האותיות הסודיות של גיא</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:transparent;font-family:Rubik,Arial,sans-serif;color:#5E5A73}
#app{max-width:860px;margin:0 auto;padding:6px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
#stage{position:relative;width:100%;aspect-ratio:1280/808;border-radius:18px;background:#fff;box-shadow:0 0 0 3px #FBC5D6,0 10px 26px rgba(184,35,107,.14);-webkit-user-select:none;user-select:none;touch-action:pan-y;overflow:hidden;cursor:grab}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
#cv.on{display:block}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;display:none;background:rgba(255,255,255,.94);color:#B8236B;font-weight:800;font-size:clamp(13px,3.6vw,18px);padding:6px 18px;border-radius:30px;box-shadow:0 3px 10px rgba(184,35,107,.22);pointer-events:none;white-space:nowrap}
#hint.on{display:block}
#endrow{position:absolute;inset:auto 0 12px 0;z-index:9;display:none;justify-content:center}
#endrow.on{display:flex}
.big{border:0;border-radius:18px;background:linear-gradient(135deg,#EF406E,#F27A9B);color:#fff;font-family:Rubik,sans-serif;font-weight:800;font-size:clamp(16px,4.4vw,22px);padding:11px 26px;box-shadow:0 8px 22px rgba(239,64,110,.3);cursor:pointer}
#bar{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.nav{border:2px solid #FBC5D6;background:#fff;color:#B8236B;font-family:Rubik,sans-serif;font-weight:700;font-size:16px;border-radius:30px;padding:8px 18px;cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.nav.main{background:#EF406E;border-color:#EF406E;color:#fff}
#dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:100%}
#dots i{width:9px;height:9px;border-radius:50%;background:#F5D3DC}
#dots i.on{background:#EF406E;transform:scale(1.25)}
#dots i.done{background:#F8A7BC}
#audioRow{display:flex;justify-content:center;width:100%}
#abtn{border:2px solid #EF406E;background:#fff;color:#B8236B;font-family:Rubik,sans-serif;font-weight:800;font-size:clamp(16px,4.4vw,20px);border-radius:30px;padding:10px 26px;cursor:pointer;display:flex;align-items:center;gap:10px}
#abtn.on{background:#EF406E;color:#fff}
#abtn svg{width:20px;height:20px;fill:currentColor}
</style></head><body>
<div id="app">
  <div id="stage">
    <video id="v" playsinline preload="auto"></video>
    <canvas id="cv" width="1280" height="808"></canvas>
    <div id="hint"></div>
    <div id="endrow"><button class="big" id="againBtn" type="button">קוראים שוב מההתחלה</button></div>
  </div>
  <div id="dots"></div>
  <div id="bar"><button class="nav" id="prev" type="button">לעמוד הקודם</button><button class="nav main" id="next" type="button">פתחו את הספר</button></div>
  <div id="audioRow"><button id="abtn" type="button"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="alabel">להאזנה רציפה</span></button></div>
  <audio id="aud" preload="none"></audio>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},stage=$('stage'),v=$('v'),cv=$('cv'),cx=cv.getContext('2d'),aud=$('aud'),VER='4',AUTO_MS=8000,W=1280,H=808;
var clips=[],imgs={},cover=new Image(),idx=-1,busy=false,ended=false,timer=0,hintRaf=0,drag=null,AC=null,wasPlaying=false;
var off=document.createElement('canvas');off.width=W;off.height=H;var ocx=off.getContext('2d');
cover.src='cover.jpg?v='+VER;
function flipSound(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();var d=.42,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++){var t=i/n;a[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*t),2)*(.6+.4*Math.sin(t*38))}var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=2600;f.Q.value=.7;g.gain.value=.05;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
function poster(i){if(i<0)return cover;if(i>=clips.length)return null;if(!imgs[i]){var m=new Image();m.src=clips[i].poster+'?v='+VER;imgs[i]=m}return imgs[i]}
function snapshot(){ocx.fillStyle='#fff';ocx.fillRect(0,0,W,H);var vw=v.videoWidth||W,vh=v.videoHeight||H;if(v.readyState>=2){var sc=Math.min(W/vw,H/vh);ocx.drawImage(v,(W-vw*sc)/2,(H-vh*sc)/2,vw*sc,vh*sc)}else{var p=poster(idx);if(p&&p.complete)ocx.drawImage(p,0,0,W,H)}return off}
/* realistic page curl: the left part of page A rolls over a cylinder to the right (spine on the right), page B is revealed underneath */
function render(A,B,xf){
  cx.clearRect(0,0,W,H);if(B&&B.complete!==false)cx.drawImage(B,0,0,W,H);
  var R=Math.max(24,xf/3.35),g;
  g=cx.createLinearGradient(xf-90,0,xf+4,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.32)');cx.fillStyle=g;cx.fillRect(Math.max(0,xf-90),0,94,H);
  if(xf>=W)return;
  cx.drawImage(A,xf,0,W-xf,H,xf,0,W-xf,H);
  g=cx.createLinearGradient(xf+R*.6,0,xf+R*2.6,0);g.addColorStop(0,'rgba(0,0,0,.38)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(xf+R*.6,0,R*2,H);
  var ds=2,PI=Math.PI;
  for(var s=0;s<xf;s+=ds){
    var src=xf-s-ds,w=ds;if(src<0){w=ds+src;src=0}if(w<=0)break;
    var ph=s/R,dx,dw,front=false,sh=0;
    if(ph<PI){var c=Math.cos(ph),sn=Math.sin(ph);dx=xf+R*sn;dw=w*c;if(c>=0){front=true;sh=.34*Math.pow(sn,1.4)}else{dx=dx+dw;dw=-dw;sh=.12+.1*sn}}
    else{dx=xf+(s-PI*R);dw=w;sh=.04}
    if(dx>W)continue;
    if(front){cx.drawImage(A,src,0,w,H,dx,0,dw+.7,H);cx.fillStyle='rgba(20,10,20,'+sh+')';cx.fillRect(dx,0,dw+.7,H);if(ph>.35&&ph<.8){cx.fillStyle='rgba(255,255,255,.14)';cx.fillRect(dx,0,dw+.7,H)}}
    else{var br=ph<PI?(.97-.45*Math.pow(Math.sin(ph),1.5)):.97;cx.fillStyle='rgb('+Math.round(252*br)+','+Math.round(244*br)+','+Math.round(236*br)+')';cx.fillRect(dx,0,dw+.7,H);if(ph>PI*.8&&ph<PI){cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(dx,0,dw+.7,H)}}
  }
}
function animate(from,to,ms,step,done){var t0=null;(function f(ts){if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;step(from+(to-from)*e);if(k<1)requestAnimationFrame(f);else done&&done()})(performance.now())}
function dots(){var h='';for(var i=0;i<clips.length;i++)h+='<i class="'+(i===idx?'on':(i<idx?'done':''))+'"></i>';$('dots').innerHTML=h}
function ui(){$('prev').disabled=idx<0;var last=idx>=clips.length-1;$('next').disabled=last;$('next').textContent=idx<0?'פתחו את הספר':(last?'הגענו לסוף הספר':'דפדפו לעמוד הבא');dots()}
function stopHint(){clearTimeout(timer);timer=0;cancelAnimationFrame(hintRaf);hintRaf=0;$('hint').classList.remove('on')}
/* hint: the page corner lifts a little and peeks at the next page, then (after 8s) turns by itself */
function startHint(text,auto){stopHint();if(busy)return;var A=idx<0?cover:snapshot(),B=poster(idx+1);if(!B)return;var A2=A;if(A===off){var c2=document.createElement('canvas');c2.width=W;c2.height=H;c2.getContext('2d').drawImage(off,0,0);A2=c2}
  cv.classList.add('on');$('hint').textContent=text;$('hint').classList.add('on');var t0=performance.now();
  (function f(ts){var x=(1-Math.cos(((ts-t0)/1700)*2*Math.PI))*52;render(A2,B,x);hintRaf=requestAnimationFrame(f)})(t0);
  if(auto)timer=setTimeout(function(){turn(1,true)},AUTO_MS)}
function showClip(i,playIt){idx=i;ui();if(i<0){v.pause();v.removeAttribute('src');v.removeAttribute('poster');v.load();return}
  v.poster=clips[i].poster+'?v='+VER;v.src=clips[i].src+'?v='+VER;ended=false;$('endrow').classList.remove('on');if(playIt){var p=v.play();if(p&&p.catch)p.catch(function(){})}}
function turn(dir,auto){
  if(busy||(dir>0&&idx>=clips.length-1)||(dir<0&&idx<0))return;busy=true;stopHint();aud.pause();setA(false);flipSound();
  var from=idx,to=idx+dir,A,B;
  if(dir>0){A=from<0?cover:snapshot();B=poster(to);if(A===off){var c2=document.createElement('canvas');c2.width=W;c2.height=H;c2.getContext('2d').drawImage(off,0,0);A=c2}
    v.pause();cv.classList.add('on');render(A,B,0);
    showClip(to,true);/* next clip starts under the canvas, in the same user gesture */
    animate(0,W+8,auto?900:700,function(x){render(A,B,x)},function(){cv.classList.remove('on');busy=false})}
  else{var cur=snapshot(),c3=document.createElement('canvas');c3.width=W;c3.height=H;c3.getContext('2d').drawImage(cur,0,0);v.pause();A=poster(to);B=c3;cv.classList.add('on');render(A,B,W+8);showClip(to,to>=0);
    animate(W+8,0,700,function(x){render(A,B,x)},function(){cv.classList.remove('on');busy=false;if(to<0){ended=false;startHint('לחצו על הספר כדי לפתוח אותו',false)}})}}
v.addEventListener('ended',function(){ended=true;if(idx>=clips.length-1){$('endrow').classList.add('on');return}startHint('משכו את הדף ימינה, או חכו רגע',true)});
v.addEventListener('play',function(){if(!aud.paused){aud.pause();setA(false)}});
/* drag: left to right = next page, right to left = previous page. Tap on the cover opens the book. */
stage.addEventListener('pointerdown',function(e){if(busy||!clips.length)return;stopHint();drag={x:e.clientX,y:e.clientY,mode:null,w:stage.getBoundingClientRect().width,t:Date.now(),d:0};try{stage.setPointerCapture(e.pointerId)}catch(x){}});
stage.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.mode){if(Math.abs(dx)<8)return;if(Math.abs(dy)>Math.abs(dx)*1.3){drag=null;return}
    if(dx>0&&idx<clips.length-1){drag.mode='f';wasPlaying=!v.paused;aud.pause();setA(false);flipSound();drag.A=idx<0?cover:copy(snapshot());drag.B=poster(idx+1);if(idx>=0){v.pause()}}
    else if(dx<0&&idx>=0){drag.mode='b';aud.pause();setA(false);flipSound();drag.B=copy(snapshot());drag.A=poster(idx-1);v.pause()}else{drag=null;return}
    cv.classList.add('on')}
  var k=W/drag.w,m=Math.abs(dx)*k*1.2;drag.d=m;
  if(drag.mode==='f')render(drag.A,drag.B,Math.min(W+8,m));else render(drag.A,drag.B,Math.max(0,W+8-m))});
function copy(c){var o=document.createElement('canvas');o.width=W;o.height=H;o.getContext('2d').drawImage(c,0,0);return o}
function endDrag(){if(!drag)return;var d=drag;drag=null;
  if(!d.mode){/* a tap */if(idx<0){turn(1)}else if(!busy){if(!ended){if(v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){})}else v.pause()}}return}
  busy=true;var pos=d.mode==='f'?d.d:W+8-d.d,fast=d.d/Math.max(1,Date.now()-d.t)>1.1,done=d.d>W*.3||fast;
  if(d.mode==='f'){var A=d.A,B=d.B;if(done){var to=idx+1;showClip(to,true);animate(pos,W+8,Math.max(200,(W+8-pos)*.5),function(x){render(A,B,x)},function(){cv.classList.remove('on');busy=false})}
    else animate(pos,0,Math.max(200,pos*.5),function(x){render(A,B,x)},function(){cv.classList.remove('on');if(idx>=0&&wasPlaying&&!ended){var p=v.play();if(p&&p.catch)p.catch(function(){})}busy=false;if(idx<0)startHint('לחצו על הספר כדי לפתוח אותו',false);else if(ended)startHint('משכו את הדף ימינה, או חכו רגע',true)})}
  else{var A2=d.A,B2=d.B;if(done){var to2=idx-1;showClip(to2,to2>=0);animate(pos,0,Math.max(200,pos*.5),function(x){render(A2,B2,x)},function(){cv.classList.remove('on');busy=false;if(to2<0)startHint('לחצו על הספר כדי לפתוח אותו',false)})}
    else animate(pos,W+8,Math.max(200,(W+8-pos)*.5),function(x){render(A2,B2,x)},function(){cv.classList.remove('on');busy=false;if(!ended){var p=v.play();if(p&&p.catch)p.catch(function(){})}else startHint('משכו את הדף ימינה, או חכו רגע',true)})}}
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')turn(1);if(e.key==='ArrowRight')turn(-1)});
$('next').onclick=function(){turn(1)};$('prev').onclick=function(){turn(-1)};
$('againBtn').onclick=function(){if(busy)return;stopHint();$('endrow').classList.remove('on');v.pause();idx=-1;ui();startHint('לחצו על הספר כדי לפתוח אותו',false)};
function setA(on){$('abtn').classList.toggle('on',on);$('alabel').textContent=on?'עצירת ההאזנה':'להאזנה רציפה';$('abtn').querySelector('path').setAttribute('d',on?'M6 5h4v14H6zm8 0h4v14h-4z':'M8 5v14l11-7z')}
$('abtn').onclick=function(){if(aud.paused){v.pause();stopHint();if(!aud.src)aud.src=window.__AUDIO;aud.play();setA(true)}else{aud.pause();setA(false);if(ended&&idx>=0&&idx<clips.length-1&&!busy)startHint('משכו את הדף ימינה, או חכו רגע',true)}};
aud.addEventListener('ended',function(){setA(false)});
fetch('clips.json?v='+VER).then(function(r){return r.json()}).then(function(j){clips=j.clips;window.__AUDIO=j.audio+'?v='+VER;for(var i=0;i<3;i++)poster(i);ui();var go=function(){startHint('לחצו על הספר כדי לפתוח אותו',false)};if(cover.complete)go();else cover.onload=go});
window.__rd={idx:function(){return idx},ended:function(){return ended},busy:function(){return busy},turn:turn};
})();
</script></body></html>
