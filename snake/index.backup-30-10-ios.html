<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* הנחש הרעב (חן, 29.10.26): משחק בסגנון סנייק לילדים. חן אומרת אות, והנחש אוכל רק אותה. נגיעה במסך = הנחש פונה לכיוון הנגיעה
   (או החלקה, או חצים). בלי פסילות: הקירות מעבירים לצד השני, טעות מקצרת את הנחש ומורידה נקודה (לא פחות מאפס). המטרה 5 (חן, 30.10.26: "מספיק לאסוף 5").
   כתובת: ?w=<עולם>&l=אבגד (או n=0123 לספרות). העולמות ב-snake/worlds. */
:root{--pink:#FDE1EA;--pink2:#FBC5D6;--fuchsia:#EF406E;--deep:#B8236B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:none;margin:0;height:100%;background:#FEF6F5;font-family:Rubik,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:8px;gap:6px}
.hud{width:100%;max-width:900px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;color:var(--deep)}
.goal{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(17px,4.4vw,23px)}
.dots{display:flex;gap:4px;direction:ltr}.dots i{width:14px;height:14px;border-radius:50%;background:#F6D3DC;display:block;transition:.3s}.dots i.on{background:var(--fuchsia);transform:scale(1.15)}
@media (max-width:600px){.hud{flex-wrap:wrap;row-gap:6px}.dots{order:9;flex:1 0 100%;justify-content:center}}
.spk,.mute,.fs,.pause{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 3px var(--pink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.spk svg,.mute svg,.fs svg,.pause svg{width:21px;height:21px}.spk.big{width:54px;height:54px}.spk.big svg{width:28px;height:28px}
#stage{position:relative;flex:1;min-height:0;width:100%;max-width:900px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{border-radius:22px;box-shadow:0 0 0 4px var(--pink),0 8px 22px rgba(239,64,110,.12);display:block;touch-action:none}
.joy{position:relative;width:min(56vw,230px);aspect-ratio:1;flex:none;touch-action:none}
.joy button{position:absolute;width:36%;height:36%;border:0;border-radius:22px;background:#fff;box-shadow:0 0 0 3px var(--pink2),0 5px 0 #F2A7B8;cursor:pointer;padding:0;touch-action:none}
.joy button:active,.joy button.on{background:var(--pink);transform:translateY(3px);box-shadow:0 0 0 3px var(--pink2),0 2px 0 #F2A7B8}
.joy button::after{content:'';position:absolute;left:50%;top:50%;width:0;height:0;border:16px solid transparent;transform:translate(-50%,-50%)}
.joy .up{left:32%;top:0}.joy .up::after{border-bottom:22px solid var(--fuchsia);border-top:0;margin-top:-4px}
.joy .dn{left:32%;bottom:0}.joy .dn::after{border-top:22px solid var(--fuchsia);border-bottom:0;margin-top:4px}
.joy .rt{right:0;top:32%}.joy .rt::after{border-left:22px solid var(--fuchsia);border-right:0;margin-left:4px}
.joy .lt{left:0;top:32%}.joy .lt::after{border-right:22px solid var(--fuchsia);border-left:0;margin-left:-4px}
@media (orientation:landscape) and (max-height:520px){.wrap{flex-direction:row;flex-wrap:wrap}.joy{width:min(30vh,170px)}}
.overlay{position:fixed;inset:0;background:rgba(253,225,234,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.hidden{display:none}
.card{background:#fff;border-radius:28px;padding:22px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(239,64,110,.18),0 0 0 4px var(--pink);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}

.card img{width:110px;height:110px;object-fit:contain;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.card h2{margin:6px 0 14px;color:var(--deep);font-size:26px}

.btn:active{transform:translateY(3px)}
.minus{position:absolute;font-weight:800;color:#B8236B;font-size:26px;pointer-events:none;animation:up .9s forwards}@keyframes up{to{transform:translateY(-40px);opacity:0}}
.insT{font-size:clamp(15px,3.6vw,20px);font-weight:700;color:#B8236B}
</style>

    /* אות על אריח מעוגל, שונה מהעיגולים של גוף הזחל */ cx.fillStyle='rgba(120,80,60,.15)'; rrect(x-r,y-r+r*.16,2*r,2*r,r*.45); cx.fill(); cx.fillStyle='#fff'; rrect(x-r,y-r,2*r,2*r,r*.45); cx.fill(); cx.lineWidth=Math.max(2,r*.12); cx.strokeStyle=o.col; cx.stroke();
