<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>הצ'קליסט שלי בתוכנית ההכשרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#CDEFE2; --mint-deep:#7CC9B0; --mint-wash:#EEF9F5;
  --sky:#BFE3F4; --sky-deep:#6FAFD2; --sky-wash:#EFF8FD;
  --pink:#F9D4DF; --pink-deep:#E98FAB;
  --ink:#4B5B69; --muted:#7A8995; --white:#fff; --bg:#FBFDFE;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Rubik,'Open Sans',Arial,sans-serif;line-height:1.5;padding:20px 14px 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto}
/* אפקט קו עיפרון: מסגרת עם פינות לא סימטריות */
.sketch{border:2px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px}
.sketch-soft{border:2px solid var(--ink);border-radius:18px 225px 18px 255px/225px 18px 255px 18px}

header.hero{position:relative;background:linear-gradient(180deg,var(--mint-wash),var(--sky-wash));padding:22px 20px 20px;text-align:center;margin-bottom:18px}
header.hero svg.doodle{width:74px;height:74px;display:block;margin:0 auto 4px}
h1{font-size:25px;line-height:1.25;margin:0 0 6px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:15px}
.steps{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:var(--pink);padding:7px 16px;font-weight:600;font-size:15px}
.steps b{font-size:20px}
.acct{margin-top:12px;font-size:14px;color:var(--ink)}
.loginbtn{background:var(--sky);color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:6px 14px;cursor:pointer;margin-inline-start:6px}
.loginbtn:hover{background:#A9D8EE}
.link{background:none;border:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer;margin-inline-start:6px}
#cheer{margin:8px 0 0;font-size:14.5px;color:var(--ink);min-height:22px}

.stepper{display:flex;justify-content:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.dot{width:40px;height:40px;display:grid;place-items:center;background:#fff;font:inherit;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;padding:0;position:relative}
.dot.sketch{border-radius:50% 46% 52% 48%/48% 52% 46% 50%}
.dot.done{background:var(--mint-deep);color:#fff}
.dot.cur{background:var(--sky);box-shadow:0 0 0 3px var(--sky-wash),0 0 0 5px var(--sky-deep)}
.dot.cur.done{background:var(--mint-deep)}
.dot:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px}
.slide{background:var(--white);padding:18px 16px 16px;animation:slidein .35s ease}
@keyframes slidein{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.slide.done{background:var(--mint-wash)}
.slide-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.slide-kick{font-size:13.5px;color:var(--muted);font-weight:500;display:block}
.slide-body{padding:6px 2px 4px}
.slide-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav{background:var(--sky);color:var(--ink);font:inherit;font-weight:600;font-size:16px;padding:10px 22px;cursor:pointer;min-width:110px}
.nav:hover{background:#A9D8EE}
.nav[disabled]{opacity:.35;cursor:default}
.nav:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px}
.ms{background:var(--white);margin-bottom:14px;overflow:hidden}
.ms-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px 16px;font:inherit;color:inherit;cursor:pointer;text-align:right}
.ms-head:focus-visible{outline:3px solid var(--sky-deep);outline-offset:-3px}
.ms-num{flex:none;width:38px;height:38px;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--sky)}
.ms-num.sketch{border-radius:50% 46% 52% 48%/48% 52% 46% 50%}
.ms-title{flex:1;min-width:0}
.ms-title strong{display:block;font-size:17px;line-height:1.3}
.bar{height:11px;background:var(--sky-wash);border:2px solid var(--ink);border-radius:999px;margin-top:8px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;right:0;left:auto;width:0;background:linear-gradient(90deg,var(--mint-deep),var(--sky-deep));transition:width .5s ease;border-radius:999px}
.pct{flex:none;min-width:46px;text-align:center;font-weight:700;font-size:15px}
.chev{flex:none;width:22px;height:22px;transition:transform .25s;stroke:var(--ink)}
.ms[data-open="true"] .chev{transform:rotate(180deg)}
.ms.done{background:var(--mint-wash)}
.ms.done .ms-num{background:var(--mint-deep);color:#fff}
.ms-body{display:none;padding:2px 14px 14px}
.ms[data-open="true"] .ms-body{display:block}

.topic{border-top:2px dashed var(--sky);padding:12px 4px 10px;transition:background .4s}
.topic:first-child{border-top:0}
.topic.done{background:linear-gradient(90deg,transparent,var(--mint-wash))}
.topic h3{margin:0 0 6px;font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.topic h3 .star{width:20px;height:20px;opacity:0;transform:scale(.3) rotate(-30deg);transition:all .4s cubic-bezier(.3,1.6,.5,1);stroke:var(--pink-deep);fill:var(--pink)}
.topic.done h3 .star{opacity:1;transform:scale(1) rotate(0)}
.chk{display:flex;align-items:flex-start;gap:11px;padding:9px 2px;cursor:pointer;font-size:16px;-webkit-tap-highlight-color:transparent}
.chk+.chk{border-top:2px dashed var(--sky-wash)}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:7px 10px 6px 11px/10px 6px 11px 7px;background:#fff;display:grid;place-items:center;transition:background .2s,transform .15s}
.box svg{width:18px;height:18px;stroke:var(--ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .3s ease}
.chk input:checked + .box{background:var(--mint)}
.chk input:checked + .box svg{stroke-dashoffset:0}
.chk input:focus-visible + .box{outline:3px solid var(--sky-deep);outline-offset:2px}
.chk:active .box{transform:scale(.9)}
.chk span.t{padding-top:2px}
.chk input:checked ~ span.t{color:var(--muted)}
.single .chk{font-size:16px}

.save{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:22px}
.save button{display:inline-flex;align-items:center;gap:10px;background:var(--mint);color:var(--ink);font:inherit;font-weight:700;font-size:18px;padding:12px 30px;cursor:pointer;transition:transform .15s,background .2s}
.save button:hover{background:#BDE8D8}
.save button:active{transform:scale(.96)}
.save button:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px}
.save button svg{width:30px;height:30px;stroke:var(--ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
#saved{min-height:22px;font-size:14px;color:var(--muted)}
#warn{display:none;margin-top:12px;background:var(--pink);padding:8px 14px;font-size:14px;text-align:center}

.confetti{position:fixed;top:-20px;pointer-events:none;opacity:0;z-index:50;animation:fall linear forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateY(105vh) rotate(260deg)}}
#banner{position:fixed;inset:auto 14px 20px;max-width:520px;margin:0 auto;background:#fff;padding:14px 18px;text-align:center;font-weight:600;font-size:17px;z-index:60;display:none;box-shadow:0 8px 24px rgba(75,91,105,.18)}
@media(max-width:480px){h1{font-size:22px}.ms-title strong{font-size:16px}}
@media(prefers-reduced-motion:reduce){.slide{animation:none}.confetti{display:none}.bar>i,.box svg,.topic h3 .star,.chev{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero sketch">
    <!-- איור קו: עיפרון, כוכב וספר פתוח -->
    <svg class="doodle" viewBox="0 0 80 80" fill="none" stroke="#4B5B69" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 58c8-4 18-4 28 2 10-6 20-6 28-2V24c-8-4-18-4-28 2-10-6-20-6-28-2z" fill="#EFF8FD"/>
      <path d="M40 26v34"/>
      <path d="M52 8l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z" fill="#F9D4DF"/>
      <path d="M17 70l9-9 4 4-9 9z" fill="#CDEFE2"/>
    </svg>
    <h1>הצ'קליסט שלי בתוכנית ההכשרה</h1>
    <p class="sub">אפשר להתחיל מכל נושא, בכל סדר ובקצב שלך. כל סימון הוא צעד קדימה.</p>
    <div class="steps sketch-soft">צעדים שעשיתי עד עכשיו: <b id="total">0</b></div>
    <p id="cheer"></p>
    <div id="acct" class="acct"></div>
  </header>

  <main id="list"></main>

  <div class="save">
    <button id="saveBtn" class="sketch" type="button">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 17l7 7L26 8"/></svg>
      שמירת התקדמות
    </button>
    <div id="saved" role="status" aria-live="polite"></div>
    <div id="warn" class="sketch-soft">נראה שהדפדפן הזה לא מאפשר לשמור. ההתקדמות תישאר רק כל עוד הדף פתוח. כדאי לפתוח את הקישור בדפדפן הרגיל.</div>
  </div>
</div>
<div id="banner" class="sketch" role="status"></div>

<script>
/* ===== התוכן: אבני דרך ונושאים (מתוך התוכניות "הכשרה מקצועית" ו"הכשרה עסקית") ===== */
const MILESTONES = [
  { id: 'm1', title: 'יסודות לימוד האותיות והכתיבה', items: [
    'צפיתי בשיעור 1: האותיות, התפתחות, מיפוי והקניה ראשונית',
    'ביצעתי את משימת המיפוי לילד או לילדה',
    'צפיתי בשיעור 2: האותיות, מטרות ופעילויות להטמעה',
    'בחרתי אות אחת ויישמתי פעילות להטמעה שלה',
    'צפיתי בשיעור 3: התפתחות הכתיבה וגרפומוטוריקה',
    'ניסיתי תרגיל גרפומוטורי עם ילד או ילדה',
    'סיכמתי לעצמי את שיעורים 1 עד 3',
    'שאלתי או עניתי בקבוצת הוואטסאפ' ] },
  { id: 'm2', title: 'העמקת הידע: מודעות פונולוגית וקריאה', items: [
    'צפיתי בשיעור 4: מודעות פונולוגית',
    'שיחקתי משחק פונולוגי עם ילד (למשל חריזה או פירוק להברות)',
    'צפיתי בשיעור 5: התפתחות הקריאה והכתיבה',
    'זיהיתי באיזה שלב בהתפתחות הקריאה נמצא ילד שאני מכירה',
    'צפיתי בשיעור 6: מעבר מהברות למילים ולקריאה שוטפת',
    'התאמנתי בקריאת הברות ומילים עם ילד',
    'סיכמתי לעצמי את שיעורים 4 עד 6',
    'שיתפתי בקבוצת הוואטסאפ מה עבד לי' ] },
  { id: 'm3', title: 'הרחבת תחומי ההתמחות: חשבון ומיפוי', items: [
    'צפיתי בשיעור 7: מוכנות בחשבון, ספירה, מנייה והספרות',
    'עשיתי פעילות ספירה ומנייה עם ילד',
    'צפיתי בשיעור 8: מוכנות בחשבון, הרצף, חיבור וחיסור',
    'ביצעתי פעילות חיבור וחיסור עם חפצים',
    'צפיתי בשיעור 9: מיפוי בשיטת קוראים בקלות',
    'ביצעתי מיפוי בשיטת קוראים בקלות לילד או לילדה',
    'סיכמתי לעצמי את שיעורים 7 עד 9',
    'שאלתי או עניתי בקבוצת הוואטסאפ' ] },
  { id: 'm4', title: 'ניהול קבוצה: סיום ההכשרה המקצועית', items: [
    'צפיתי בשיעור 10: מבנה השיעור וחוברת המערכים',
    'הכנתי מערך לשיעור ראשון מתוך החוברת',
    'צפיתי בשיעור 11: כלים להתמודדות עם אתגרים בקבוצה',
    'כתבתי לעצמי איך אתמודד עם האתגר שהכי מדאיג אותי בקבוצה',
    'צפיתי בשיעור 12: בינה מלאכותית ליצירת חומרי למידה ומשחק',
    'יצרתי חומר למידה או משחק בעזרת בינה מלאכותית',
    'צפיתי בשיעור הבונוס: פיצוח שגיאות כתיב',
    'צפיתי בשיעור הבונוס: מוכנות חברתית רגשית בקבוצות',
    'סיכמתי לעצמי את שיעורים 10 עד 12',
    'שיתפתי בקבוצת הוואטסאפ איך אני מתכוננת לקבוצה הראשונה' ] },
  { id: 'm5', title: 'בניית העסק', items: [
    'צפיתי בהדרכה: איך מתחילים ואיך משווקים ברשתות החברתיות',
    'פרסמתי את הפוסט הראשון שלי',
    'צפיתי בהדרכה: פרסום ממומן',
    'החלטתי אם ואיך אפרסם בתשלום',
    'צפיתי בהדרכה: פתיחת עסק והנהלת חשבונות',
    'קבעתי איך אפתח את העסק ומי ינהל לי את החשבונות',
    'צפיתי בהדרכה: הקמת דף נחיתה ואתר משלך',
    'הקמתי דף נחיתה ראשון',
    'צפיתי בהדרכה: תמחור ומכירות',
    'קבעתי מחיר לקבוצה שלי',
    'צפיתי בהדרכה: עיצוב פוסטים, חומרי למידה ופלאיירים בקאנבה',
    'עיצבתי פוסט או פלאייר בקאנבה',
    'צפיתי בהדרכה: איך הופכים את ההורים למשווקים שלך',
    'ביקשתי המלצה מהורה מרוצה' ] },
  { id: 'm6', title: 'הגשת העבודה המסכמת ופתיחת קבוצה', items: [
    'הגשתי את העבודה המסכמת',
    'פתחתי את הקבוצה הראשונה שלי' ] }
];
const KEY = 'hen-training-checklist-v2';
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l5 5L19 7"/></svg>';
const STAR = '<svg class="star" viewBox="0 0 24 24" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.8 6 6.5.8-4.8 4.5 1.3 6.5L12 17l-5.8 3.3 1.3-6.5L2.7 9.3l6.5-.8z"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

/* ===== שמירה בדפדפן (LocalStorage), עם גיבוי בזיכרון אם הדפדפן חוסם ===== */
let store = { checks: {}, cur: 0 }, canSave = true;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const j = JSON.parse(raw); store.checks = j.checks || {}; store.cur = j.cur || 0; } }
  catch (e) { canSave = false; }
}
/* ===== שמירה בחשבון (חן, 4.10.26: "שיעבוד גם מדפדפן אחר, אותו יוזר") =====
   התחברות עם המשתמש של האתר (ויקס), וההתקדמות נשמרת בטבלה בוויקס לפי המשתמשת. בלי התחברות נשארת שמירה בדפדפן. */
const CLIENT_ID = '058da38e-a911-4b84-876e-e5efedfa9ae9', COLLECTION = 'ChecklistProgress';
const REDIRECT = 'https://hen-kalimian.github.io/writing-games/checklist/';
const TOK = 'hen-ck-wix-tokens', OA = 'hen-ck-wix-oauth';
let wix = null, cloud = false, cloudItem = null, cloudT = null;
async function sdk() {
  if (wix) return wix;
  const [{ createClient, OAuthStrategy }, { items }] = await Promise.all([import('https://esm.sh/@wix/sdk@1.21.16'), import('https://esm.sh/@wix/data@1.0.525')]);
  let tokens; try { tokens = JSON.parse(localStorage.getItem(TOK) || 'null'); } catch (e) {}
  wix = createClient({ auth: OAuthStrategy({ clientId: CLIENT_ID, ...(tokens ? { tokens } : {}) }), modules: { items } });
  return wix;
}
const keepTokens = () => { try { if (wix) localStorage.setItem(TOK, JSON.stringify(wix.auth.getTokens())); } catch (e) {} };
function cloudStatus(msg, loggedIn) {
  $('acct').innerHTML = loggedIn
    ? '<span>' + msg + '</span> <button type="button" id="logout" class="link">התנתקות</button>'
    : '<span>' + msg + '</span> <button type="button" id="login" class="loginbtn sketch-soft">התחברות עם המשתמש שלי באתר</button>';
}
async function cloudLoad() {
  try {
    const c = await sdk();
    const r = await c.items.query(COLLECTION).find();
    keepTokens();
    cloudItem = r.items[0] || null;
    cloud = true;
    if (cloudItem) { const s = JSON.parse(cloudItem.data || '{}'); store.checks = s.checks || {}; render(); }
    else cloudSave(true);   // הפעם הראשונה בחשבון: מעבירים לשם את מה שכבר סומן
    cloudStatus('מחוברת. ההתקדמות נשמרת בחשבון שלך ✓ ותופיע בכל מכשיר.', true);
  } catch (e) {
    cloud = false; localStorage.removeItem(TOK); wix = null;
    cloudStatus('כדי שההתקדמות תישמר בחשבון שלך ותופיע בכל מכשיר:', false);
  }
}
async function cloudSaveNow() {
  if (!cloud) return false;
  try {
    const c = await sdk(), data = JSON.stringify({ checks: store.checks });
    if (cloudItem) cloudItem = await c.items.update(COLLECTION, { ...cloudItem, data });
    else cloudItem = await c.items.insert(COLLECTION, { title: 'progress', data });
    keepTokens(); return true;
  } catch (e) { return false; }
}
function cloudSave(now) {
  if (!cloud) return;
  clearTimeout(cloudT);
  cloudT = setTimeout(cloudSaveNow, now ? 0 : 600);
}
async function startLogin() {
  const c = await sdk();
  const od = c.auth.generateOAuthData(REDIRECT, REDIRECT);
  localStorage.setItem(OA, JSON.stringify(od));
  const { authUrl } = await c.auth.getAuthUrl(od);
  location.href = authUrl + '&lang=he';
}
async function finishLoginIfReturned() {
  if (!/[#?&]code=/.test(location.hash + location.search)) return false;
  try {
    const c = await sdk(), od = JSON.parse(localStorage.getItem(OA) || 'null');
    const r = c.auth.parseFromUrl(); if (!od || !r.code) return false;
    const tokens = await c.auth.getMemberTokens(r.code, r.state, od);
    c.auth.setTokens(tokens); keepTokens(); localStorage.removeItem(OA);
    history.replaceState(null, '', location.pathname);
    return true;
  } catch (e) { history.replaceState(null, '', location.pathname); return false; }
}
function persist() {
  cloudSave();
  try { localStorage.setItem(KEY, JSON.stringify({ checks: store.checks, cur: store.cur, at: Date.now() })); return true; }
  catch (e) { canSave = false; document.getElementById('warn').style.display = 'block'; return false; }
}

/* ===== תצוגה ===== */
const $ = id => document.getElementById(id);
const items = m => m.items.map((t, i) => ({ id: m.id + '-i' + i }));
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const isDone = m => items(m).every(x => store.checks[x.id]);
const pctOf = m => { const ids = items(m); return Math.round(100 * ids.filter(x => store.checks[x.id]).length / ids.length); };
function render() {
  store.cur = Math.max(0, Math.min(MILESTONES.length - 1, store.cur | 0));
  const mi = store.cur, m = MILESTONES[mi], pct = pctOf(m), n = MILESTONES.length;
  $('list').innerHTML =
    '<nav class="stepper" aria-label="שלבי ההכשרה">' + MILESTONES.map((x, i) =>
      '<button type="button" class="dot sketch' + (i === mi ? ' cur' : '') + (isDone(x) ? ' done' : '') + '" data-go="' + i + '" aria-label="שלב ' + (i + 1) + (isDone(x) ? ' (הושלם)' : '') + '"' + (i === mi ? ' aria-current="step"' : '') + '>' + (i + 1) + '</button>').join('') + '</nav>' +
    '<section class="slide sketch' + (isDone(m) ? ' done' : '') + '" id="' + m.id + '">' +
      '<div class="slide-head"><span class="ms-num sketch">' + (mi + 1) + '</span>' +
      '<span class="ms-title"><span class="slide-kick">שלב ' + (mi + 1) + ' מתוך ' + n + '</span><strong>' + esc(m.title) + '</strong>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div></span>' +
      '<span class="pct">' + pct + '%</span></div>' +
      '<div class="slide-body">' + m.items.map((t, i) => row(m.id + '-i' + i, t)).join('') + '</div>' +
      '<div class="slide-nav">' +
        '<button type="button" class="nav sketch-soft" data-step="-1"' + (mi === 0 ? ' disabled' : '') + '>הקודם</button>' +
        '<button type="button" class="nav sketch-soft" data-step="1"' + (mi === n - 1 ? ' disabled' : '') + '>הבא</button>' +
      '</div></section>';
  update(true);
}
function go(i) { store.cur = i; persist(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function row(id, text) {
  return '<label class="chk"><input type="checkbox" data-id="' + id + '"' + (store.checks[id] ? ' checked' : '') + '><span class="box">' + CHECK + '</span><span class="t">' + esc(text) + '</span></label>';
}

/* ===== התקדמות, חגיגות ועידוד ===== */
const CHEERS = ['כל התחלה היא הישג. תבחרי נושא שקורץ לך.', 'איזה יופי, את כבר בתנועה!', 'צעד אחרי צעד, וזה כבר נראה מרשים.', 'את מתקדמת נהדר, תמשיכי בקצב שלך.', 'הרבה כבר מאחוריך. כל הכבוד!'];
let wasDone = {};
function update(silent) {
  let total = 0;
  MILESTONES.forEach(m => {
    const done = items(m).filter(x => store.checks[x.id]).length, now = isDone(m);
    total += done;
    if (!silent && now && !wasDone[m.id]) celebrate('סיימת שלב! ' + m.title, true);
    wasDone[m.id] = now;
  });
  $('total').textContent = total;
  const lvl = total === 0 ? 0 : Math.min(CHEERS.length - 1, 1 + Math.floor(total / 12));
  $('cheer').textContent = CHEERS[lvl];
}
function confetti(n) {
  const cols = ['#CDEFE2', '#BFE3F4', '#F9D4DF', '#FFFFFF', '#7CC9B0', '#E98FAB'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'), s = 9 + Math.random() * 10;
    c.className = 'confetti';
    c.style.cssText = 'left:' + (Math.random() * 98) + '%;width:' + s + 'px;height:' + s + 'px;background:' + cols[i % cols.length] + ';border:1.6px solid #4B5B69;border-radius:' + (i % 3 ? '50%' : '3px') + ';animation-duration:' + (1.3 + Math.random() * .9) + 's;animation-delay:' + (Math.random() * .25) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 2800);
  }
}
let bannerT;
function celebrate(msg, big) {
  confetti(big ? 46 : 18);
  const b = $('banner'); b.textContent = (big ? '🎉 ' : '⭐ ') + msg; b.style.display = 'block';
  clearTimeout(bannerT); bannerT = setTimeout(() => { b.style.display = 'none'; }, big ? 3600 : 2200);
}

/* ===== אירועים ===== */
$('list').addEventListener('change', e => {
  const cb = e.target.closest('input[data-id]'); if (!cb) return;
  if (cb.checked) store.checks[cb.dataset.id] = 1; else delete store.checks[cb.dataset.id];
  persist();
  const m = MILESTONES[store.cur], pct = pctOf(m), sec = $(m.id), done = isDone(m);
  sec.querySelector('.bar > i').style.width = pct + '%';
  sec.querySelector('.bar').setAttribute('aria-valuenow', pct);
  sec.querySelector('.pct').textContent = pct + '%';
  sec.classList.toggle('done', done);
  document.querySelector('.dot.cur').classList.toggle('done', done);
  update(false);
});
$('list').addEventListener('click', e => {
  const d = e.target.closest('[data-go]'); if (d) return go(+d.dataset.go);
  const s = e.target.closest('[data-step]'); if (s && !s.disabled) go(store.cur + +s.dataset.step);
});
$('saveBtn').addEventListener('click', () => {
  const ok = persist();
  if (cloud) { $('saved').textContent = 'שומרת בחשבון שלך...'; cloudSaveNow().then(okc => { $('saved').textContent = okc ? 'ההתקדמות נשמרה בחשבון שלך ✓ היא תחכה לך מכל מכשיר.' : 'לא הצלחתי לשמור בחשבון. אפשר לנסות שוב.'; }); confetti(10); return; }
  $('saved').textContent = ok ? 'ההתקדמות נשמרה ✓ כשתחזרי לאותו קישור, הכל יחכה לך.' : 'לא הצלחתי לשמור בדפדפן הזה.';
  if (ok) confetti(10);
});
load(); render();
if (!canSave) $('warn').style.display = 'block';
document.addEventListener('click', async e => {
  if (e.target.id === 'login') { e.target.disabled = true; e.target.textContent = 'עוברת להתחברות...'; try { await startLogin(); } catch (err) { e.target.disabled = false; e.target.textContent = 'לא הצלחתי, אפשר לנסות שוב'; } }
  if (e.target.id === 'logout') { cloud = false; cloudItem = null; wix = null; localStorage.removeItem(TOK); store = { checks: {}, cur: 0 }; try { localStorage.removeItem(KEY); } catch (er) {} render(); cloudStatus('התנתקת. כדי שההתקדמות תישמר בחשבון שלך ותופיע בכל מכשיר:', false); }
});
(async () => {
  cloudStatus('כדי שההתקדמות תישמר בחשבון שלך ותופיע בכל מכשיר:', false);
  const returned = await finishLoginIfReturned();
  if (returned || localStorage.getItem(TOK)) { $('acct').firstChild && ($('acct').firstChild.textContent = 'מתחברת...'); await cloudLoad(); }
})();
</script>
</body>
