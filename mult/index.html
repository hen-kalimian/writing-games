<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>לוח הכפל</title>
<style>
@font-face{font-family:Rubik;font-weight:800;src:local('Rubik ExtraBold'),local('Rubik')}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#FEF6F5 100%);font-family:Rubik,'Open Sans',Arial,sans-serif;color:#4A2C3A;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px;gap:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.bar h1{margin:0;font-size:clamp(18px,4.6vw,26px);font-weight:800;color:#B8236B;flex:1;text-align:center}
.ib{width:40px;height:40px;border-radius:50%;border:2.5px solid #F8B9B6;background:#fff;color:#D14175;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 auto}
.ib svg{width:22px;height:22px}
.ib.back{width:auto;padding:0 14px;border-radius:99px;font:800 15px Rubik,Arial;gap:6px}
#stage{flex:1;min-height:0;position:relative}
/* תפריט 2x2 */
.menu{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.tile{border:4px solid #FBC5D6;border-radius:26px;background:#FDE1EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;padding:6px;min-height:0;box-shadow:0 5px 0 #F8B9B6}
.tile:nth-child(2){background:#E3F5EC;border-color:#B9E3D0;box-shadow:0 5px 0 #A8D9C3}
.tile:nth-child(3){background:#E5F1FA;border-color:#BCD9F0;box-shadow:0 5px 0 #A9CBE6}
.tile:nth-child(4){background:#FFF4D6;border-color:#F3DE98;box-shadow:0 5px 0 #E8D07E}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #F8B9B6}
.tile .ic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
.tile .ic img,.tile .ic svg{max-height:100%;max-width:78%;object-fit:contain}
.tile .nm{font-weight:800;font-size:clamp(20px,5.6vw,30px);color:#B8236B}
.tile .ck{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:#4FB38C;color:#fff;display:none;align-items:center;justify-content:center}
.tile.done .ck{display:flex}

.game{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
.q{background:#fff;border:4px solid #FBC5D6;border-radius:22px;text-align:center;font-weight:800;color:#B8236B;padding:6px 10px;font-size:clamp(34px,10vw,60px);direction:ltr;line-height:1.15;flex:0 0 auto}
.q small{display:block;font-size:clamp(12px,3.4vw,16px);color:#6b5a66;direction:rtl;font-weight:700}

.a{border:4px solid #BCD9F0;border-radius:22px;background:#fff;font-weight:800;font-size:clamp(30px,9vw,54px);color:#4A2C3A;display:flex;align-items:center;justify-content:center;cursor:pointer;direction:ltr;box-shadow:0 5px 0 #A9CBE6}
.a:nth-child(2){border-color:#B9E3D0;box-shadow:0 5px 0 #A8D9C3}.a:nth-child(3){border-color:#F3DE98;box-shadow:0 5px 0 #E8D07E}.a:nth-child(4){border-color:#FBC5D6;box-shadow:0 5px 0 #F8B9B6}

.bal.pop{animation:bpop .3s forwards}@keyframes bpop{to{transform:scale(1.6);opacity:0}}
#pl{position:absolute;width:23%;max-width:96px;pointer-events:none;z-index:5;transition:none}
/* רכבת */
.track{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;background:linear-gradient(#BFE3F7,#E4F4FF 62%,#CFEFB5);touch-action:none}
.cargo{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800;direction:ltr;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.28);width:26%;max-width:112px;aspect-ratio:.82;background-size:100% 100%;font-size:clamp(18px,5.6vw,30px);padding-bottom:12%;left:50%;transform:translateX(-50%);top:6%}

.wag:nth-child(3n+2){background:#8FD3B6;border-color:#4FB38C}.wag:nth-child(3n+3){background:#B7CDE0;border-color:#5F8DB5}
.wag:after{content:"";position:absolute;bottom:-12px;left:18%;width:22px;height:22px;border-radius:50%;background:#444;border:4px solid #bbb;box-shadow:70px 0 0 -0px #444}
.rail{position:absolute;left:0;right:0;bottom:7%;height:6px;background:#8d8aa0}
.pin{position:absolute;left:0;right:0;bottom:calc(10% + 34% + 4px);top:30%;display:flex;justify-content:center;pointer-events:none}
.tapbtn{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);font:800 clamp(16px,4.6vw,22px) Rubik,Arial;color:#fff;background:#EF406E;border:0;border-radius:99px;padding:8px 26px;box-shadow:0 4px 0 #D14175;cursor:pointer;z-index:6}
/* נחש */
.sn{position:relative;flex:1;min-height:0}
.sn canvas{position:absolute;left:50%;top:0;transform:translateX(-50%);border-radius:18px;touch-action:none}
.joy{position:absolute;right:6px;bottom:6px;display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:3px;z-index:6}
.joy button{border:2px solid #F8B9B6;background:rgba(255,255,255,.85);border-radius:12px;color:#D14175;padding:0}
.joy .u{grid-column:2;grid-row:1}.joy .l{grid-column:1;grid-row:2}.joy .r{grid-column:3;grid-row:2}.joy .d{grid-column:2;grid-row:3}
.joy svg{width:20px;height:20px}
/* סיום */
.end{position:absolute;inset:0;background:rgba(255,246,248,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;border-radius:22px;text-align:center}
.end.on{display:flex}.end h2{margin:0;font-size:clamp(28px,8vw,44px);color:#B8236B}
.btn{font:800 clamp(18px,5vw,24px) Rubik,Arial;color:#fff;background:#EF406E;border:0;border-radius:99px;padding:12px 34px;box-shadow:0 5px 0 #D14175;cursor:pointer}
.btn.alt{background:#fff;color:#D14175;border:3px solid #F8B9B6;box-shadow:none}
.hit{position:absolute;pointer-events:none;font-size:0}
.cf{position:fixed;width:10px;height:14px;z-index:30;pointer-events:none}
.top{display:none}
@media (max-width:520px){.joy{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px)}}
</style></head><body>

</div>
