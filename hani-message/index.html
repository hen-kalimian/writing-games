<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ההודעות לקבוצות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --pink:#f9c9d8; --pink-soft:#fdeaf0; --fuchsia:#d6336c; --mint:#d8f3e8; --sky:#dcefff; --gold:#b8892b; --ink:#2b2b33; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Rubik','Open Sans',Arial,sans-serif; color:var(--ink); background:linear-gradient(180deg,var(--pink-soft),#fff 40%,var(--sky)); min-height:100vh; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  .daybox { margin:0 0 34px; }
  .dayhead { text-align:center; font-size:24px; font-weight:600; color:var(--ink); margin:0 0 12px; padding:10px 14px; background:#fff; border-radius:16px; border:2px solid var(--pink); }
  .dayhead small { display:block; font-size:14px; font-weight:500; color:#777; margin-top:2px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:stretch; }
  .col { min-width:0; display:flex; flex-direction:column; }
  /* both messages of a date end on the same line: the cards stretch to the taller one and the copy buttons sit at the bottom */
  .col .card { flex:1; display:flex; flex-direction:column; }
  .col .card .row { margin-top:auto; padding-top:14px; }
  .col .nomsg { flex:1; }
  .ghead { text-align:center; font-size:21px; font-weight:600; line-height:1.35; padding:12px 10px; border-radius:16px 16px 0 0; margin:0; }
  .ghead.club { background:var(--pink); color:#8c1d4a; border:2px solid var(--pink); }
  .ghead.prep { background:var(--mint); color:#1d6b4a; border:2px solid #9ad8bc; }
  .ghead.train { background:var(--sky); color:#245a8d; border:2px solid #a9cdf0; }
  .ghead small { display:block; font-size:14px; font-weight:500; opacity:.85; }
  .col .card { border-radius:0 0 18px 18px; border-top:0; margin-bottom:14px; }
  .col.prep .card { border-color:#9ad8bc; }
  .col.train .card { border-color:#a9cdf0; }
  .nomsg { text-align:center; color:#999; padding:18px 10px; border:2px dashed #e5d5da; border-radius:0 0 18px 18px; border-top:0; }
  .full { grid-column:1 / -1; }
  /* mobile too: always two columns side by side, mom club on the right, prep group on the left (Hen, 8.11.26) */
  @media (max-width:760px) {
    main { padding:14px 6px 36px; }
    h1 { font-size:21px; } .sub { font-size:13px; margin-bottom:12px; }
    .dayhead { font-size:17px; padding:8px 6px; } .dayhead small { font-size:12px; }
    .cols { gap:6px; }
    .ghead { font-size:15px; padding:9px 4px; border-radius:12px 12px 0 0; } .ghead small { font-size:11px; }
    .col .card { padding:8px; border-radius:0 0 12px 12px; margin-bottom:8px; }
    .when { font-size:15px; } .group { font-size:12px; margin-bottom:6px; } .stamp { font-size:11px; margin-bottom:6px; }
    .banner { font-size:12px; padding:7px 6px; margin-bottom:8px; border-radius:10px; }
    .msg { font-size:13px; line-height:1.55; padding:7px; } .msg a.lnk { font-size:11px; }
    .row button { font-size:14px; padding:10px 8px; min-width:0; width:100%; border-radius:10px; }
    .nomsg { font-size:12px; padding:12px 4px; }
  }
  h1 { text-align:center; font-size:26px; margin:8px 0 4px; color:var(--gold); font-weight:600; }
  .sub { text-align:center; margin:0 0 20px; color:#666; font-size:15px; }
  .card { background:#fff; border-radius:18px; padding:18px; box-shadow:0 4px 18px rgba(214,51,108,.10); border:2px solid var(--pink); margin-bottom:22px; }
  .when { text-align:center; margin:0 0 4px; font-size:20px; font-weight:600; color:var(--ink); }
  .group { text-align:center; margin:0 0 10px; font-size:15px; color:var(--fuchsia); font-weight:500; }
  .stamp { text-align:center; color:#777; font-size:13px; margin:0 0 12px; }
  .banner { text-align:center; border-radius:14px; padding:11px 14px; margin:0 0 14px; font-weight:600; font-size:16px; line-height:1.5; }
  .banner.ok { background:var(--mint); color:#1d6b4a; border:2px solid #9ad8bc; }
  .banner.soon { background:var(--sky); color:#245a8d; border:2px solid #a9cdf0; }
  .banner.old { background:#ffe3e3; color:#b3261e; border:2px solid #f0a5a0; }
  .banner.draft { background:#fff3d6; color:#8a5a00; border:2px solid #f0d28a; }
  .msg { white-space:pre-wrap; line-height:1.7; font-size:17px; word-break:break-word; background:#fffafc; border-radius:12px; padding:12px; }
  .msg.dim { opacity:.55; }
  .msg a.lnk { color:#b8236b; text-decoration:underline; word-break:break-all; font-weight:500; }
  .msg.dim a.lnk { pointer-events:auto; }
  .row { display:flex; justify-content:center; margin-top:14px; }
  button { font:inherit; font-weight:600; font-size:18px; background:var(--fuchsia); color:#fff; border:0; border-radius:14px; padding:14px 26px; cursor:pointer; min-width:230px; }
  button:active { transform:scale(.98); }
  button.done { background:#2f9e6e; }
  button:disabled { background:#cfc6ca; cursor:not-allowed; }
  .poll h3 { margin:16px 0 8px; font-size:16px; color:var(--fuchsia); text-align:center; }
  .empty { text-align:center; padding:30px 10px; color:#777; }
</style>
</head>
<body>
<main>
  <h1>ההודעות לקבוצות</h1>
  <p class="sub" id="sub">טוען...</p>
  <div id="app"></div>
</main>
<script>
const fmtDay = new Intl.DateTimeFormat('he-IL', { timeZone: 'Asia/Jerusalem', weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
const todayIL = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem' }).format(new Date());
const dayText = ymd => { const [Y, M, D] = ymd.split('-').map(Number); return fmtDay.format(new Date(Date.UTC(Y, M - 1, D, 9))); };

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta); return ok;
}
function copyButton(text, label, doneText, disabled) {
  const row = document.createElement('div'); row.className = 'row';
  const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.disabled = !!disabled;
  b.addEventListener('click', async () => {
    const ok = await copyText(text);
    b.textContent = ok ? doneText : 'לא הצלחתי להעתיק, אפשר ללחוץ ארוך על הטקסט ולבחור העתקה';
    b.classList.toggle('done', ok);
    setTimeout(() => { b.textContent = label; b.classList.remove('done'); }, 3500);
  });
  row.appendChild(b); return row;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
// the message text with its web addresses as real links, so Hen and Hani can open and check them (the copy button still copies the plain text)
function linkified(cls, text) {
  const d = el('div', cls);
  const re = /https?:\/\/[^\s)]+/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) d.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement('a'); a.href = m[0]; a.target = '_blank'; a.rel = 'noopener'; a.textContent = m[0]; a.className = 'lnk'; d.appendChild(a);
    last = m.index + m[0].length;
  }
  if (last < text.length) d.appendChild(document.createTextNode(text.slice(last)));
  return d;
}

function render(m, today, isStale, compact) {
  const card = el('div', 'card');
  if (!compact) {
    card.appendChild(el('p', 'when', 'ההודעה של ' + dayText(m.forDate) + (m.sendTime ? ', בשעה ' + m.sendTime : '')));
    if (m.group) card.appendChild(el('p', 'group', m.group + (m.label ? ' · ' + m.label : '')));
  } else if (m.label) card.appendChild(el('p', 'group', m.label));
  if (m.updated) card.appendChild(el('p', 'stamp', 'נכתבה ועודכנה: ' + m.updated));
  const bn = el('div', 'banner');
  if (isStale) { bn.className += ' old'; bn.textContent = 'שימי לב: זו הודעה של ' + dayText(m.forDate) + ', לא של היום. ההודעה החדשה עדיין לא עלתה, אל תעתיקי את זו.'; }
  else if (!m.approved) { bn.className += ' draft'; bn.textContent = 'ההודעה עדיין ממתינה לאישור של חן. אל תעתיקי עדיין, תקבלי תזכורת בוואטסאפ כשהיא מוכנה.'; }
  else if (m.forDate === today) { bn.className += ' ok'; bn.textContent = 'זו ההודעה של היום. אפשר להעתיק ולשלוח בקבוצה.'; }
  else { bn.className += ' soon'; bn.textContent = 'זו ההודעה הבאה, והיא מיועדת ל' + dayText(m.forDate) + '.'; }
  card.appendChild(bn);
  card.appendChild(linkified('msg' + (m.approved && !isStale ? '' : ' dim'), m.text));
  const canCopy = m.approved && !isStale;
  card.appendChild(copyButton(m.text, 'העתקת ההודעה', 'הועתק! אפשר להדביק בקבוצה', !canCopy));
  if (m.poll && m.poll.length) {
    const p = el('div', 'poll'); p.appendChild(el('h3', null, 'סקר: נושאים ליצירה בקבוצה (בחירה אחת)'));
    p.appendChild(el('div', 'msg' + (canCopy ? '' : ' dim'), m.poll.join('\n')));
    p.appendChild(copyButton(m.poll.join('\n'), 'העתקת נושאי הסקר', 'הועתק!', !canCopy));
    card.appendChild(p);
  }
  return card;
}

(async () => {
  const app = document.getElementById('app');
  try {
    const r = await fetch('messages.json?t=' + Date.now(), { cache: 'no-store' });
    const all = (await r.json()).messages || [];
    const today = todayIL();
    // always the four nearest messages from today on; when a message's day passes, the next one takes its place by itself
    const upcoming = all.filter(m => m.forDate >= today).sort((a, b) => a.forDate.localeCompare(b.forDate) || (a.sendTime || '').localeCompare(b.sendTime || ''));
    // one box per date (the nearest three dates); inside it two columns, mom club on the right and the prep-for-first-grade group on the left, each under its own big colored heading
    const groupKey = m => m.kind === 'prep' ? 'prep' : m.kind === 'wednesday' ? 'train' : 'club';
    const GROUPS = { club: ['מועדון האימהות', 'הודעה לקבוצת הוואטסאפ של מועדון האימהות'], prep: ['הכנה לכיתה א\' ולימוד קריאה', 'הודעה לקבוצת הוואטסאפ של מתענייני ההכנה לכיתה א\''], train: ['תוכנית ההכשרה', 'הודעה לקבוצת הוואטסאפ של תוכנית ההכשרה'] };
    let dates = [...new Set(upcoming.map(m => m.forDate))].slice(0, 3);
    let stale = false;
    if (!dates.length) {
      const last = all.slice().sort((a, b) => b.forDate.localeCompare(a.forDate))[0];
      if (last) { dates = [last.forDate]; stale = true; }
    }
    document.getElementById('sub').textContent = dates.length ? 'בכל יום ראשון יש שתי הודעות להעתקה, אחת לכל קבוצה. התאריך הקרוב למעלה, והבא מתחתיו. הדף מתעדכן לבד ובחצות התאריך שעבר מוחלף בבא' : '';
    if (!dates.length) app.innerHTML = '<div class="card empty">אין כרגע הודעה. כשתהיה, תגיע תזכורת בוואטסאפ.</div>';
    dates.forEach((d, i) => {
      const box = el('div', 'daybox');
      const hd = el('h2', 'dayhead', dayText(d));
      const diff = Math.round((Date.parse(d + 'T12:00:00Z') - Date.parse(today + 'T12:00:00Z')) / 864e5);
      hd.appendChild(el('small', null, stale ? 'ההודעה האחרונה שיש' : diff <= 0 ? 'היום' : diff === 1 ? 'מחר' : diff === 2 ? 'בעוד יומיים' : 'בעוד ' + diff + ' ימים'));
      box.appendChild(hd);
      const cols = el('div', 'cols');
      const day = all.filter(m => m.forDate === d).sort((a, b) => (b.id === 'prep-intro') - (a.id === 'prep-intro'));
      ['club', 'prep'].forEach(k => {
        const col = el('div', 'col ' + k);
        const g = el('h3', 'ghead ' + k, GROUPS[k][0]); g.appendChild(el('small', null, GROUPS[k][1]));
        col.appendChild(g);
        const mine = day.filter(m => groupKey(m) === k);
        if (mine.length) mine.forEach(m => col.appendChild(render(m, today, stale, true)));
        else col.appendChild(el('div', 'nomsg', 'אין הודעה לקבוצה הזאת בתאריך הזה'));
        cols.appendChild(col);
      });
      // the longer message gets a slightly wider column and a slightly smaller text, so both end on about the same line (Hen, 8.11.26)
      const lenOf = k => day.filter(m => groupKey(m) === k).reduce((s, m) => s + (m.text || '').length, 0);
      const lc = lenOf('club'), lp = lenOf('prep');
      if (lc && lp && Math.max(lc, lp) / Math.min(lc, lp) > 1.15) {
        const r = Math.max(lc, lp) / Math.min(lc, lp), longIdx = lp > lc ? 1 : 0;
        const wide = Math.min(1.45, 1 + (r - 1) * 0.3), w = [1, 1]; w[longIdx] = wide;
        cols.style.gridTemplateColumns = w[0] + 'fr ' + w[1] + 'fr';
        const base = innerWidth <= 760 ? 13 : 17;
        const fs = Math.max(base * 0.76, base / Math.pow(r, 0.4));
        cols.children[longIdx].querySelectorAll('.msg').forEach(x => { x.style.fontSize = fs.toFixed(1) + 'px'; x.style.lineHeight = '1.55'; });
        cols.children[longIdx].querySelectorAll('.msg a.lnk').forEach(x => { x.style.fontSize = (fs * 0.92).toFixed(1) + 'px'; });
      }
      const tr = day.filter(m => groupKey(m) === 'train');
      if (tr.length) {
        const col = el('div', 'col train full');
        const g = el('h3', 'ghead train', GROUPS.train[0]); g.appendChild(el('small', null, GROUPS.train[1])); col.appendChild(g);
        tr.forEach(m => col.appendChild(render(m, today, stale, true)));
        cols.appendChild(col);
      }
      box.appendChild(cols);
      app.appendChild(box);
    });
  } catch (e) {
    document.getElementById('sub').textContent = '';
    app.innerHTML = '<div class="card empty">לא הצלחתי לטעון את ההודעות כרגע. אפשר לנסות לרענן את הדף.</div>';
  }
})();
</script>
</body>
</html>
