<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ההודעה לקבוצה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --pink:#f9c9d8; --pink-soft:#fdeaf0; --fuchsia:#d6336c; --mint:#d8f3e8; --sky:#dcefff; --gold:#b8892b; --ink:#2b2b33; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Rubik','Open Sans',Arial,sans-serif; color:var(--ink); background:linear-gradient(180deg,var(--pink-soft),#fff 40%,var(--sky)); min-height:100vh; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { text-align:center; font-size:26px; margin:8px 0 4px; color:var(--gold); font-weight:600; }
  .sub { text-align:center; margin:0 0 18px; color:#666; font-size:15px; }
  .card { background:#fff; border-radius:18px; padding:18px; box-shadow:0 4px 18px rgba(214,51,108,.10); border:2px solid var(--pink); margin-bottom:18px; }
  .msg { white-space:pre-wrap; line-height:1.7; font-size:17px; word-break:break-word; }
  .row { display:flex; justify-content:center; margin-top:16px; }
  button { font:inherit; font-weight:600; font-size:18px; background:var(--fuchsia); color:#fff; border:0; border-radius:14px; padding:14px 26px; cursor:pointer; min-width:230px; }
  button:active { transform:scale(.98); }
  button.done { background:#2f9e6e; }
  .poll h2 { margin:0 0 8px; font-size:18px; color:var(--fuchsia); }
  .stamp { text-align:center; color:#888; font-size:13px; margin-top:6px; }
  .empty { text-align:center; padding:30px 10px; color:#777; }
</style>
</head>
<body>
<main>
  <h1 id="title">ההודעה לקבוצה</h1>
  <p class="sub" id="sub">טוען את ההודעה...</p>
  <div id="app"></div>
  <p class="stamp" id="stamp"></p>
</main>
<script>
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta); return ok;
}
function block(label, text, btnText, doneText, cls) {
  const card = document.createElement('div'); card.className = 'card ' + (cls || '');
  if (label) { const h = document.createElement('h2'); h.textContent = label; card.appendChild(h); }
  const m = document.createElement('div'); m.className = 'msg'; m.textContent = text; card.appendChild(m);
  const row = document.createElement('div'); row.className = 'row';
  const b = document.createElement('button'); b.type = 'button'; b.textContent = btnText;
  b.addEventListener('click', async () => {
    const ok = await copyText(text);
    b.textContent = ok ? doneText : 'לא הצלחתי להעתיק, אפשר ללחוץ ארוך על הטקסט ולבחור העתקה';
    b.classList.toggle('done', ok);
    setTimeout(() => { b.textContent = btnText; b.classList.remove('done'); }, 3500);
  });
  row.appendChild(b); card.appendChild(row);
  return card;
}
(async () => {
  const app = document.getElementById('app');
  try {
    const r = await fetch('message.json?t=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    document.getElementById('title').textContent = d.title || 'ההודעה לקבוצה';
    document.getElementById('sub').textContent = d.group ? 'להעתקה והדבקה ב' + d.group : '';
    app.appendChild(block('', d.text, 'העתקת ההודעה', 'הועתק! אפשר להדביק בקבוצה'));
    if (d.poll && d.poll.length) {
      const pollText = d.poll.join('\n');
      app.appendChild(block('סקר: נושאים ליצירה בקבוצה (בחירה אחת)', pollText, 'העתקת נושאי הסקר', 'הועתק!', 'poll'));
    }
    document.getElementById('stamp').textContent = d.updated ? 'עודכן: ' + d.updated : '';
  } catch (e) {
    document.getElementById('sub').textContent = '';
    app.innerHTML = '<div class="card empty">לא הצלחתי לטעון את ההודעה כרגע. אפשר לנסות לרענן את הדף.</div>';
  }
})();
</script>
</body>
</html>
