<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>איפה הפרפר?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* מחפשים בתמונה לפעוטות (חן, 31.10.26: במקום "איפה פרפר? הנה פרפר" של clic.kim). תמונה אחת מקנבה בסגנון שלה,
   נוגעים בכל פרפר: הוא מתנפנף, נשמע "הִנֵּה פַּרְפַּר!" ונדלקת נקודה. אין טעויות: נגיעה במקום אחר רק צליל רך.
   אחרי כמה שניות בלי למצוא, פרפר אחד מנצנץ כרמז. כתובת: ?set=<שם> (הסטים ב-find/sets). */
:root{--pink:#FDE1EA;--pink2:#FBC5D6;--fuchsia:#EF406E;--deep:#B8236B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#FEF6F5;font-family:Rubik,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px}
.hud{width:100%;max-width:900px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.goal{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--deep);font-size:clamp(15px,3.8vw,20px)}
.spk,.mute,.fs{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 3px var(--pink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.spk svg,.mute svg,.fs svg{width:21px;height:21px}
#stage{position:relative;flex:1;min-height:0;width:100%;max-width:900px;display:flex;align-items:center;justify-content:center}
.pic{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 0 0 4px var(--pink2),0 10px 24px rgba(239,64,110,.14);touch-action:manipulation}
.pic img.bg{display:block;width:100%;height:100%;pointer-events:none}
.hot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer}
.hot.found{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--fuchsia);animation:flap .8s ease-in-out 2;pointer-events:none}
@keyframes flap{30%{transform:translate(-50%,-50%) scale(1.25) rotate(-6deg)}60%{transform:translate(-50%,-50%) scale(1.15) rotate(6deg)}}
.hot.hint{animation:hint 1.1s ease-in-out infinite}
@keyframes hint{50%{box-shadow:0 0 0 5px rgba(255,255,255,.9),0 0 26px 10px rgba(239,64,110,.75)}}
.ring{position:absolute;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--pink2);pointer-events:none;animation:rp .5s ease-out forwards}
@keyframes rp{from{width:10px;height:10px;opacity:1}to{width:70px;height:70px;opacity:0}}
.dots{display:flex;gap:5px;flex-wrap:wrap;max-width:120px}.dots i{width:13px;height:13px;border-radius:50%;background:#F6D3DC;display:block}.dots i.on{background:var(--fuchsia)}
.word{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#fff;border-radius:22px;padding:8px 22px;font-size:30px;font-weight:800;color:var(--deep);box-shadow:0 8px 22px rgba(239,64,110,.2),0 0 0 4px var(--pink);pointer-events:none;z-index:30;white-space:nowrap}
.word.show{animation:wd 1.3s ease forwards}
@keyframes wd{15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.overlay{position:fixed;inset:0;background:rgba(253,225,234,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.overlay.hidden{display:none}
.card{background:#fff;border-radius:28px;padding:22px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(239,64,110,.18),0 0 0 4px var(--pink);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.card h2{margin:6px 0 14px;color:var(--deep);font-size:26px}
.btn{font-family:inherit;font-size:22px;font-weight:800;color:#fff;background:var(--fuchsia);border:0;border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 5px 0 #C92E57}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:41;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hud">
  <span class="dots" id="dots"></span>
  <span class="goal"><span id="ins"></span><button class="spk" id="spk" type="button" aria-label="להשמיע את ההנחיה"><svg viewBox="0 0 24 24" fill="#EF406E"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#EF406E" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button></span>
  <button class="mute" id="mute" type="button" aria-label="השתקת צליל"><svg viewBox="0 0 24 24"><path d="M9 17V5l10-2v12" stroke="#EF406E" stroke-width="2.2" fill="none" stroke-linejoin="round"/><circle cx="6.5" cy="17" r="2.6" fill="#EF406E"/><circle cx="16.5" cy="15" r="2.6" fill="#EF406E"/><path id="muteX" d="M3 3l18 18" stroke="#B8236B" stroke-width="2.4" stroke-linecap="round" style="display:none"/></svg></button>
  <button class="fs" id="fs" type="button" aria-label="מסך מלא"><svg viewBox="0 0 24 24" fill="none" stroke="#EF406E" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
 </div>
 <div id="stage"><div class="pic" id="pic"></div><div class="word" id="word"></div></div>
</div>
<div class="overlay hidden" id="ov"><div class="card" id="card"></div></div>
<script src="../ios-audio.js"></script>
<script src="../hen-voice.js"></script>
<script>
(function(){
var Q=new URLSearchParams(location.search), BASE='../', SET=null, found=0, idle=0, muted=false, AC=null, aud=new Audio(), touched=false, hots=[];
var pic=document.getElementById('pic'), stage=document.getElementById('stage'), ov=document.getElementById('ov'), card=document.getElementById('card');
function key(t){t=String(t||'').replace(/\s+/g,' ').trim();var h=2166136261;for(var i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return('0000000'+h.toString(16)).slice(-8)}
function say(t,cb){ if(muted||!t||!touched){cb&&setTimeout(cb,200);return} HenVoice.url(t,BASE+'play/assets/tts/'+key(t)+'.mp3',function(u){ try{aud.pause()}catch(e){} aud=WGAudio.play(u); aud.onended=function(){cb&&cb()}; aud.onerror=function(){cb&&cb()}; aud.play().catch(function(){cb&&cb()}) }) }
function ac(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume() }catch(e){} return AC }
function tone(f1,f2,d,vol,type){ if(muted||!ac())return; var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime; o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.1,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02) }
function chime(){ [784,988,1319].forEach(function(f,i){ setTimeout(function(){ tone(f,f*1.01,.22,.07) },i*80) }) }
function layout(){ if(!SET) return; var sr=stage.getBoundingClientRect(), ar=SET.w/SET.h, w=sr.width, h=w/ar; if(h>sr.height){ h=sr.height; w=h*ar } pic.style.width=w+'px'; pic.style.height=h+'px';
  hots.forEach(function(o){ var d=Math.max(44,o.r*2/SET.w*w); Object.assign(o.el.style,{left:(o.x/SET.w*100)+'%',top:(o.y/SET.h*100)+'%',width:d+'px',height:d+'px'}) }) }
function dots(){ var h=''; for(var i=0;i<hots.length;i++) h+='<i class="'+(i<found?'on':'')+'"></i>'; document.getElementById('dots').innerHTML=h }
function build(){ pic.innerHTML='<img class="bg" src="'+SET.img+'" alt="">'; found=0; idle=0;
  hots=SET.items.map(function(it){ var e=document.createElement('div'); e.className='hot'; pic.appendChild(e); var o={el:e,x:it.x,y:it.y,r:it.r,done:false};
    e.addEventListener('pointerdown',function(ev){ ev.stopPropagation(); touched=true; ac(); hit(o) }); return o });
  dots(); layout() }
function hit(o){ if(o.done) return; o.done=true; idle=0; clearHint(); o.el.classList.add('found'); chime(); found++; dots();
  var w=document.getElementById('word'); w.textContent=SET.foundText; w.classList.remove('show'); void w.offsetWidth; w.classList.add('show');
  say(SET.found,function(){ if(found>=hots.length) end() }) }
pic.addEventListener('pointerdown',function(e){ touched=true; ac(); idle=0; var r=pic.getBoundingClientRect(), g=document.createElement('div'); g.className='ring'; g.style.left=(e.clientX-r.left)+'px'; g.style.top=(e.clientY-r.top)+'px'; pic.appendChild(g); setTimeout(function(){g.remove()},520); tone(330,300,.1,.05,'triangle') });
function confetti(){ var c=['#EF406E','#FBC5D6','#9FDCC7','#BFE3F5','#FFE08A']; for(var i=0;i<40;i++){ var d=document.createElement('div'); d.className='conf'; d.style.left=Math.random()*100+'vw'; d.style.background=c[i%5]; d.style.animationDelay=(Math.random()*.6)+'s'; document.body.appendChild(d); setTimeout(function(x){return function(){x.remove()}}(d),3400) } }
function end(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,f*1.003,.45,.07) },i*120) }); confetti();
  ov.classList.remove('hidden'); card.innerHTML='<h2>'+SET.doneText+'</h2><button class="btn" id="go">מְשַׂחֲקִים שׁוּב</button>';
  document.getElementById('go').onclick=function(){ ov.classList.add('hidden'); build() }; say(SET.done); try{ window.WGEnd&&(WGEnd.replay=function(){ document.getElementById('go').click() },WGEnd()) }catch(e){} }
function clearHint(){ hots.forEach(function(o){ o.el.classList.remove('hint') }) }
setInterval(function(){ if(!SET||!ov.classList.contains('hidden')||!touched) return; idle++; if(idle===8){ var o=hots.filter(function(x){return !x.done})[0]; if(o) o.el.classList.add('hint') } },1000);
document.getElementById('spk').onclick=function(){ touched=true; ac(); say(SET.insSay||SET.ins) };
document.getElementById('mute').onclick=function(){ muted=!muted; document.getElementById('muteX').style.display=muted?'':'none'; if(muted) try{aud.pause()}catch(e){} };
document.getElementById('fs').onclick=function(){ var d=document.documentElement; if(document.fullscreenElement) document.exitFullscreen(); else (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d) };
addEventListener('resize',layout);
window.__F=function(){ return {found:found,n:hots.length,over:!ov.classList.contains('hidden'),hots:hots.map(function(o){ var r=o.el.getBoundingClientRect(); return {done:o.done,x:r.left+r.width/2,y:r.top+r.height/2,w:r.width} })} };
fetch('sets/'+(Q.get('set')||'butterflies')+'.json?v=1').then(function(r){return r.json()}).then(function(s){ SET=s; document.title=s.title; document.getElementById('ins').textContent=s.ins; build() });
})();
</script>
<script src="../end-fs.js"></script><script src="../first-ins.js"></script>
</body>
</html>
