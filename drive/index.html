<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>מובילים את האות</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:Rubik,Arial,sans-serif;color:#5E5A73;background:linear-gradient(180deg,#fff 0%,#FEF6F5 60%,#FDE1EA 100%);touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;height:46px}
.ttl{flex:1;text-align:center;font-weight:800;font-size:18px;color:#B8236B}
.ib{flex:none;height:34px;border-radius:20px;border:2.5px solid #FBC5D6;background:#FDE1EA;color:#B8236B;font:700 13px Rubik;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 12px}
.dots{flex:none;display:flex;gap:6px;justify-content:center;height:14px}.dots i{width:10px;height:10px;border-radius:50%;background:#FBD9D6}.dots i.on{background:#4FB38C}
#stage{flex:1;min-height:0;position:relative}

.again{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:#EF406E;color:#fff;border:0;font:800 20px Rubik;padding:12px 30px;border-radius:99px;box-shadow:0 5px 0 #D14175;cursor:pointer;display:none;z-index:5}
canvas#cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style></head><body>
<div id="app"><div class="top"><button class="ib" id="fs" type="button">&#x26F6; מסך מלא</button><div class="ttl" id="ttl"></div><div style="width:92px"></div></div>
<div class="dots" id="dots"></div>
<div id="stage"><svg id="sv" viewBox="0 0 420 520" preserveAspectRatio="xMidYMid meet"></svg><canvas id="cf"></canvas><button class="again" id="again" type="button">עוד פעם</button></div></div>
<script>
var Q=new URLSearchParams(location.search),L=Q.get('l')||'ה',BASE=location.pathname.replace(/[^\/]*$/,'')+'img/';
var ROUNDS=[
 {veh:'police',dest:'policest',vw:112,dw:150,d:'M70 470 C70 400 335 420 335 330 C335 250 200 250 195 190 C192 150 250 150 292 122',deco:[['cone',350,455,46],['cone',40,300,44]]},
 {veh:'ambulance',dest:'hospital',vw:118,dw:150,d:'M352 470 C352 400 85 420 85 330 C85 250 220 250 225 190 C228 150 170 150 128 122',deco:[['cone',60,455,46],['cone',372,290,44]]}
];
var SV=document.getElementById('sv'),NS='http://www.w3.org/2000/svg',ri=0,cur=0,drag=false,busy=false,pts=[],pathEl=null,car=null,lastTone=0;
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
/* audio */
var AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
['pointerdown','touchstart','click'].forEach(function(e){document.addEventListener(e,function(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(x){}ac()},{capture:true,passive:true})});
function tone(f,d,ty,v,at){var a=ac();if(!a)return;var t=a.currentTime+(at||0),o=a.createOscillator(),g=a.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function pick(){tone(520,.12,'triangle',.1);tone(780,.14,'triangle',.08,.07)}
function bad(){tone(300,.18,'sine',.1);tone(240,.22,'sine',.08,.1)}
function win(){[523,659,784,1047].forEach(function(f,i){tone(f,.28,'triangle',.12,i*.11)});setTimeout(function(){[1047,1319,1568].forEach(function(f,i){tone(f,.25,'sine',.07,i*.08)})},500)}
function beep(){var n=Date.now();if(n-lastTone<140)return;lastTone=n;tone(300+cur*260,.1,'sine',.03)}
/* build round */
function build(){
 SV.innerHTML='';busy=false;drag=false;cur=0;var R=ROUNDS[ri];
 document.getElementById('ttl').textContent='מובילים את האות '+L;
 var dd=document.getElementById('dots');dd.innerHTML='';ROUNDS.forEach(function(x,i){var d=document.createElement('i');if(i<ri)d.className='on';dd.appendChild(d)});
 var g=el('g',{},SV);
 el('rect',{x:-20,y:-20,width:460,height:560,fill:'#FEF6F5'},g);
 el('ellipse',{cx:60,cy:500,rx:150,ry:60,fill:'#D4EFE2',opacity:.8},g);el('ellipse',{cx:370,cy:60,rx:130,ry:70,fill:'#D3E8F8',opacity:.8},g);el('ellipse',{cx:380,cy:300,rx:80,ry:120,fill:'#FDE1EA',opacity:.9},g);
 R.deco.forEach(function(c){el('image',{href:BASE+c[0]+'.png',x:c[1]-c[3]/2,y:c[2]-c[3],width:c[3],height:c[3]*0.9},g)});
 el('path',{d:R.d,fill:'none',stroke:'#7C86A0','stroke-width':84,'stroke-linecap':'round','stroke-linejoin':'round'},g);
 pathEl=el('path',{d:R.d,fill:'none',stroke:'#A9B2C6','stroke-width':74,'stroke-linecap':'round','stroke-linejoin':'round'},g);
 el('path',{d:R.d,fill:'none',stroke:'#fff','stroke-width':4,'stroke-dasharray':'14 14','stroke-linecap':'butt',opacity:.9},g);
 var len=pathEl.getTotalLength();pts=[];for(var s=0;s<=len;s+=3)pts.push(pathEl.getPointAtLength(s));pts.push(pathEl.getPointAtLength(len));
 var end=pts[pts.length-1],st=pts[0];
 var dest=el('image',{href:BASE+R.dest+'.png',x:end.x-R.dw/2,y:end.y-R.dw*0.72,width:R.dw,height:R.dw*0.74},g);
 R.__dest=dest;
 /* car with letter */
 car=el('g',{},SV);var cw=R.vw,ch=R.vw*0.7;
 var im=el('image',{href:BASE+R.veh+'.png',x:-cw/2,y:-ch/2,width:cw,height:ch},car);
 var b=el('circle',{cx:cw*0.02,cy:ch*0.06,r:cw*0.2,fill:'#fff',stroke:'#F8B9B6','stroke-width':3},car);
 var tx=el('text',{x:cw*0.02,y:ch*0.06+cw*0.115,'text-anchor':'middle','font-family':'Rubik,Arial','font-weight':800,'font-size':cw*0.34,fill:'#B8236B'},car);tx.textContent=L;
 R.__car=car;place(0);
 /* demo glow */
 var demo=el('circle',{r:9,fill:'#EF406E',opacity:.9},SV);demo.id='demo';
 var t0=performance.now();(function step(t){if(!demo.parentNode||drag||cur>0.02||busy){if(demo.parentNode)demo.remove();return}var p=(Math.max(0,t-t0)%3400)/3400,i=Math.max(0,Math.min(pts.length-1,Math.floor(p*(pts.length-1))));demo.setAttribute('cx',pts[i].x);demo.setAttribute('cy',pts[i].y);demo.setAttribute('opacity',.35+.5*Math.sin(p*Math.PI));requestAnimationFrame(step)})(t0);
}
function place(f){var i=Math.max(0,Math.min(pts.length-1,Math.round(f*(pts.length-1)))),p=pts[i],q=pts[Math.min(pts.length-1,i+4)],pp=pts[Math.max(0,i-4)];var dx=q.x-pp.x;var flip=dx>2?-1:1;if(dx>2)car._f=-1;else if(dx<-2)car._f=1;var sx=car._f||1;car.setAttribute('transform','translate('+p.x+','+p.y+') scale('+(sx===-1?-1:1)+',1)');
 /* keep the letter readable when flipped: counter-flip text/badge */
 var kids=car.children;for(var k=1;k<kids.length;k++){var cw=ROUNDS[ri].vw;var cx=cw*0.02;kids[k].setAttribute('transform',sx===-1?'translate('+(2*cx)+',0) scale(-1,1)':'')}
}
function svgPt(e){var r=SV.getBoundingClientRect(),vb=SV.viewBox.baseVal,s=Math.min(r.width/vb.width,r.height/vb.height),ox=(r.width-vb.width*s)/2,oy=(r.height-vb.height*s)/2;return {x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s,s:s}}
function nearest(p,from,to){to=Math.min(to,pts.length-1);from=Math.max(0,from);var best=-1,bd=1e9;for(var i=from;i<=to;i++){var dx=pts[i].x-p.x,dy=pts[i].y-p.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}}return {i:best,d:Math.sqrt(bd)}}
function fail(){drag=false;bad();car.style.transition='';cur=0;place(0);build.shake&&0;var c=car;c.animate&&0}
SV.addEventListener('pointerdown',function(e){if(busy)return;e.preventDefault();var p=svgPt(e),i0=Math.round(cur*(pts.length-1)),n=nearest(p,Math.max(0,i0-4),Math.min(pts.length-1,i0+4));if(cur===0){var d0=Math.hypot(p.x-pts[0].x,p.y-pts[0].y);if(d0>70)return}else if(n.d>70)return;drag=true;try{SV.setPointerCapture(e.pointerId)}catch(x){}pick();var dm=document.getElementById('demo');if(dm)dm.remove()});
SV.addEventListener('pointermove',function(e){if(!drag||busy)return;e.preventDefault();var p=svgPt(e),i0=Math.round(cur*(pts.length-1)),n=nearest(p,Math.max(0,i0-8),Math.min(pts.length-1,i0+22));if(n.d>58){fail();return}if(n.i>i0){cur=n.i/(pts.length-1);place(cur);beep();if(cur>=0.985)arrive()}});
function release(e){if(!drag||busy)return;drag=false;if(cur<0.985){bad();cur=0;place(0);setTimeout(demoAgain,300)}}
SV.addEventListener('pointerup',release);SV.addEventListener('pointercancel',release);
function demoAgain(){if(busy||cur>0||SV.querySelector('#demo'))return;var demo=el('circle',{r:9,fill:'#EF406E',opacity:.9},SV);demo.id='demo';var t0=performance.now();(function step(t){if(!demo.parentNode||drag||cur>0.02||busy){if(demo.parentNode)demo.remove();return}var p=(Math.max(0,t-t0)%3400)/3400,i=Math.max(0,Math.min(pts.length-1,Math.floor(p*(pts.length-1))));demo.setAttribute('cx',pts[i].x);demo.setAttribute('cy',pts[i].y);demo.setAttribute('opacity',.35+.5*Math.sin(p*Math.PI));requestAnimationFrame(step)})(t0)}
function arrive(){busy=true;drag=false;place(1);win();confetti();var R=ROUNDS[ri],d=R.__dest;d.animate&&d.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:500});
 setTimeout(function(){ri++;if(ri>=ROUNDS.length){document.getElementById('dots').querySelectorAll('i').forEach(function(i){i.className='on'});document.getElementById('again').style.display='block'}else build()},1600)}
document.getElementById('again').onclick=function(){this.style.display='none';ri=0;build()};
/* confetti */
var cf=document.getElementById('cf'),cx=cf.getContext('2d'),parts=[];
function size(){cf.width=cf.clientWidth*2;cf.height=cf.clientHeight*2}addEventListener('resize',size);
function confetti(){size();var C=['#F8B9B6','#8FD3B6','#B7CDE0','#F6DC8A','#EF8CA5'];for(var i=0;i<70;i++)parts.push({x:cf.width/2,y:cf.height*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:5+Math.random()*7,c:C[i%5],a:1});run()}
var run=function(){cx.clearRect(0,0,cf.width,cf.height);parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a-=.012;cx.globalAlpha=Math.max(0,p.a);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.4)});parts=parts.filter(function(p){return p.a>0});if(parts.length)requestAnimationFrame(run);else cx.clearRect(0,0,cf.width,cf.height)};
/* fullscreen */
var fb=document.getElementById('fs');fb.onclick=function(){var d=document.documentElement,rq=d.requestFullscreen||d.webkitRequestFullscreen;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}if(rq){try{var r=rq.call(d);if(r&&r.catch)r.catch(function(){window.open(location.href,'_blank')})}catch(x){window.open(location.href,'_blank')}}else if(window.self!==window.top)window.open(location.href,'_blank')};
document.addEventListener('contextmenu',function(e){e.preventDefault()});
window.__drive={pts:function(){return pts},len:function(){return pathEl.getTotalLength()},rounds:ROUNDS.length,cur:function(){return cur}};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){build()});setTimeout(function(){if(!pts.length)build()},1500);
</script></body></html>
