<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>מיפוי בזמן אמת ומעקב התקדמות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="../hen-voice.js"></script>
<style>
:root{
  --bg:#fff8fa; --card:#ffffff; --ink:#2b3138; --muted:#6b6f78; --line:#f3d3de;
  --pink:#fde1ea; --pink2:#fbc5d6; --pink-strong:#d14175; --pink-deep:#b8236b;
  --mint:#d3f0e1; --mint-ink:#1f6b4a; --sky:#d8ecfa; --sky-ink:#245e8c; --sun:#ffeeba; --sun-ink:#8a5a00;
  --head:'Rubik','Open Sans',Arial,sans-serif; --body:'Open Sans','Rubik',Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:16px 16px 60px;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
#main.wrap{margin:0}
h1,h2,h3{font-family:var(--head);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:1.55rem;color:var(--pink-deep)} h2{font-size:1.1rem} h3{font-size:1rem}
.note{font-size:.85rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pink-strong);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.acct{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.btn{border:1.5px solid var(--pink-strong);background:var(--pink);color:var(--pink-deep);border-radius:14px;padding:9px 16px;font-weight:700}
.btn.solid{background:var(--pink-strong);color:#fff}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted);font-weight:600}
.btn.mint{border-color:var(--mint-ink);background:var(--mint);color:var(--mint-ink)}
.btn.danger{border-color:#c0392b;color:#c0392b;background:transparent}
.btn.sm{padding:5px 11px;font-size:.82rem;border-radius:11px}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:11px 8px;font-weight:800;font-family:var(--head);text-align:center}
.tab.on{background:var(--pink);border-color:var(--pink-strong);color:var(--pink-deep)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-weight:600}
.chip.on{background:var(--pink-strong);border-color:var(--pink-strong);color:#fff}
.chip.add{border-style:dashed;color:var(--pink-deep)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 140px}
.field>label,.lbl{font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;text-align:start;direction:rtl}
input[type=date]::-webkit-date-and-time-value{text-align:start;min-height:1.3em}
.meta input{height:44px;min-height:44px}
.ruled{background-image:repeating-linear-gradient(transparent,transparent 27px,#e7c3d1 28px);line-height:28px;padding:0 8px;background-color:#fff;min-height:84px}

/* ===== דף המיפוי ===== */
.sheet{background:#fff;border:2px solid var(--pink2);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet .title{text-align:center;font-family:var(--head);font-weight:800;font-size:1.35rem;color:var(--pink-deep)}
.sheet .sub{text-align:center;font-size:.82rem;color:var(--muted);margin-top:-8px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px}
.meta>*{min-width:0}
.panel{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;background:#fff}
.panel>h3{display:flex;align-items:center;gap:9px;font-size:1rem}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:800}
.n1{background:var(--pink-strong)} .n2{background:#3aa57a} .n3{background:#4a90c2} .n4{background:#d9a21b}
.panel .field,.sum .field,.meta .field{flex:0 0 auto}
.wblock{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.wtop{display:flex;gap:12px;align-items:center}
.panel .field.wbig{flex:1 1 0;min-width:0}
.lvl{min-width:0}
.lvl .pics{flex-wrap:wrap;justify-content:center}
@media(max-width:480px){.pic.big{width:96px;height:96px}.pic.sm{width:46px;height:46px}.wbig input{font-size:1.35rem}}
.wbig input{font-size:1.6rem;font-family:var(--head);font-weight:800;text-align:center;height:64px;min-height:64px}
.pic.big{width:120px;height:120px;object-fit:contain;flex:none;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.pic.sm{width:54px;height:54px;object-fit:contain;border-radius:12px;background:#fff;border:1.5px solid var(--line)}
.pic.nopic{display:grid;place-items:center;color:var(--muted);font-size:.74rem;text-align:center}
.lvls{display:flex;flex-wrap:wrap;gap:8px}
.lvl{flex:1 1 150px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lvl.on{background:var(--pink);border-color:var(--pink-strong)}
.lvl b{font-family:var(--head);color:var(--pink-deep)}
.pics{display:flex;gap:6px}
.wrow{display:flex;gap:8px;align-items:flex-end}
.wrow .field{width:92px;flex:none}
.wrow .pad{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.cbs{display:flex;flex-direction:column;gap:5px}
.cb{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.92rem}
.cb input{position:absolute;opacity:0;width:1px;height:1px}
.bx{flex:none;width:22px;height:22px;border:2px solid var(--ink);border-radius:6px;background:#fff;display:grid;place-items:center}
.bx svg{width:15px;height:15px;stroke:var(--mint-ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
.cb input:checked+.bx{background:var(--mint)}
.cb input:checked+.bx svg{display:block}
.cb input:focus-visible+.bx{outline:3px solid var(--pink-strong);outline-offset:2px}
.cbs.two{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.sec{font-weight:700;font-size:.85rem;color:var(--pink-deep)}
.pad{display:flex;flex-direction:column;gap:4px}
canvas.dc{width:100%;display:block;border:1.5px dashed var(--pink-strong);border-radius:12px;background:#fffdfd;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
.modes{display:flex;flex-wrap:wrap;gap:5px}
.mdb{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.mdb.on{background:var(--pink);border-color:var(--pink-strong);color:var(--pink-deep)}
.pimg{width:100%;max-height:340px;object-fit:contain;border:1.5px dashed var(--pink-strong);border-radius:12px;background:#fffdfd;display:block}
.pimg.empty{padding:26px 0;text-align:center;color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:6px}
.wordchips{display:flex;flex-wrap:wrap;gap:6px}
.wc{border:1.5px solid var(--line);background:var(--sky);color:var(--sky-ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.88rem}
.wc.hard{background:var(--sun);color:var(--sun-ink)}
.ex{display:grid;grid-template-columns:auto auto auto auto auto;gap:6px;align-items:center;justify-content:start;direction:ltr}
.ex input{width:54px;text-align:center;font-size:1.2rem;padding:6px 2px}
.ex span{font-weight:800;font-size:1.2rem}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.sum h3{font-size:.95rem;color:var(--pink-deep)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.nwc{border:1.5px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.nww{font-family:Arial,'Noto Sans Hebrew','Open Sans',sans-serif;font-weight:700;font-size:1.9rem;line-height:1.5;direction:rtl}
.nwc .cell{width:56px}
.nwc input{text-align:center;font-size:.9rem}
.sheet.fixed .nwgrid{grid-template-columns:repeat(6,1fr)}
.sheet.fixed .nww{font-size:1.5rem}
.wzentry p{margin:0}
.wprog{display:flex;gap:6px;flex-wrap:wrap}
.wd{width:26px;height:8px;border-radius:99px;background:var(--line)}
.wd.ok{background:var(--pink2)} .wd.on{background:var(--pink-strong)}
.frame{border-radius:18px;padding:10px}
.frame.f0{border:3px dashed var(--pink-strong);background:#fff8fa}
.frame.f1{border:3px solid #3aa57a;background:#f2fbf6;border-radius:30px}
.frame.f2{border:3px dotted #4a90c2;background:#f1f8fd}
.frame.f3{border:5px double #d9a21b;background:#fffaf0;border-radius:10px}
.frame canvas.dc{border:0;background:transparent}
.mkrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mk{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:1.05rem}
.mk small{font-weight:600;font-size:.78rem;color:var(--muted)}
.mk.on.v1{background:var(--mint);border-color:var(--mint-ink);color:var(--mint-ink)}
.mk.on.v2{background:#ffe9b8;border-color:#8a5a00;color:#8a5a00}
.mk.on.v3{background:#fde0e0;border-color:#c0392b;color:#c0392b}
.lngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lnc{border:1.5px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.lbig2{font-family:var(--head);font-weight:800;font-size:3.4rem;line-height:1.1;color:var(--pink-deep)}
.lnc .mk{padding:5px 8px;font-size:.9rem}
.tile{font-family:var(--head);font-weight:800;font-size:3rem;border:2px solid var(--line);background:#fff;color:var(--pink-deep);border-radius:20px;min-height:96px}
.tile.good{background:var(--mint);border-color:var(--mint-ink);color:var(--mint-ink)}
.tile.bad{background:#fde0e0;border-color:#c0392b;color:#c0392b}
.presult{display:flex;flex-wrap:wrap;gap:8px}
.pr{border-radius:999px;padding:4px 12px;font-weight:700;border:1.5px solid var(--line)}
.pr.good{background:var(--mint);color:var(--mint-ink)} .pr.bad{background:#fde0e0;color:#c0392b}
.think{align-items:center;text-align:center;padding:40px 16px}
.thinkface{font-size:4.5rem;animation:bob 1s ease-in-out infinite}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--pink-strong);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.sdet{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 12px;font-size:.92rem}
.stopnote{background:#fff3cd;border:1.5px solid #d9a21b;border-radius:12px;padding:8px 12px;font-size:.88rem}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec.good{color:var(--mint-ink)} .sec.hard{color:#8a5a00}
.sgrid ul{margin:2px 0 0;padding-inline-start:18px;font-size:.85rem}
.sgrid ul.ok li::marker{color:var(--mint-ink);content:'✓ '} .sgrid ul.no li::marker{color:#8a5a00;content:'• '}
.sline{font-size:.88rem;line-height:1.5}
.sNote{white-space:pre-wrap;font-size:.88rem;line-height:1.5}
.sImg{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block}
.sPad{display:flex;flex-direction:column;gap:2px}
.lsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.lres{border:1.5px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem}
.lbig{font-family:var(--head);font-weight:800;font-size:1.8rem;color:var(--pink-deep);line-height:1.1}
.lline{display:flex;gap:6px;align-items:center}
.lline b{min-width:18px;text-align:center}.lline b.g{color:var(--mint-ink)}.lline b.h{color:#8a5a00}.lline b.x{color:#c0392b}
.sumsheet.fixed{font-size:12.5px}
.sumsheet.fixed .lsum{grid-template-columns:repeat(8,1fr)}
.rights{text-align:center;font-size:.72rem;color:var(--muted);line-height:1.6;padding-top:4px}
.sheet .rights{font-size:.7rem;padding-top:0}
.sheet .lt{width:40px;font-size:1.15rem;padding:3px 0;border-radius:11px}
.sheet .letters{gap:5px}
.sheet .lg{padding:6px 9px;gap:5px;border-radius:12px}
.sheet .lg .hd b{font-size:.84rem}
.sheet .gt{padding:3px 9px;font-size:.78rem}
.sheet .matrix{border-spacing:4px}
.sheet .matrix td.sign span{font-size:1.05rem}
.sheet .cell{min-height:32px}
.sheet .legend{font-size:.76rem}

/* מצב קבוע לייצוא לתמונה ולהדפסה: A4 */
.sheet.fixed{width:1000px;border-radius:0;font-size:13.5px;padding:20px;gap:10px}
.sheet.fixed .grid2{grid-template-columns:1fr 1fr}
.sheet.fixed .meta{grid-template-columns:repeat(4,1fr)}
.sheet.fixed .sum{grid-template-columns:repeat(4,1fr)}
.sheet.fixed .tools,.sheet.fixed .noexp{display:none!important}
.sheet.fixed .cb{font-size:13px}
.sheet.fixed .panel{padding:9px;gap:6px}
.sheet.fixed textarea{min-height:50px}
.sheet.fixed .ruled{min-height:70px}
.sheet.fixed .grid2{align-items:start}
@media print{
  @page{size:A4;margin:7mm}
  body{background:#fff;padding:0}
  .noprint,.tools,.noexp{display:none!important}
  .wrap>*:not(#main){display:none!important}
  .mapbar{display:none!important}
  .sheet{border:0;border-radius:0;padding:0;width:100%;font-size:11.5px;gap:7px;box-shadow:none}
  .grid2{grid-template-columns:1fr 1fr!important}
  .meta{grid-template-columns:repeat(4,1fr)!important}
  .sum{grid-template-columns:repeat(4,1fr)!important}
  .panel{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== מעקב ילדים ===== */
.now{background:var(--pink);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.now b{font-family:var(--head);font-size:1.1rem;color:var(--pink-deep)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.bar{display:flex;flex-direction:column;gap:5px;font-size:.84rem}
.bar .track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--pink-strong);border-radius:99px}
.bar.done .fill{background:#3aa57a}
.stabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.stab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:700;white-space:nowrap}
.stab.on{background:var(--pink);border-color:var(--pink-strong);color:var(--pink-deep)}
.stab small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-inline-end:5px;border:1.5px solid var(--line)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.item{display:flex;align-items:center;gap:10px;text-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 12px;min-width:0}
.mark{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:1.5px solid var(--line);color:var(--muted)}
.s1{background:#ffe9b8;border-color:#8a5a00} .s1 .mark{background:#ffe9b8;color:#8a5a00;border-color:#8a5a00}
.s2{background:var(--mint);border-color:var(--mint-ink)} .s2 .mark{background:var(--mint-ink);color:#fff;border-color:var(--mint-ink)}
.lg{border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lg.done{background:#f2fbf6;border-color:var(--mint-ink)}
.lg .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.lg .hd b{font-family:var(--head)}
.letters{display:flex;flex-wrap:wrap;gap:8px}
.lt{font-family:var(--head);font-weight:800;font-size:1.5rem;border:1.5px solid var(--line);background:var(--card);border-radius:14px;width:54px;padding:6px 0;text-align:center}
.lt.s1{background:#ffe9b8;color:#8a5a00} .lt.s2{background:var(--mint);color:var(--mint-ink)}
.gt{border:1.5px solid var(--pink-strong);background:var(--pink);color:var(--pink-deep);border-radius:12px;padding:6px 12px;font-weight:700;font-size:.88rem}
.gt.done{background:var(--mint-ink);border-color:var(--mint-ink);color:#fff}
.matrix{width:100%;border-collapse:separate;border-spacing:6px}
.matrix th{font-size:.82rem;color:var(--muted);font-weight:600;padding:2px}
.matrix td.sign{font-weight:700;padding-inline-end:8px}
.matrix td.sign span{font-family:var(--head);font-size:1.3rem;color:var(--pink-deep);margin-inline-end:8px}
.cell{width:100%;min-height:42px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:800}
.cell.s1{background:#ffe9b8;color:#8a5a00} .cell.s2{background:var(--mint);color:var(--mint-ink)}
.scroll{overflow-x:auto}
.entry{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:9px 12px}
.entry time{font-weight:700;color:var(--pink-deep);flex:0 0 auto;font-size:.86rem}
.entry p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:0 4px}
#toast{position:fixed;inset-inline:0;bottom:16px;display:flex;justify-content:center;pointer-events:none;z-index:50}
#toast span{background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-weight:600;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <div>
      <h1>מיפוי בזמן אמת ומעקב התקדמות</h1>
      <div class="note">מיפוי בשיטת קוראים בקלות: לילדי גן חובה ולילדי כיתות א׳-ב׳</div>
    </div>
    <div class="acct" id="acct"></div>
  </header>
  <nav class="tabs noprint" role="tablist">
    <button type="button" class="tab" role="tab" id="tabMap" data-tab="map">מיפוי גן חובה</button>
    <button type="button" class="tab" role="tab" id="tabKb" data-tab="kb">מיפוי כיתות א׳-ב׳</button>
    <button type="button" class="tab" role="tab" id="tabKids" data-tab="kids">מעקב התקדמות</button>
  </nav>
  <main id="main" class="wrap" style="gap:16px"></main>
  <section class="card noprint" aria-label="גיבוי">
    <h2>גיבוי והעברה</h2>
    <p class="note" id="backupNote"></p>
    <div class="row"><button class="btn" id="copyBackup" type="button">העתיקי גיבוי של הכול</button></div>
    <div class="field"><label for="restoreBox">לשחזור: הדביקי כאן גיבוי שהעתקת קודם</label><textarea id="restoreBox"></textarea></div>
    <div class="row"><button class="btn" id="restoreBtn" type="button">שחזרי מהגיבוי</button></div>
  </section>
  <footer class="rights noprint">כל הזכויות שמורות לחן קלימיאן<br>הכלי מיועד למשתתפות תוכנית ההכשרה בלבד</footer>
</div>
<div id="toast" aria-live="polite"><span hidden></span></div>

<script>
/* ===================== נתונים ושמירה ===================== */
const KEY = 'hen-mapping-v1';
const COLL = 'ChecklistProgress', CLIENT_ID = '058da38e-a911-4b84-876e-e5efedfa9ae9';
const REDIRECT = 'https://hen-kalimian.github.io/writing-games/checklist/';   // הכתובת היחידה שהחיבור לאתר מאשר
const TOK = 'hen-ck-wix-tokens', OA = 'hen-ck-wix-oauth', RET = 'hen-return';
const DOC_COPY = 'https://docs.google.com/document/d/1LfYGhJiEu2vFPrN10m3Wa2zykjhpgzyyfBu2aUdITwE/copy';
let S = { maps: [], children: [], tab: 'map', mapId: null, kbId: null, childId: null, stage: 'num' };
let mem = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function today() { const d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function fmt(d) { if (!d) return ''; const p = d.split('-'); return p[2] + '.' + p[1] + '.' + p[0].slice(2); }
function toast(t) { const e = $('toast').firstElementChild; e.textContent = t; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { e.hidden = true; }, 2400); }
function load() {
  try { const r = localStorage.getItem(KEY); if (r) { Object.assign(S, JSON.parse(r)); return; } } catch (e) {}
  if (mem) Object.assign(S, mem);
}
function persist() { mem = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const mapsOf = k => S.maps.filter(m => !m.del && (m.kind || 'l9') === k);
const kids = () => S.children.filter(c => !c.del);
const curMap = () => S.maps.find(m => m.id === (S.tab === 'kb' ? S.kbId : S.mapId) && !m.del);
const curKid = () => S.children.find(c => c.id === S.childId && !c.del);
const dirty = new Set();
function touch(item, key) { item.u = Date.now(); dirty.add(key); persist(); scheduleSync(); }

function newMap(pre, kind) {
  const z = (n) => Array(n).fill(0);
  if (kind === 'kb') return { id: uid(), u: Date.now(), kind: 'kb', name: (pre && pre.name) || '', age: (pre && pre.age) || '', date: today(), school: '', marks: {},
    dict: { w: ['', '', ''], d: [[], [], []] }, read: { c: z(4), what: '', errs: '', note: '', nwnote: '' }, nw: ['', '', '', '', '', ''],
    s: { strong: '', hard: '', goals: '', recs: '', r: z(5), note: '' } };
  return { id: uid(), u: Date.now(), name: (pre && pre.name) || '', age: (pre && pre.age) || '', date: today(), school: '', parents: '',
    t1: { c: z(4), ask: '', note: '', draw: [] },
    t2: { w: ['', '', ''], d: [[], [], []], t: ['', '', ''], note: '' },
    t3: { c: z(6), e1: ['', '', '', ''], e2: ['', '', '', ''], note: '' },
    t4: { q: '', c: z(10), how: '' },
    s: { strong: '', hard: '', goals: '', recs: '', r: z(5), note: '' } };
}
function getP(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setP(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; }

/* ===================== טופס המיפוי ===================== */
const T1 = ['מזהה אותיות בשם', 'משיים אותיות בשם', 'כותב את השם בעזרת תיווך', 'כותב את השם באופן עצמאי'];
const T3 = ['ספירה', 'מנייה', 'כתיבת מספרים', 'התאמת כמות למספר', 'פותר תרגילי חיבור ללא המחשה', 'פותר בעיות מילוליות ללא המחשה'];
const T4 = ['יכולת למידה', 'תגובה לתיווך', 'זיכרון', 'גמישות', 'קשב', 'יכולת הכללה', 'מוטיבציה', 'תסכול / הימנעות', 'מוכן להתנסות', 'מגלה רצון לנסות שוב'];
const SR = ['קבוצה', 'פרטני', 'מעקב', 'ריפוי בעיסוק', 'הפניה נוספת'];
const LVL = { easy: { t: 'רמה קלה', w: [['פרח', 'prach'], ['דגל', 'degel'], ['פנס', 'panas']] }, hard: { t: 'רמה קשה', w: [['חולצה', 'cholca'], ['מסרק', 'masrek'], ['מסמר', 'masmer']] } };
const picImg = (k, cls, word) => `<img class="${cls}" src="img/${k}.png" alt="" onerror="this.outerHTML='<span class=&quot;${cls} nopic&quot;>${word}</span>'">`;
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l5 5L19 7"/></svg>';
const cb = (p, t, m) => `<label class="cb"><input type="checkbox" data-p="${p}"${getP(m, p) ? ' checked' : ''}><span class="bx">${CHECK}</span><span>${esc(t)}</span></label>`;
const tx = (p, m, ph) => `<input type="text" data-p="${p}" value="${esc(getP(m, p))}"${ph ? ` placeholder="${esc(ph)}"` : ''}>`;
const ta = (p, m, ruled, ph) => `<textarea data-p="${p}" class="${ruled ? 'ruled' : ''}"${ph ? ` placeholder="${esc(ph)}"` : ''}>${esc(getP(m, p))}</textarea>`;
const PM = [['draw', 'כתיבה על המסך'], ['photo', 'צילום או תמונה'], ['note', 'הערה בלבד']];
function pad(p, h, label) {
  const m = curMap(), pm = (m && m.pm && m.pm[p]) || { mode: 'draw' }, mode = pm.mode || 'draw';
  const lb = label ? `<span class="lbl">${esc(label)}</span>` : '';
  const modes = `<div class="modes noprint noexp">${PM.map(x => `<button type="button" class="mdb${x[0] === mode ? ' on' : ''}" data-act="padmode" data-d="${p}" data-mode="${x[0]}">${x[1]}</button>`).join('')}</div>`;
  if (mode === 'photo') return `<div class="pad">${lb}${modes}${pm.img ? `<img class="pimg" alt="תמונה של מה שהילד/ה כתב/ה" src="${pm.img}">` : '<div class="pimg empty">עוד אין תמונה</div>'}<div class="tools noprint"><button type="button" class="btn sm" data-act="padcam" data-d="${p}">פתיחת מצלמה</button><button type="button" class="btn sm quiet" data-act="padgal" data-d="${p}">בחירת תמונה מהגלריה</button>${pm.img ? `<button type="button" class="btn sm quiet" data-act="padrm" data-d="${p}">הסרת התמונה</button>` : ''}</div></div>`;
  if (mode === 'note') return `<div class="pad">${lb}${modes}<textarea class="ruled" data-pn="${p}" placeholder="כתבי כאן מה הילד/ה כתב/ה ואיך הוא/היא כתב/ה">${esc(pm.note || '')}</textarea></div>`;
  return `<div class="pad">${lb}${modes}<canvas class="dc" data-d="${p}" data-h="${h}" width="1000" height="${h}"></canvas><div class="tools noprint"><button type="button" class="btn sm quiet" data-act="undo" data-d="${p}">בטלי קו אחרון</button><button type="button" class="btn sm quiet" data-act="clr" data-d="${p}">נקי הכול</button></div></div>`;
}
const ex = (p, m, title) => `<div class="panel" style="gap:6px"><b style="font-size:.9rem">${title}</b><div class="ex">${tx(p + '.0', m)}<span>+</span>${tx(p + '.1', m)}<span>=</span>${tx(p + '.2', m)}</div><div class="field"><label>פתרון מלא:</label>${tx(p + '.3', m)}</div></div>`;

function sumHtml(m) {
  return `<div class="panel"><h3>סיכום מיפוי</h3>
    <div class="sum">
      <div class="field"><h3>נקודות חוזק</h3>${ta('s.strong', m, true)}</div>
      <div class="field"><h3>מוקדי קושי</h3>${ta('s.hard', m, true)}</div>
      <div class="field"><h3>מטרות ראשוניות</h3>${ta('s.goals', m, true)}</div>
      <div class="field"><h3>המלצות להורים</h3>${ta('s.recs', m, true)}</div>
    </div>
    <div class="sec">המלצות להמשך</div>
    <div class="chips" style="gap:6px 18px">${SR.map((t, i) => cb('s.r.' + i, t, m)).join('')}</div>
    <div class="field"><label>הערות</label>${ta('s.note', m, false)}</div>
  </div>`;
}

const KBREAD = ['קורא/ת משפט שלם בלי לפרק להברות', 'קורא/ת בהטעמה ובהתאם לפיסוק', 'מבין/ה מה קרא/ה ועונה על שאלות', 'מתקן/ת את עצמו/ה כשטועה'];
const mk = (m, k) => (m.marks && m.marks[k]) || 0;
function kbLetters(m) {
  return GROUPS.map((g, i) => {
    const all = g.every(l => mk(m, 'lr' + l) === 2);
    return `<div class="lg${all ? ' done' : ''}"><div class="hd"><b>${gname(g, i)}: ${g.join(' ')}</b><button type="button" class="gt noexp noprint${all ? ' done' : ''}" data-act="kbgrp" data-i="${i}">${all ? 'הקבוצה הסתיימה ✓' : 'סמני שהקבוצה הסתיימה'}</button></div>
    <div class="letters">${g.map(l => { const v = mk(m, 'lr' + l); return `<button type="button" class="lt s${v}" data-act="kbmark" data-k="lr${l}" aria-label="האות ${l}: ${STATES[v]}">${l}</button>`; }).join('')}</div></div>`;
  }).join('');
}
function kbMatrix(m) {
  const st = STAGES.find(x => x.id === 'rd');
  return `<table class="matrix"><thead><tr><th></th>${st.cols.map(x => `<th>${x[1]}</th>`).join('')}</tr></thead><tbody>${st.signs.map(s => `<tr><td class="sign"><span>${s[1]}</span>${s[0]}</td>${st.cols.map(x => { const k = 'rd.' + s[0] + '.' + x[0], v = mk(m, k); return `<td><button type="button" class="cell s${v}" data-act="kbmark" data-k="${esc(k)}" aria-label="${esc('סימן ' + s[0] + ': ' + x[1] + ': ' + STATES[v])}">${SYM[v] || '○'}</button></td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
}
const NONSENSE = ['דִּינֶל', 'מִשֶּׂרִיחַ', 'פְרוֹנִיק', 'סִיגוֹדוֹ', 'עָמְצוּ', 'פֵּרְשׁוּק'];
function nwHtml(m) {
  return `<div class="nwgrid">${NONSENSE.map((w, i) => { const v = mk(m, 'nw' + i); return `<div class="nwc"><div class="nww">${w}</div><button type="button" class="cell s${v}" data-act="kbmark" data-k="nw${i}" aria-label="${esc('מילת תפל ' + w + ': ' + STATES[v])}">${SYM[v] || '○'}</button><input type="text" data-p="nw.${i}" value="${esc(m.nw && m.nw[i])}" placeholder="איך נקראה"></div>`; }).join('')}</div>`;
}
function kbSheetHtml(m) {
  if (!m.nw) m.nw = ['', '', '', '', '', ''];
  return `<div class="sheet" id="sheet">
  <div class="title">מיפוי לילדי כיתות א׳-ב׳</div>
  <div class="sub">בשיטת קוראים בקלות · חן קלימיאן, לדבר עם ילדים</div>
  <div class="meta">
    <div class="field"><label>שם הילד/ה</label>${tx('name', m)}</div>
    <div class="field"><label>גיל</label>${tx('age', m)}</div>
    <div class="field"><label>תאריך</label><input type="date" data-p="date" value="${esc(m.date)}"></div>
    <div class="field"><label>מסגרת חינוכית</label>${tx('school', m)}</div>
  </div>
  <div class="note noexp">לחצי על אות או על משבצת כדי לשנות מצב: לחיצה אחת בתהליך, שתיים שולט/ת, שלוש מאפסת. ○ עוד לא התחלנו, ◐ בתהליך, ✓ שולט/ת.</div>
  <div class="grid2">
    <div class="panel"><h3><span class="num n1">1</span>אותיות: שם, צליל וצורה</h3>${kbLetters(m)}</div>
    <div class="panel"><h3><span class="num n2">2</span>ניקוד: הברות, מילים ומשפטים</h3>${kbMatrix(m)}</div>
    <div class="panel"><h3><span class="num n3">3</span>כתיבה בהכתבה</h3>
      <div class="note">הילד/ה כותב/ת באצבע או בעט מגע. אפשר לרשום ליד כל שורה מה הוכתב.</div>
      ${['הברה', 'מילה', 'משפט קצר'].map((t, i) => `<div class="wrow"><div class="field"><label>${t}</label>${tx('dict.w.' + i, m)}</div>${pad('dict.d.' + i, 200, 'כאן הילד/ה כותב/ת')}</div>`).join('')}
    </div>
    <div class="panel"><h3><span class="num n4">4</span>קריאה בקול</h3>
      <div class="cbs">${KBREAD.map((t, i) => cb('read.c.' + i, t, m)).join('')}</div>
      <div class="field"><label>מה קראנו ואיך זה נשמע?</label>${ta('read.what', m, true)}</div>
      <div class="field"><label>טעויות שחוזרות</label>${ta('read.errs', m, true)}</div>
      <div class="field"><label>הערות</label>${ta('read.note', m, false)}</div>
    </div>
  </div>
  <div class="panel"><h3><span class="num n1">5</span>קריאת מילות תפל</h3>
    <div class="note">הילד/ה קורא/ת בקול מילים שאינן קיימות בשפה. כך בודקים קריאה לפי הצלילים והניקוד, בלי ניחוש. לחצי על המשבצת: ✓ נקראה נכון, ◐ נקראה בעזרה או בתיקון עצמי. ליד כל מילה אפשר לכתוב איך נקראה.</div>
    ${nwHtml(m)}
    <div class="field"><label>הערות על קריאת מילות התפל</label>${ta('read.nwnote', m, false)}</div>
  </div>
  ${sumHtml(m)}
  <div class="rights">כל הזכויות שמורות לחן קלימיאן</div>
</div>`;
}

function lp(m) {
  return {
    meta: `<div class="meta">
    <div class="field"><label>שם הילד/ה</label>${tx('name', m)}</div>
    <div class="field"><label>גיל</label>${tx('age', m)}</div>
    <div class="field"><label>תאריך</label><input type="date" data-p="date" value="${esc(m.date)}"></div>
    <div class="field"><label>מסגרת חינוכית</label>${tx('school', m)}</div>
  </div>`,
    parents: `<div class="panel"><h3>תובנות משיחת ההורים</h3>${ta('parents', m, true)}</div>`,
    t1: `<div class="panel"><h3><span class="num n1">1</span>משימה 1 – כתיבת שם</h3>
      <div class="note">הוראה: כתוב/כתבי לי את השם שלך. הילד/ה כותב/ת כאן באצבע או בעט מגע.</div>
      ${pad('t1.draw', 380, 'כאן הילד/ה כותב/ת את השם')}
      <div class="sec">מה הילד/ה מצליח/ה ללא קושי?</div>
      <div class="cbs">${T1.map((t, i) => cb('t1.c.' + i, t, m)).join('')}</div>
      <div class="field"><label>שאלה נלווית: אילו אותיות יש לך בשם?</label>${tx('t1.ask', m)}</div>
      <div class="field"><label>הערות</label>${ta('t1.note', m, false)}</div>
    </div>`,
    t2: `<div class="panel"><h3><span class="num n2">2</span>משימה 2 – כתיבה פונטית</h3>
      <div class="note noexp">הוראה: כתוב/כתבי את המילים לפי האיורים. בוחרים רמה, ואז נפתחים האיורים והמשטחים לכתיבה. הילד/ה רואה רק איורים.</div>
      <div class="lvls noexp noprint">${['easy', 'hard'].map(k => `<button type="button" class="lvl${m.t2.lv === k ? ' on' : ''}" data-act="lvl" data-lv="${k}"><b>${LVL[k].t}</b><span class="pics">${LVL[k].w.map(x => picImg(x[1], 'pic sm', x[0])).join('')}</span></button>`).join('')}</div>
      ${(m.t2.lv || m.t2.w.some(Boolean)) ? [0, 1, 2].map(i => { const lv = m.t2.lv && LVL[m.t2.lv], pk = lv ? lv.w[i][1] : ''; return `<div class="wblock"><div class="wtop">${pk ? picImg(pk, 'pic big', lv.w[i][0]) : ''}<div class="field wbig"><label>מילה ${i + 1}</label>${tx('t2.w.' + i, m)}</div></div>${pad('t2.d.' + i, 230, 'הילד/ה כותב/ת כאן')}</div>`; }).join('') : '<div class="note noexp">עוד לא נבחרה רמה</div>'}
      <div class="field"><label>הערות</label>${ta('t2.note', m, false)}</div>
    </div>`,
    t3: `<div class="panel"><h3><span class="num n3">3</span>משימה 3 – חשבון</h3>
      <div class="sec">מה הילד/ה מצליח/ה ללא קושי?</div>
      <div class="cbs">${T3.map((t, i) => cb('t3.c.' + i, t, m)).join('')}</div>
      ${ex('t3.e1', m, 'פתרון תרגיל חיבור עד 10')}
      ${ex('t3.e2', m, 'תרגיל חשבון עד 5')}
      <div class="field"><label>הערות</label>${ta('t3.note', m, false)}</div>
    </div>`,
    t4: `<div class="panel"><h3><span class="num n4">4</span>משימה 4 – למידה חדשה בזמן אמת</h3>
      <div class="sec">דוגמאות לשאלות למידה:</div>
      <div class="chips noexp">${['פתח', 'קמץ', 'אות חדשה', 'אחר'].map(q => `<button type="button" class="wc" data-act="q" data-w="${q}">${q}</button>`).join('')}</div>
      <div class="field"><label>מה לימדנו?</label>${tx('t4.q', m)}</div>
      <div class="sec">מה בודקים?</div>
      <div class="cbs two">${T4.map((t, i) => cb('t4.c.' + i, t, m)).join('')}</div>
      <div class="field"><label>איך הילד/ה הגיב/ה?</label>${ta('t4.how', m, true)}</div>
    </div>`
  };
}
function sheetHtml(m) {
  const P = lp(m);
  return `<div class="sheet" id="sheet">
  <div class="title">דף מלווה מיפוי – הכנה לכיתה א׳</div>
  <div class="sub">מיפוי לילדי גן חובה · שיעור 9 בהכשרה המקצועית · חן קלימיאן, לדבר עם ילדים</div>
  ${P.meta}
  ${P.parents}
  <div class="grid2">
    ${P.t1}
    ${P.t2}
    ${P.t3}
    ${P.t4}
  </div>
  ${sumHtml(m)}
  <div class="rights">כל הזכויות שמורות לחן קלימיאן</div>
</div>`;
}

function renderMap() {
  const kind = S.tab === 'kb' ? 'kb' : 'l9', curId = kind === 'kb' ? S.kbId : S.mapId;
  const list = mapsOf(kind).sort((a, b) => b.u - a.u), m = curMap();
  let h = `<div class="card noprint"><div class="mapbar">${list.map(x => `<button type="button" class="chip${x.id === curId ? ' on' : ''}" data-act="pickMap" data-id="${x.id}">${esc(x.name || 'ילד/ה ללא שם')} · ${fmt(x.date)}</button>`).join('')}<button type="button" class="chip add" data-act="newMap" data-kind="${kind}">+ מיפוי חדש</button></div>`;

function pickLetters(m) {

  if (w.phase === 'think') return `<div class="card think"><div class="thinkface">🤔</div><h2>מכינה את דף הסיכום...</h2><div class="dots"><i></i><i></i><i></i></div></div>`;
  if (w.phase === 'sum') {
    return summaryHtml(m) + `<div class="card noprint"><h2>שמירה והדפסה</h2><div class="actions"><button class="btn solid" type="button" data-act="png">שמירה כקובץ תמונה A4 (הכול בעמוד אחד)</button><button class="btn" type="button" data-act="print">הדפסה או שמירה כ-PDF</button></div>
      <div class="row"><button class="btn quiet" type="button" data-act="wzEdit">חזרה לעריכה</button><button class="btn quiet" type="button" data-act="wzDone">סיום ויציאה לדף המיפוי</button></div></div>`;
  }
  const i = w.step, key = WSTEPS[i][0], P = lp(m);
  let body = '', ctl = wizControls(m);
  if (key === 'meta') body = `<div class="card"><h2>פרטי הילד/ה</h2>${P.meta}</div>`;
  else if (key === 'parents') body = `<div class="card">${P.parents}</div>`;
  else if (key === 't1' || key === 't2' || key === 't3' || key === 't4') body = `<div class="card">${P[key]}</div>`;
  else if (key === 'lw') {
    const lt = ensureLt(m), n = lt.i, l = lt.L[n], cur = lt.wr[l] || 0;
    body = `<div class="card"><div class="panel"><h3><span class="num n1">${n + 1}</span>כתיבת אות ${n + 1} מתוך ${lt.L.length}</h3>
      <div class="note">לחצי על "השמעה" כדי להשמיע לילד/ה "כתבו את האות...". הילד/ה כותב/ת במסגרת למטה, ואחר כך מסמנים. האות שנשמעת: <b>${l}</b> (${esc(stripNik(window.HenVoice ? HenVoice.letterName(l) : l))})</div>
      <div class="row"><button class="btn mint" type="button" data-act="wzSay" data-kind="w" data-l="${l}">השמעה שוב: כתבו את האות</button></div>
      <div class="frame ${FRAMES[n % 4]}">${pad('lt.d.' + l, 320, '')}</div>
      ${mkRow(cur, 'wzMark', 'data-l="' + l + '"')}</div></div>` + wnField(m, 'lw' + n);
    ctl = wizControls(m, { back: 'wzLback', next: 'wzLnext', nextLabel: n < lt.L.length - 1 ? 'האות הבאה' : 'לשלב הבא' });
  } else if (key === 'ln') {
    const lt = ensureLt(m);
    body = `<div class="card"><div class="panel"><h3><span class="num n2">8</span>אילו אותיות אתה רואה כאן?</h3>
      <div class="note">מראים לילד/ה את המסך ושואלים: "אילו אותיות אתה רואה כאן?". לכל אות מסמנים אם נקראה בשמה.</div>
      <div class="row"><button class="btn mint" type="button" data-act="wzSay" data-kind="n" data-l="">השמעת השאלה</button></div>
      <div class="lngrid">${lt.L.map(l => `<div class="lnc"><div class="lbig2">${l}</div>${mkRow(lt.nm[l] || 0, 'wzNm', 'data-l="' + l + '"')}</div>`).join('')}</div></div></div>` + wnField(m, 'ln');
  } else if (key === 'lp') {
    const lt = ensureLt(m), done = lt.pi >= lt.order.length, target = lt.order[lt.pi];
    body = `<div class="card"><div class="panel"><h3><span class="num n3">9</span>הצבעה על אות</h3>
      <div class="note">${done ? 'הילד/ה סיים/ה. אלה התוצאות:' : 'השמעה: "איפה האות...". הילד/ה לוחץ/ת על האות במסך. המערכת מסמנת לבד נכון או לא נכון. האות המבוקשת כעת: <b>' + target + '</b> (' + (lt.pi + 1) + ' מתוך ' + lt.order.length + ')'}</div>
      ${done ? '' : `<div class="row"><button class="btn mint" type="button" data-act="wzSay" data-kind="p" data-l="${target}">השמעה שוב: איפה האות</button></div>`}
      <div class="lngrid">${lt.grid.map(l => { const r = lt.pt[l], picked = Object.keys(lt.pc).filter(k => lt.pc[k] === l).length; return `<button type="button" class="tile${r === 1 ? ' good' : ''}${r === 3 ? ' bad' : ''}" data-act="wzPick" data-l="${l}"${done ? ' disabled' : ''}>${l}</button>`; }).join('')}</div>
      ${done ? `<div class="presult">${lt.order.map(l => `<span class="pr ${lt.pt[l] === 1 ? 'good' : 'bad'}">${l} ${lt.pt[l] === 1 ? '✓' : '✗ (הצביע/ה על ' + (lt.pc[l] || '?') + ')'}</span>`).join('')}</div><div class="row"><button class="btn quiet" type="button" data-act="wzPreset">לחזור על ההצבעה מההתחלה</button></div>` : ''}</div></div>` + wnField(m, 'lp');
  } else if (key === 'fin') {
    body = `<div class="card"><h2>סיום המיפוי</h2><p class="note">מלאי את הסיכום, המלצות להמשך ושם הבוחנת. אחר כך לחצי על "הצג סיכום".</p>${sumHtml(m)}<div class="field"><label>שם הבוחנת</label>${tx('examiner', m)}</div></div>`;
    ctl = wizControls(m, { next: 'wzShow', nextLabel: 'הצג סיכום' });
  }
  return wizProg(m) + body + ctl;
}

/* ===== דף הסיכום ===== */
function strokeImg(st, W, H) {
  if (!st || !st.length) return '';
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#2b3138'; g.lineWidth = Math.max(2, W / 110); g.lineCap = 'round'; g.lineJoin = 'round';
  st.forEach(s => { g.beginPath(); s.forEach((pt, i) => { const x = pt[0] / 1000 * W, y = pt[1] / 1000 * H; if (i) g.lineTo(x, y); else g.moveTo(x, y); }); if (s.length === 1) g.lineTo(s[0][0] / 1000 * W + 0.1, s[0][1] / 1000 * H); g.stroke(); });
  return `<img class="sImg" src="${c.toDataURL('image/png')}" alt="">`;
}
function padOut(m, path, h, label) {
  const pm = (m.pm && m.pm[path]) || {}, mode = pm.mode || 'draw';
  let c = '';
  if (mode === 'photo') c = pm.img ? `<img class="sImg" src="${pm.img}" alt="">` : '';
  else if (mode === 'note') c = pm.note ? `<div class="sNote">${esc(pm.note)}</div>` : '';
  else c = strokeImg(getP(m, path), 300, Math.round(300 * h / 1000));
  return c ? `<div class="sPad">${label ? `<span class="lbl">${esc(label)}</span>` : ''}${c}</div>` : '';
}
function checks(arr, prefix, m) { const ok = [], no = []; arr.forEach((t, i) => (getP(m, prefix + '.' + i) ? ok : no).push(t)); return [ok, no]; }
function summaryHtml(m) {
  const w = m.wz || {}, lt = m.lt, t2 = m.t2 || { w: [] };
  const [a1, b1] = checks(T1, 't1.c', m), [a3, b3] = checks(T3, 't3.c', m), [a4, b4] = checks(T4, 't4.c', m);
  const li = (arr, cls) => arr.length ? `<ul class="${cls}">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div class="note">אין</div>';
  const two = (ok, no) => `<div class="sgrid"><div><div class="sec good">הצלחות</div>${li(ok, 'ok')}</div><div><div class="sec hard">לא סומן כהצלחה</div>${li(no, 'no')}</div></div>`;
  const txt = (label, v) => v ? `<div class="sline"><b>${esc(label)}:</b> ${esc(v)}</div>` : '';
  const stCls = v => v === 1 ? 'g' : v === 2 ? 'h' : v === 3 ? 'x' : '';
  const notes = Object.keys(m.wn || {}).filter(k => (m.wn[k] || '').trim()).map(k => { const nm = k.indexOf('lw') === 0 ? 'אות ' + (+k.slice(2) + 1) : (WSTEPS[WIDX(k)] || [k, k])[1]; return `<div class="sline"><b>${esc(nm)}:</b> ${esc(m.wn[k])}</div>`; }).join('');
  const recs = (m.s && m.s.r ? SR.filter((x, i) => m.s.r[i]) : []);
  const lres = lt ? `<div class="lsum">${lt.L.map(l => `<div class="lres"><div class="lbig">${l}</div><div class="lline">כתיבה <b class="${stCls(lt.wr[l])}">${SYMX[lt.wr[l]] || '○'}</b></div><div class="lline">שם האות <b class="${stCls(lt.nm[l])}">${SYMX[lt.nm[l]] || '○'}</b></div><div class="lline">הצבעה <b class="${lt.pt[l] === 1 ? 'g' : lt.pt[l] === 3 ? 'x' : ''}">${lt.pt[l] === 1 ? '✓' : lt.pt[l] === 3 ? '✗' : '○'}</b></div>${strokeImg(lt.d[l], 110, 70)}</div>`).join('')}</div>` : '<div class="note">לא בוצע שלב אותיות</div>';
  return `<div class="sheet sumsheet" id="sheet">
  <div class="title">סיכום מיפוי: הכנה לכיתה א׳</div>
  <div class="sub">מיפוי לילדי גן חובה · חן קלימיאן, לדבר עם ילדים</div>
  <div class="sdet"><div><b>שם:</b> ${esc(m.name)}</div><div><b>גיל:</b> ${esc(m.age)}</div><div><b>תאריך:</b> ${fmt(m.date)}</div><div><b>מסגרת:</b> ${esc(m.school)}</div><div><b>הבוחנת:</b> ${esc(m.examiner)}</div></div>
  ${w.stopped ? `<div class="stopnote">המיפוי הופסק במסך "${esc((WSTEPS[WIDX(w.stopped)] || ['', w.stopped])[1])}" כי הילד/ה התקשה. הנתונים כוללים את מה שבוצע עד אז.</div>` : ''}
  ${m.parents ? `<div class="panel"><h3>תובנות משיחת ההורים</h3><div class="sNote">${esc(m.parents)}</div></div>` : ''}
  <div class="grid2">
    <div class="panel"><h3><span class="num n1">1</span>כתיבת שם</h3>${padOut(m, 't1.draw', 380)}${two(a1, b1)}${txt('אותיות בשם', m.t1 && m.t1.ask)}${txt('הערות', m.t1 && m.t1.note)}</div>
    <div class="panel"><h3><span class="num n2">2</span>כתיבה פונטית${t2.lv ? ' · ' + LVL[t2.lv].t : ''}</h3>${[0, 1, 2].map(i => t2.w[i] ? `<div class="sline"><b>${esc(t2.w[i])}</b></div>${padOut(m, 't2.d.' + i, 230)}` : '').join('')}${txt('הערות', t2.note)}</div>
    <div class="panel"><h3><span class="num n3">3</span>חשבון</h3>${two(a3, b3)}${txt('הערות', m.t3 && m.t3.note)}</div>
    <div class="panel"><h3><span class="num n4">4</span>למידה חדשה בזמן אמת</h3>${txt('מה לימדנו', m.t4 && m.t4.q)}${two(a4, b4)}${txt('איך הגיב/ה', m.t4 && m.t4.how)}</div>
  </div>
  <div class="panel"><h3>אותיות: כתיבה בהכתבה, שם האות והצבעה</h3>${lres}</div>
  ${notes ? `<div class="panel"><h3>הערות שנכתבו תוך כדי</h3>${notes}</div>` : ''}
  <div class="panel"><h3>סיכום ומסקנות</h3>${txt('נקודות חוזק', m.s && m.s.strong)}${txt('מוקדי קושי', m.s && m.s.hard)}${txt('מטרות ראשוניות', m.s && m.s.goals)}${txt('המלצות להורים', m.s && m.s.recs)}${recs.length ? `<div class="sline"><b>המלצות להמשך:</b> ${recs.map(esc).join(', ')}</div>` : ''}${txt('הערות', m.s && m.s.note)}</div>
  <div class="rights">כל הזכויות שמורות לחן קלימיאן</div>
</div>`;
}

/* ===== פעולות ===== */
function wzGo(m, step) {
  m.wz.step = Math.max(0, Math.min(WSTEPS.length - 1, step)); m.wz.phase = null;
  const key = WSTEPS[m.wz.step][0];
  if (key === 'lw' || key === 'ln' || key === 'lp') ensureLt(m);
  touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0);
  if (key === 'lw') sayAsk('w', m.lt.L[m.lt.i]);
  else if (key === 'lp' && m.lt.pi < m.lt.order.length) sayAsk('p', m.lt.order[m.lt.pi]);
}
function wzAct(a, b, m) {
  if (!m) return;
  const keep = fn => { const y = scrollY; fn(); touch(m, 'map:' + m.id); renderMap(); scrollTo(0, y); };
  if (a === 'wzStart') { if (!m.wz) m.wz = { step: 0 }; m.wz.on = true; m.wz.phase = null; wzGo(m, m.wz.step); }
  else if (a === 'wzNext') wzGo(m, m.wz.step + 1);
  else if (a === 'wzBack') wzGo(m, m.wz.step - 1);
  else if (a === 'wzPause') { m.wz.on = false; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); toast('המיפוי נשמר. אפשר להמשיך בכל זמן מהלחצן "המשך מיפוי מודרך"'); }
  else if (a === 'wzStop') { m.wz.stopped = WSTEPS[m.wz.step][0]; wzGo(m, WIDX('fin')); toast('עברנו לסיום. מלאי את הסיכום ולחצי "הצג סיכום"'); }
  else if (a === 'wzSay') { sayAsk(b.dataset.kind, b.dataset.l || null); }
  else if (a === 'wzMark') { const l = b.dataset.l, v = +b.dataset.v; keep(() => { if (m.lt.wr[l] === v) delete m.lt.wr[l]; else m.lt.wr[l] = v; }); }
  else if (a === 'wzNm') { const l = b.dataset.l, v = +b.dataset.v; keep(() => { if (m.lt.nm[l] === v) delete m.lt.nm[l]; else m.lt.nm[l] = v; }); }
  else if (a === 'wzLnext') { const lt = m.lt; if (lt.i < lt.L.length - 1) { lt.i++; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); sayAsk('w', lt.L[lt.i]); } else wzGo(m, m.wz.step + 1); }
  else if (a === 'wzLback') { const lt = m.lt; if (lt.i > 0) { lt.i--; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); } else wzGo(m, m.wz.step - 1); }
  else if (a === 'wzPick') {
    const lt = m.lt; if (lt.pi >= lt.order.length) return;
    const target = lt.order[lt.pi], l = b.dataset.l; lt.pc[target] = l; lt.pt[target] = l === target ? 1 : 3; lt.pi++;
    touch(m, 'map:' + m.id); renderMap();
    if (lt.pi < lt.order.length) setTimeout(() => sayAsk('p', lt.order[lt.pi]), 500);
  }
  else if (a === 'wzPreset') { keep(() => { m.lt.pi = 0; m.lt.pt = {}; m.lt.pc = {}; m.lt.order = shuf(m.lt.L); m.lt.grid = shuf(m.lt.L); }); sayAsk('p', m.lt.order[0]); }
  else if (a === 'wzShow') { window.__thinkT = true; m.wz.phase = 'think'; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); setTimeout(() => { window.__thinkT = false; if (curMap() === m && m.wz.phase === 'think') { m.wz.phase = 'sum'; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); } }, 2300); }
  else if (a === 'wzEdit') { m.wz.phase = null; m.wz.step = WIDX('fin'); touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); }
  else if (a === 'wzDone') { m.wz.on = false; m.wz.phase = null; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); }
}

/* ===================== פתיחה ===================== */
load();
{ const h = (location.hash || '').slice(1); if (h === 'map' || h === 'kids' || h === 'kb') S.tab = h; }
render();
if (localStorage.getItem(TOK)) { $('acct').firstElementChild && ($('acct').firstElementChild.textContent = 'מתחברת...'); cloudLoad(); }
</script>
