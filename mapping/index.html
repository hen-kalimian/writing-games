<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>מיפוי בזמן אמת ומעקב התקדמות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="../hen-voice.js"></script>
<style>
:root{
  --bg:#fff8fa; --card:#ffffff; --ink:#2b3138; --muted:#6b6f78; --line:#f3d3de;
  --pink:#fde1ea; --pink2:#fbc5d6; --pink-strong:#d14175; --pink-deep:#b8236b;
  --mint:#d3f0e1; --mint-ink:#1f6b4a; --sky:#d8ecfa; --sky-ink:#245e8c; --sun:#ffeeba; --sun-ink:#8a5a00;
  --head:'Rubik','Open Sans',Arial,sans-serif; --body:'Open Sans','Rubik',Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:16px 16px 60px;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
#main.wrap{margin:0}
h1,h2,h3{font-family:var(--head);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:1.55rem;color:var(--pink-deep)} h2{font-size:1.1rem} h3{font-size:1rem}
.note{font-size:.85rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pink-strong);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.acct{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.btn{border:1.5px solid var(--pink-strong);background:var(--pink);color:var(--pink-deep);border-radius:14px;padding:9px 16px;font-weight:700}
.btn.solid{background:var(--pink-strong);color:#fff}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted);font-weight:600}
.btn.mint{border-color:var(--mint-ink);background:var(--mint);color:var(--mint-ink)}
.btn.danger{border-color:#c0392b;color:#c0392b;background:transparent}
.btn.sm{padding:5px 11px;font-size:.82rem;border-radius:11px}
.tabs{display:flex;gap:8px}
.tab{flex:1 1 0;min-width:0;font-size:.92rem;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:11px 8px;font-weight:800;font-family:var(--head);text-align:center}
.tab.on{background:var(--pink);border-color:var(--pink-strong);color:var(--pink-deep)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-weight:600}
.chip.on{background:var(--pink-strong);border-color:var(--pink-strong);color:#fff}
.chip.add{border-style:dashed;color:var(--pink-deep)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 140px}
.field>label,.lbl{font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;text-align:start;direction:rtl}
input[type=date]::-webkit-date-and-time-value{text-align:start;min-height:1.3em}
.meta input{height:44px;min-height:44px}
.ruled{background-image:repeating-linear-gradient(transparent,transparent 27px,#e7c3d1 28px);line-height:28px;padding:0 8px;background-color:#fff;min-height:84px}

/* ===== דף המיפוי ===== */
.sheet{background:#fff;border:2px solid var(--pink2);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet .title{text-align:center;font-family:var(--head);font-weight:800;font-size:1.35rem;color:var(--pink-deep)}
.sheet .sub{text-align:center;font-size:.82rem;color:var(--muted);margin-top:-8px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px}
.meta>*{min-width:0}
.panel{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;background:#fff}
.panel>h3{display:flex;align-items:center;gap:9px;font-size:1rem}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:800}
.n1{background:var(--pink-strong)} .n2{background:#3aa57a} .n3{background:#4a90c2} .n4{background:#d9a21b}
.panel .field,.sum .field,.meta .field{flex:0 0 auto}
.wblock{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.wtop{display:flex;gap:12px;align-items:center}
.panel .field.wbig{flex:1 1 0;min-width:0}
.lvl{min-width:0}
.lvl .pics{flex-wrap:wrap;justify-content:center}
@media(max-width:480px){.pic.big{width:96px;height:96px}.pic.sm{width:46px;height:46px}.wbig input{font-size:1.35rem}}
.wbig input{font-size:1.6rem;font-family:var(--head);font-weight:800;text-align:center;height:64px;min-height:64px}
.pic.big{width:120px;height:120px;object-fit:contain;flex:none;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.pic.sm{width:54px;height:54px;object-fit:contain;border-radius:12px;background:#fff;border:1.5px solid var(--line)}
.pic.nopic{display:grid;place-items:center;color:var(--muted);font-size:.74rem;text-align:center}
.lvls{display:flex;flex-wrap:wrap;gap:8px}
.lvl{flex:1 1 150px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lvl.on{background:var(--pink);border-color:var(--pink-strong)}
.lvl b{font-family:var(--head);color:var(--pink-deep)}
.pics{display:flex;gap:6px}
.wrow{display:flex;gap:8px;align-items:flex-end}
.wrow .field{width:92px;flex:none}
.wrow .pad{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.cbs{display:flex;flex-direction:column;gap:5px}
.cb{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.92rem}
.cb input{position:absolute;opacity:0;width:1px;height:1px}
.bx{flex:none;width:22px;height:22px;border:2px solid var(--ink);border-radius:6px;background:#fff;display:grid;place-items:center}
.bx svg{width:15px;height:15px;stroke:var(--mint-ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
.cb input:checked+.bx{background:var(--mint)}
.cb input:checked+.bx svg{display:block}
.cb input:focus-visible+.bx{outline:3px solid var(--pink-strong);outline-offset:2px}
.cbs.two{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.sec{font-weight:700;font-size:.85rem;color:var(--pink-deep)}
.pad{display:flex;flex-direction:column;gap:4px}
.pwpick{align-items:center;text-align:center}
.pwpics{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.pwp{border:3px solid var(--pink);background:#fff;border-radius:28px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(239,64,110,.12)}
.pwp:active{transform:scale(.97)}
.pic.huge{width:min(190px,26vw);height:min(190px,26vw);min-width:110px;min-height:110px;object-fit:contain}
.pwlbl{font-size:.74rem;color:var(--muted)}
.pwdone{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;border-top:1px dashed var(--line);padding-top:10px}
.pwth{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pwth small{font-size:.7rem;color:var(--muted)}
.pwfull{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,#fff,#fff3f7);display:flex;flex-direction:row;gap:14px;padding:12px;align-items:stretch}
.pwside{flex:none;width:clamp(96px,16vw,150px);display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-start;padding-top:6px}
.pwside .pic{width:100%;height:auto;max-height:150px;object-fit:contain}
.pwboard{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.pwboard .pad{width:100%;align-items:center}
.pwboard canvas.dc{width:min(100%,calc((100vh - 150px) * 1000 / var(--h)));height:auto;background:#fff;border:3px solid var(--pink-strong);border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.pwboard .modes,.pwboard .lbl,.pwboard [data-act=padfs]{display:none}
.pwbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media(max-width:620px) and (orientation:portrait){.pwfull{flex-direction:column}.pwside{width:100%;flex-direction:row;justify-content:center}.pwside .pic{width:90px}.pwboard canvas.dc{width:100%}}
.pad .fsx{display:none}
.pad.fs{position:fixed;inset:0;z-index:70;background:#fff;align-items:center;justify-content:center;gap:10px;padding:10px}
.pad.fs .fsx{display:inline-flex;position:absolute;top:10px;inset-inline-start:10px}
.pad.fs .modes,.pad.fs .lbl{display:none}
.pad.fs canvas.dc{width:min(100%,calc((100vh - 110px) * 1000 / var(--h)));height:auto;border-width:2px}
.pad.fs .tools{justify-content:center}
.pad.fs .tools [data-act=padfs]{display:none}
body.padfs{overflow:hidden}
canvas.dc{width:100%;display:block;border:1.5px dashed var(--pink-strong);border-radius:12px;background:#fffdfd;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
.modes{display:flex;flex-wrap:wrap;gap:5px}
.mdb{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.mdb.on{background:var(--pink);border-color:var(--pink-strong);color:var(--pink-deep)}
.pimg{width:100%;max-height:340px;object-fit:contain;border:1.5px dashed var(--pink-strong);border-radius:12px;background:#fffdfd;display:block}
.pimg.empty{padding:26px 0;text-align:center;color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:6px}
.wordchips{display:flex;flex-wrap:wrap;gap:6px}
.wc{border:1.5px solid var(--line);background:var(--sky);color:var(--sky-ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.88rem}
.wc.hard{background:var(--sun);color:var(--sun-ink)}
.ex{display:grid;grid-template-columns:auto auto auto auto auto;gap:6px;align-items:center;justify-content:start;direction:ltr}
.ex input{width:54px;text-align:center;font-size:1.2rem;padding:6px 2px}
.ex span{font-weight:800;font-size:1.2rem}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.sum h3{font-size:.95rem;color:var(--pink-deep)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.nwc{border:1.5px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.nww{font-family:Arial,'Noto Sans Hebrew','Open Sans',sans-serif;font-weight:700;font-size:1.9rem;line-height:1.5;direction:rtl}
.nwc .cell{width:56px}
.nwc input{text-align:center;font-size:.9rem}
.sheet.fixed .nwgrid{grid-template-columns:repeat(6,1fr)}
.sheet.fixed .nww{font-size:1.5rem}
.wzentry p{margin:0}
.wprog{display:flex;gap:6px;flex-wrap:wrap}
.wd{width:26px;height:8px;border-radius:99px;background:var(--line)}
.wd.ok{background:var(--pink2)} .wd.on{background:var(--pink-strong)}
.frame{border-radius:18px;padding:10px}
.frame.f0{border:3px dashed var(--pink-strong);background:#fff8fa}
.frame.f1{border:3px solid #3aa57a;background:#f2fbf6;border-radius:30px}
.frame.f2{border:3px dotted #4a90c2;background:#f1f8fd}
.frame.f3{border:5px double #d9a21b;background:#fffaf0;border-radius:10px}
.frame canvas.dc{border:0;background:transparent}
.mkrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mk{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:1.05rem}
.mk small{font-weight:600;font-size:.78rem;color:var(--muted)}
.mk.on.v1{background:var(--mint);border-color:var(--mint-ink);color:var(--mint-ink)}
.mk.on.v2{background:#ffe9b8;border-color:#8a5a00;color:#8a5a00}
.mk.on.v3{background:#fde0e0;border-color:#c0392b;color:#c0392b}
.lngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lnc{border:1.5px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.lbig2{font-family:var(--head);font-weight:800;font-size:3.4rem;line-height:1.1;color:var(--pink-deep)}
.lnc .mk{padding:5px 8px;font-size:.9rem}
.tile{font-family:var(--head);font-weight:800;font-size:3rem;border:2px solid var(--line);background:#fff;color:var(--pink-deep);border-radius:20px;min-height:96px}
.tile.good{background:var(--mint);border-color:var(--mint-ink);color:var(--mint-ink)}
.tile.bad{background:#fde0e0;border-color:#c0392b;color:#c0392b}
.presult{display:flex;flex-wrap:wrap;gap:8px}
.pr{border-radius:999px;padding:4px 12px;font-weight:700;border:1.5px solid var(--line)}
.pr.good{background:var(--mint);color:var(--mint-ink)} .pr.bad{background:#fde0e0;color:#c0392b}
.think{align-items:center;text-align:center;padding:40px 16px}
.thinkface{font-size:4.5rem;animation:bob 1s ease-in-out infinite}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--pink-strong);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.sdet{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 12px;font-size:.92rem}
.stopnote{background:#fff3cd;border:1.5px solid #d9a21b;border-radius:12px;padding:8px 12px;font-size:.88rem}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec.good{color:var(--mint-ink)} .sec.hard{color:#8a5a00}
.sgrid ul{margin:2px 0 0;padding-inline-start:18px;font-size:.85rem}
.sgrid ul.ok li::marker{color:var(--mint-ink);content:'✓ '} .sgrid ul.no li::marker{color:#8a5a00;content:'• '}
.sline{font-size:.88rem;line-height:1.5}
.sNote{white-space:pre-wrap;font-size:.88rem;line-height:1.5}
.sImg{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block}
.sPad{display:flex;flex-direction:column;gap:2px}
.lsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.lres{border:1.5px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem}
.lbig{font-family:var(--head);font-weight:800;font-size:1.8rem;color:var(--pink-deep);line-height:1.1}
.lline{display:flex;gap:6px;align-items:center}
.lline b{min-width:18px;text-align:center}.lline b.g{color:var(--mint-ink)}.lline b.h{color:#8a5a00}.lline b.x{color:#c0392b}
.sumsheet.fixed{font-size:12.5px}
.sumsheet.fixed .lsum{grid-template-columns:repeat(8,1fr)}
.startbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.startbtns{grid-template-columns:1fr}}
.bigbtn{border:2px solid var(--pink-strong);background:var(--pink);border-radius:20px;padding:18px 14px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.bigbtn b{font-family:var(--head);font-size:1.2rem;color:var(--pink-deep)}
.bigbtn span{font-size:.85rem;color:var(--muted)}
.smat{width:100%;border-collapse:collapse;font-size:.85rem}
.smat th{font-weight:600;color:var(--muted);padding:2px}
.smat td{border:1px solid var(--line);text-align:center;padding:3px}
.smat td.sg{text-align:start;font-weight:700}.smat td.sg span{color:var(--pink-deep);margin-inline-end:6px}
.smat td.c2{background:var(--mint);color:var(--mint-ink);font-weight:800}.smat td.c1{background:#ffe9b8;color:#8a5a00;font-weight:800}
.rdl{margin:0;padding:0;list-style:none;font-size:.88rem}
.nwlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.nwr{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:.85rem}
.nwr .nwt{font-family:Arial,'Noto Sans Hebrew',sans-serif;font-weight:700;font-size:1.25rem}
.nwr b.c2{color:var(--mint-ink)}.nwr b.c1{color:#8a5a00}
[hidden]{display:none!important}
.wzlayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
.wzmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.wznav{position:sticky;top:8px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wnh{font-family:var(--head);font-weight:800;color:var(--pink-deep)}
.wnv{background:var(--pink);border-radius:12px;padding:6px 10px;font-size:.9rem}
.wnv b{letter-spacing:.3em;font-size:1.1rem}
.wnl{display:flex;flex-direction:column;gap:6px}
.wni{display:flex;align-items:center;gap:8px;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 9px;font-size:.88rem;min-width:0}
.wni .wnk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:800;font-size:.8rem}
.wni.done{background:#f2fbf6;border-color:var(--mint-ink)} .wni.done .wnk{background:var(--mint-ink);color:#fff}
.wni.cur{background:var(--pink);border-color:var(--pink-strong);font-weight:700}
.wni.quiet{color:var(--muted)} .wni.sumbtn{border-style:dashed}
@media(max-width:760px){.wzlayout{grid-template-columns:1fr}.wznav{position:static;padding:8px}.wnl{flex-direction:row;overflow-x:auto;padding-bottom:4px}.wni{flex:0 0 auto;white-space:nowrap}.wnh{display:none}}
/* מצגת במסך מלא */
.wzlayout{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:stretch;background:linear-gradient(180deg,#fff 0%,var(--pink) 160%);gap:0}
.wztop{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1.5px solid var(--line)}
.wztt{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;padding-bottom:6px}
.wztt b{font-family:var(--head);color:var(--pink-deep);font-size:1.05rem;text-align:center}
.wztt span{font-size:.75rem;color:var(--muted)}
.wztt i{position:absolute;bottom:0;right:0;height:4px;border-radius:4px;background:var(--mint-ink);transition:width .3s}
.wzbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:block;padding:14px 12px 24px}
.wzmain{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wzlayout .wznav{position:fixed;top:76px;bottom:0;right:0;width:min(300px,86vw);z-index:60;border-radius:0 0 0 20px;overflow-y:auto;transform:translateX(105%);transition:transform .25s;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
.wzlayout .wznav.open{transform:none}
.wzlayout .wnl{flex-direction:column;overflow:visible}
.wzlayout .wni{white-space:normal;flex:none}
.wzlayout .wnh{display:block}
.wzmain:not(.show) .note,.wzmain:not(.show) .hint{display:none}

/* ===================== שמירה בחשבון (חיבור לאתר) ===================== */

}
const keepTokens = () => { try { if (wix) localStorage.setItem(TOK, JSON.stringify(wix.auth.getTokens())); } catch (e) {} };

    : `<span>נשמר במכשיר הזה בלבד</span><button type="button" class="btn sm" id="login">התחברי כדי לשמור בכל המכשירים</button>`;

    : 'בלי התחברות הכול נשמר רק בדפדפן של המכשיר הזה. כדי לראות אותו גם במחשב, בטאבלט ובטלפון, לחצי על "התחברי" למעלה. אפשר גם להעתיק גיבוי ולהדביק אותו במכשיר אחר.';
}

function renderAcctSoft() { const s = $('acct').firstElementChild; if (s && cloud) s.textContent = 'מחוברת · נשמר בחשבון' + (syncState ? ' · ' + syncState : ''); }
async function flush() {
  if (!cloud || !dirty.size) { syncState = ''; renderAcctSoft(); return true; }
  try {
    const c = await sdk();
    for (const key of [...dirty]) {
      let data;
      if (key === 'children') data = JSON.stringify({ children: S.children });
      else { const m = S.maps.find(x => 'map:' + x.id === key); if (!m) { dirty.delete(key); continue; } data = JSON.stringify(m); }
      if (citems[key]) citems[key] = await c.items.update(COLL, { ...citems[key], data });

    keepTokens(); syncState = 'נשמר ✓'; renderAcctSoft(); return true;

}
async function cloudLoad() {
  try {
    const c = await sdk();
    let res = await c.items.query(COLL).limit(100).find(), all = res.items;
    while (res.hasNext()) { res = await res.next(); all = all.concat(res.items); }

    all.forEach(x => {
      citems[x.title] = x;
      try { const d = JSON.parse(x.data || '{}'); if (x.title === 'children') (d.children || []).forEach(k => oc.push(k)); else if ((x.title || '').startsWith('map:') && d.id) om.push(d); } catch (e) {}

    S.maps.forEach(m => { if (!citems['map:' + m.id]) dirty.add('map:' + m.id); });
    if (S.children.length && !citems.children) dirty.add('children');

}

/* ===== קריאת הברות עם מ או ש, כל פעם סימן ניקוד אחר ===== */
const NIQ = [['פתח', 'ַ'], ['קמץ', 'ָ'], ['צירה', 'ֵ'], ['סגול', 'ֶ'], ['חיריק', 'ִ'], ['חולם', 'holam'], ['שורוק', 'shuruk'], ['קובוץ', 'ֻ'], ['שווא', 'ְ']];

const SYLSEQ = (() => { const a = [], b = []; NIQ.forEach((n, i) => { a.push({ sign: n[0], l: i % 2 === 0 ? 'מ' : 'ש', t: mkSyl(i % 2 === 0 ? 'מ' : 'ש', n) }); b.push({ sign: n[0], l: i % 2 === 0 ? 'ש' : 'מ', t: mkSyl(i % 2 === 0 ? 'ש' : 'מ', n) }); }); return a.concat(b); })();
function sylSlide(m) {

  return `<div class="card sylcard"><h2>קריאת הברות</h2>
    <p class="note noexp noprint">הילד/ה קורא/ת בקול את ההברה. מסמנים ✓ או ✗. אין צליל שגיאה, כי הילד/ה רואה את המסך. אפשר לדפדף קדימה ואחורה.</p>

}
/* מסקנות: האם הילד/ה מזהה בעקביות כל סימן ניקוד */
function sylAnalysis(m) {
  const r = (m.sy && m.sy.r) || {}, rows = NIQ.map(n => { const items = SYLSEQ.map((s, i) => ({ s, v: r[i] || 0 })).filter(x => x.s.sign === n[0]); const ok = items.filter(x => x.v === 1).length, no = items.filter(x => x.v === 3).length, tested = ok + no; return { sign: n[0], items, ok, no, tested, st: tested < items.length ? (tested ? 'part' : 'none') : ok === items.length ? 'cons' : ok === 0 ? 'fail' : 'unst' }; });
  const L = st => rows.filter(x => x.st === st).map(x => x.sign);
  const cons = L('cons'), unst = L('unst'), fail = L('fail'), part = L('part'), none = L('none');
  const errM = SYLSEQ.filter((s, i) => r[i] === 3 && s.l === 'מ').length, errS = SYLSEQ.filter((s, i) => r[i] === 3 && s.l === 'ש').length;
  let t = '';
  if (!rows.some(x => x.tested)) t = 'מבדק ההברות עוד לא בוצע.';
  else {
    t += cons.length ? 'מזהה בעקביות את סימני הניקוד: ' + cons.join(', ') + '. ' : 'לא נמצא סימן ניקוד שמזוהה בעקביות בשתי ההברות. ';
    if (unst.length) t += 'זיהוי לא עקבי (הצליח/ה בהברה אחת ולא בשנייה): ' + unst.join(', ') + '. ';
    if (fail.length) t += 'לא זיהה/תה: ' + fail.join(', ') + '. ';
    if (part.length) t += 'נבדק חלקית: ' + part.join(', ') + '. ';
    if (none.length) t += 'לא נבדקו: ' + none.join(', ') + '. ';
    if (errS - errM >= 2) t += 'יש יותר טעויות בהברות עם ש, כדאי לבדוק את הקריאה של ש בנפרד מסימן הניקוד. ';
    else if (errM - errS >= 2) t += 'יש יותר טעויות בהברות עם מ, כדאי לבדוק את הקריאה של מ בנפרד מסימן הניקוד. ';
  }
  return { rows, text: t.trim() };
}

function strokeImg(st, W, H) {
  if (!st || !st.length) return '';
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#2b3138'; g.lineWidth = Math.max(2, W / 110); g.lineCap = 'round'; g.lineJoin = 'round';
  st.forEach(s => { g.beginPath(); s.forEach((pt, i) => { const x = pt[0] / 1000 * W, y = pt[1] / 1000 * H; if (i) g.lineTo(x, y); else g.moveTo(x, y); }); if (s.length === 1) g.lineTo(s[0][0] / 1000 * W + 0.1, s[0][1] / 1000 * H); g.stroke(); });
  return `<img class="sImg" src="${c.toDataURL('image/png')}" alt="">`;
}
function padOut(m, path, h, label) {

    ${started.length ? `<div class="card"><h2>מיפויים שמורים: להמשיך, לערוך או להדפיס שוב</h2><div class="chips">${started.map(x => `<button type="button" class="chip" data-act="openMap" data-id="${x.id}">${esc(x.name || 'ילד/ה')} · ${x.kind === 'kb' ? 'כיתות א׳-ב׳' : 'גן חובה'} · ${fmt(x.date)}</button>`).join('')}</div></div>` : ''}`;
}
function startMap(kind) {
  const v = id => ($(id) ? $(id).value.trim() : '');
  const name = v('st_name'); if (!name) { toast('כתבי את שם הילד/ה'); $('st_name').focus(); return; }
  const m = newMap({ name, age: v('st_age') }, kind);
  m.date = v('st_date') || today(); m.school = v('st_school'); m.examiner = v('st_exam');
  m.wz = { step: 0, on: true, done: {} };
  if (kind === 'kb') ensureKb(m); else ensureVault(m);
  S.defaults = { school: m.school, examiner: m.examiner };
  S.maps.push(m); S[kind === 'kb' ? 'kbId' : 'mapId'] = m.id; S.tab = kind === 'kb' ? 'kb' : 'map';
  touch(m, 'map:' + m.id); try { history.replaceState(null, '', '#' + S.tab); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function openMap(id) {
  const m = S.maps.find(x => x.id === id); if (!m) return;
  S.tab = m.kind === 'kb' ? 'kb' : 'map'; S[m.kind === 'kb' ? 'kbId' : 'mapId'] = id;
  if (!m.wz) m.wz = { step: 0, done: {} }; m.wz.on = true; if (m.wz.phase === 'think') m.wz.phase = null;
  persist(); try { history.replaceState(null, '', '#' + S.tab); } catch (e) {} render(); window.scrollTo(0, 0);
}

/* ===== פעולות ===== */
function wzGo(m, step) {
  if (!m.wz.done) m.wz.done = {};
  m.wz.step = Math.max(0, Math.min(ST(m).length - 1, step)); m.wz.phase = null;
  const key = ST(m)[m.wz.step][0];
  if (key === 'lw' || key === 'ln' || key === 'lp') ensureLt(m);
  if (key === 'vault') ensureVault(m);
  touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0);
  if (key === 'lw') sayAsk('w', m.lt.L[m.lt.i]);
  else if (key === 'lp' && m.lt.pi < m.lt.order.length) sayAsk('p', m.lt.order[m.lt.pi]);
}
function wzAct(a, b, m) {
  if (!m) return;
  if (!m.wz) m.wz = { step: 0, done: {} };
  const keep = fn => { const y = scrollY; fn(); touch(m, 'map:' + m.id); renderMap(); scrollTo(0, y); };
  const cur = () => ST(m)[m.wz.step][0];
  const markDone = () => { if (!m.wz.done) m.wz.done = {}; m.wz.done[cur()] = true; };
  if (a === 'wzStart') { m.wz.on = true; m.wz.phase = null; wzGo(m, m.wz.step); }
  else if (a === 'wzNext') { markDone(); wzGo(m, m.wz.step + 1); }
  else if (a === 'pwLvl') keep(() => { const k = b.dataset.lv; m.t2.lv = k; m.t2.w = LVL[k].w.map(x => x[0]); m.t2.order = []; m.t2.cur = null; m.t2.d = [[], [], []]; });
  else if (a === 'pwPick') keep(() => { const i = +b.dataset.i; if (!m.t2.order) m.t2.order = []; if (!m.t2.order.includes(i)) m.t2.order.push(i); m.t2.cur = i; });
  else if (a === 'pwOpen') keep(() => { m.t2.cur = +b.dataset.i; });
  else if (a === 'pwDone') keep(() => { m.t2.cur = null; });
  else if (a === 'pwBack') keep(() => { const i = m.t2.cur; if (!((m.t2.d || [])[i] || []).length) m.t2.order = m.t2.order.filter(x => x !== i); m.t2.cur = null; });
  else if (a === 'wzSkip') wzGo(m, m.wz.step + 1);
  else if (a === 'wzTask' || a === 'wzGive') { if (a === 'wzGive') (m.wz.forced = m.wz.forced || {})[cur()] = true; markDone(); const k = cur(), d = ensureVault(m).code[TASKKEYS.indexOf(k)]; touch(m, 'map:' + m.id); renderMap(); showDigit(d, () => showTaskNote(m, k, () => wzGo(m, m.wz.step + 1))); }
  else if (a === 'wzBack') wzGo(m, m.wz.step - 1);
  else if (a === 'wzGoto') { WZ_NAV = false; wzGo(m, +b.dataset.i); }
  else if (a === 'wzMenu') { WZ_NAV = !WZ_NAV; const n = document.querySelector('.wznav'); if (n) n.classList.toggle('open', WZ_NAV); }
  else if (a === 'wzHints') { WZ_HINT = !WZ_HINT; const mm = document.querySelector('.wzmain'); if (mm) mm.classList.toggle('show', WZ_HINT); b.classList.toggle('solid', WZ_HINT); }
  else if (a === 'wzPause') { m.wz.on = false; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); toast('המיפוי נשמר. אפשר להמשיך, לערוך ולהדפיס שוב מהרשימה במסך "מיפוי חדש"'); }
  else if (a === 'wzStop') { m.wz.stopped = cur(); wzGo(m, IDX(m, 'fin')); toast('עברנו לסיכום. מלאי את ההערות ולחצי "דף סיכום להדפסה"'); }
  else if (a === 'wzSay') { sayAsk(b.dataset.kind, b.dataset.l || null); }
  else if (a === 'wzMark') { const l = b.dataset.l, v = +b.dataset.v; keep(() => { if (m.lt.wr[l] === v) delete m.lt.wr[l]; else m.lt.wr[l] = v; }); }
  else if (a === 'wzNm') { const l = b.dataset.l, v = +b.dataset.v; keep(() => { if (m.lt.nm[l] === v) delete m.lt.nm[l]; else m.lt.nm[l] = v; }); }
  else if (a === 'wzLnext') { const lt = m.lt; if (lt.i < lt.L.length - 1) { lt.i++; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); sayAsk('w', lt.L[lt.i]); } else { markDone(); wzGo(m, m.wz.step + 1); } }
  else if (a === 'wzLback') { const lt = m.lt; if (lt.i > 0) { lt.i--; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); } else wzGo(m, m.wz.step - 1); }
  else if (a === 'wzPick') {
    const lt = m.lt; if (lt.pi >= lt.order.length) return;
    const target = lt.order[lt.pi], l = b.dataset.l; lt.pc[target] = l; lt.pt[target] = l === target ? 1 : 3; lt.pi++;
    touch(m, 'map:' + m.id); renderMap();
    if (lt.pi < lt.order.length) setTimeout(() => sayAsk('p', lt.order[lt.pi]), 500);
  }
  else if (a === 'wzPreset') { keep(() => { m.lt.pi = 0; m.lt.pt = {}; m.lt.pc = {}; m.lt.order = shuf(m.lt.L); m.lt.grid = shuf(m.lt.L); }); sayAsk('p', m.lt.order[0]); }
  else if (a === 'wzKey') {
    const v = ensureVault(m), d = b.dataset.d;
    if (d === 'del') v.input = v.input.slice(0, -1);
    else if (d === 'ok') { if (v.input === v.code) { v.opened = true; markDone(); } else { v.input = ''; v.bad = true; } }
    else if (v.input.length < 4) { v.input += d; v.bad = false; }
    keep(() => {});
    if (v.bad) setTimeout(() => { v.bad = false; }, 700);
  }
  else if (a === 'wzSyMark') { const sy = m.sy; sy.r[sy.i] = +b.dataset.v; if (sy.i < SYLSEQ.length - 1) sy.i++; else markDone(); keep(() => {}); }
  else if (a === 'wzSyGo') { const sy = m.sy; sy.i = Math.max(0, Math.min(SYLSEQ.length - 1, sy.i + (+b.dataset.d))); keep(() => {}); }
  else if (a === 'wzSyJump') { m.sy.i = +b.dataset.i; keep(() => {}); }
  else if (a === 'wzBd') { ensureKb(m); if (m.bd.rows.length < 3 && !m.bd.rows.some(r => r.k === b.dataset.k)) { m.bd.rows.push({ k: b.dataset.k, ok: 0, note: '' }); keep(() => {}); } }
  else if (a === 'wzBdOk') { const r = m.bd.rows[+b.dataset.i]; keep(() => { r.ok = r.ok ? 0 : 1; }); }
  else if (a === 'wzBdRm') { const i = +b.dataset.i; keep(() => { m.bd.rows.splice(i, 1); m.bd.d.splice(i, 1); m.bd.d.push([]); }); }
  else if (a === 'wzShow') { window.__thinkT = true; m.wz.on = true; m.wz.phase = 'think'; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); setTimeout(() => { window.__thinkT = false; if (curMap() === m && m.wz.phase === 'think') { m.wz.phase = 'sum'; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); } }, 2300); }
  else if (a === 'wzEdit') { m.wz.phase = null; m.wz.step = IDX(m, 'fin'); touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); }
  else if (a === 'wzDone') { m.wz.on = false; m.wz.phase = null; touch(m, 'map:' + m.id); renderMap(); window.scrollTo(0, 0); }
}

/* ===================== פתיחה ===================== */
load();
{ const h = (location.hash || '').slice(1); PROGRESS = (h === 'progress' || h === 'kids');
  S.tab = PROGRESS ? 'kids' : ((h === 'map' || h === 'kb') ? h : 'start');
  if (PROGRESS) { $('pageTitle').textContent = 'מעקב התקדמות ילדים'; $('pageSub').textContent = 'לפי שלבי התוכנית: מספרים, אותיות, מודעות פונולוגית, כתיב פונטי, סימני ניקוד וקריאה שוטפת'; document.querySelector('.tabs').hidden = true; document.title = 'מעקב התקדמות ילדים'; }
  else $('tabKids').hidden = true; }
render();
if (localStorage.getItem(TOK)) { $('acct').firstElementChild && ($('acct').firstElementChild.textContent = 'מתחברת...'); cloudLoad(); }
</script>
