<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המלצה</title>
<style>html,body{margin:0;height:100%;background:#fff}body{display:flex;align-items:center;justify-content:center}
.pv{position:relative;display:flex;max-width:100%;max-height:100%;height:100%;align-items:center;justify-content:center}
video{max-width:100%;max-height:100%;border-radius:14px;background:#fdeef3;display:block}
.pvb{position:absolute;inset:0;margin:auto;width:76px;height:76px;border:0;border-radius:50%;background:#EF406E;box-shadow:0 6px 20px rgba(184,35,107,.4);cursor:pointer;padding:0}
.pvb:after{content:"";position:absolute;top:50%;left:50%;transform:translate(-35%,-50%);border-style:solid;border-width:15px 0 15px 25px;border-color:transparent transparent transparent #fff}
.pv.on .pvb{display:none}</style></head>
<body><div class="pv" id="pv"><video id="v" src="review-book-video.mp4" poster="review-book-video-poster.jpg" playsinline preload="metadata"></video><button class="pvb" id="b" type="button" aria-label="הפעלת הסרטון"></button></div>
<script>var v=document.getElementById('v'),b=document.getElementById('b'),w=document.getElementById('pv');
b.addEventListener('click',function(){v.controls=true;w.classList.add('on');v.play()});
v.addEventListener('click',function(){if(!v.controls){v.controls=true;w.classList.add('on');v.play()}});
v.addEventListener('ended',function(){w.classList.remove('on');v.controls=false;v.currentTime=0});</script></body></html>
