<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;position:fixed;background:linear-gradient(180deg,#fff 0%,#FEF6F5 100%);font-family:Rubik,'Open Sans',Arial,sans-serif;color:#4A2C3A;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;padding:8px;gap:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.bar h1{margin:0;font-size:clamp(15px,4vw,20px);font-weight:800;color:#B8236B;flex:1;text-align:center}

.coin:before{content:"";position:absolute;inset:9px;border-radius:50%;border:3px dashed rgba(184,120,20,.45)}
.coin img{width:72%;height:72%;object-fit:contain;border-radius:50%;pointer-events:none;background:#fff}
#kupot{position:absolute;left:0;right:0;bottom:0;height:52%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kupa{position:relative;border:4px solid #FBC5D6;border-radius:24px 24px 18px 18px;background:#FDE1EA;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:30px 4px 6px;cursor:pointer;box-shadow:0 6px 0 #F8B9B6;min-height:0}
.kupa:nth-child(2){background:#E3F5EC;border-color:#B9E3D0;box-shadow:0 6px 0 #A8D9C3}
.kupa:nth-child(3){background:#E5F1FA;border-color:#BCD9F0;box-shadow:0 6px 0 #A9CBE6}
.kupa .slot{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:56%;height:12px;border-radius:99px;background:#7a4b60;box-shadow:inset 0 3px 0 rgba(0,0,0,.35)}
.kupa .ic{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.kupa .ic img{max-width:92%;max-height:100%;object-fit:contain;pointer-events:none}
.kupa .nm{font-weight:700;font-size:clamp(11px,3vw,14px);color:#6b3a52;text-align:center;line-height:1.1}
.kupa.ok{animation:kok .45s}.kupa.no{animation:kno .4s}
@keyframes kok{40%{transform:scale(1.08) translateY(-4px)}}@keyframes kno{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.kupa.over{outline:4px solid #EF406E}
.end{position:absolute;inset:0;background:rgba(255,246,248,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;border-radius:22px}
.end.on{display:flex}.end h2{margin:0;font-size:clamp(28px,8vw,44px);color:#B8236B}
.btn{font:800 clamp(18px,5vw,24px) Rubik,Arial;color:#fff;background:#EF406E;border:0;border-radius:99px;padding:12px 34px;box-shadow:0 5px 0 #D14175;cursor:pointer}
.cf{position:fixed;width:10px;height:14px;z-index:30;pointer-events:none}
</style></head><body>
<div id="app">
 <div class="bar"><div style="width:40px"></div><h1>זרקו את המטבע לקופה הנכונה</h1><button class="ib" id="mute" type="button" aria-label="השתקה"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17V5l10-2v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="17" r="3"/><circle cx="17" cy="15" r="3"/><path id="mx" d="M3 3l18 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="display:none"/></svg></button></div>
 <div id="dots" class="dots"></div>
 <div id="field"><div id="coinzone"></div><div id="kupot"></div><div class="end" id="end"><h2>כל הכבוד!</h2><button class="btn" id="again" type="button">עוד פעם</button></div></div>
</div>

  var dx=(kr.left+kr.width/2)-(cr.left+cr.width/2),dy=(kr.top+14)-(cr.top+cr.height/2), ok=(k===c.__k); whoosh();
  c.style.transition='none';var from=fromDrag||{x:0,y:0};
  var anim=c.animate([{transform:'translate('+from.x+'px,'+from.y+'px) scale(1)'},{transform:'translate('+(from.x+(dx-from.x)*.5)+'px,'+(Math.min(from.y,dy)-70)+'px) scale(.8) rotate(180deg)',offset:.5},{transform:'translate('+dx+'px,'+dy+'px) scale(.28) rotate(360deg)'}],{duration:520,easing:'ease-in-out',fill:'forwards'});

}
