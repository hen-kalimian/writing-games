<style>

body{background:linear-gradient(180deg,#fff 0%,#FEF6F5 40%,#FBDCD8 100%)}

.big{font-size:30px}

.wheelbox{position:relative;width:min(78vw,330px);aspect-ratio:1}

.slot2{border:3px dashed #F8B9B6;border-radius:18px;padding:5px;display:flex;flex-direction:column;gap:5px;align-items:center;background:#FFF7F8;min-width:0}.slot2.ok{border:3px solid #4FB38C;background:#E5F6EE}

.arena{width:100%;max-width:460px;position:relative}.arena .card{width:100%}

.a-box{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gbox{position:relative;height:130px;border-radius:14px;background:#F6DC8A;border:3px solid #D9A441;cursor:pointer;overflow:hidden}.gbox .inner{position:absolute;inset:6px}.gbox .inner .card{height:100%}.lid{position:absolute;inset:0;background:linear-gradient(135deg,#F8B9B6,#EF8CA5);border-bottom:6px solid #D14175;transition:transform .45s;transform-origin:top}.gbox.open .lid{transform:translateY(-102%)}.gbox.okb{border-color:#4FB38C}

.a-balloon,.a-plane,.a-fly{height:270px;overflow:hidden;border-radius:18px;background:linear-gradient(#D3E8F8,#FEF6F5)}.a-fly{background:linear-gradient(#FFF0B8,#FEF6F5)}
.bl{position:absolute;bottom:-130px;width:23%;cursor:pointer;animation:rise 8s linear infinite}.bl .bbody{border-radius:50% 50% 46% 46%;padding:3px;box-shadow:inset -6px -8px 0 rgba(0,0,0,.06)}.bl .card{height:84px;border-radius:44px;border-width:2px;padding:2px}.bstr{width:2px;height:34px;background:#8d8aa0;margin:0 auto}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-480px)}}.bl.pop{animation:popk .3s forwards}@keyframes popk{to{transform:scale(1.6);opacity:0}}

@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-520%)}}.flyw{animation-name:driftb}@keyframes driftb{0%{transform:translate(0,0)}50%{transform:translate(-260%,26px)}100%{transform:translate(-520%,0)}}
.planeic{position:absolute;left:6px;bottom:8px;pointer-events:none}
</style>
</head>
