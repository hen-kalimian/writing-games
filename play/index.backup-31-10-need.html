<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>משחק</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Noto+Sans+Hebrew:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Noto Sans Hebrew','Rubik',Arial,sans-serif;color:#5E5A73}
body{background:linear-gradient(180deg,#fff 0%,#FEF6F5 40%,#FBDCD8 100%)}
.bgd{position:fixed;inset:0;pointer-events:none;overflow:hidden}.bgd i{position:absolute;border-radius:50%}
#app{position:relative;height:100%;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px 12px 10px}
.top{display:flex;align-items:center;gap:8px;min-height:30px}
.ttl{flex:1;font-family:Rubik,sans-serif;font-weight:800;font-size:17px;line-height:1.15;color:#5E5A73;text-align:center}
.ib{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid #FBC5D6;background:#FDE1EA;color:#B8236B;font:700 15px Rubik;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.spk{position:absolute;top:6px;left:6px;width:30px;height:30px;z-index:2}
.ins{text-align:center;font-weight:700;font-size:16px;color:#B8236B;min-height:22px;margin:2px 0 4px;line-height:1.25}
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;touch-action:pan-y}
#stage::-webkit-scrollbar{display:none}#stage>:first-child{margin-top:2px}#stage>:last-child{margin-bottom:auto} /* חן, 30.10.26: "כל מה שצבעתי בוורוד צריך לכווץ": בלי רווח ריק מעל השאלה */
.prog{display:flex;gap:5px;justify-content:center;margin-top:6px;min-height:10px;flex-wrap:wrap}
.prog i{width:9px;height:9px;border-radius:50%;background:#F1D5DA}.prog i.on{background:#EF406E}
.card{position:relative;background:#fff;border:3px solid #FBD9D6;border-radius:20px;box-shadow:0 4px 12px rgba(184,35,107,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;text-align:center;font-weight:700;overflow:hidden}
.card img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;pointer-events:none;min-height:0;flex:1 1 auto}
.card .t{font-size:var(--fs,22px);line-height:1.2;flex:none}
.card.sel{border-color:#EF406E;background:#FFF1F5;transform:scale(1.04)}
.card.ok{border-color:#4FB38C;background:#E5F6EE}.card.no{border-color:#EF8CA5;background:#FFF0F3;animation:sh .35s}
.card.gone{visibility:hidden}.card.fixed{cursor:default}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.grid{display:grid;gap:10px;width:100%;justify-content:center}
.btn{font-family:Rubik,sans-serif;font-weight:700;font-size:17px;color:#fff;background:#EF406E;border:0;border-radius:99px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 #D14175}
.btn.soft{background:#FDE1EA;color:#B8236B;box-shadow:none;border:2.5px solid #FBC5D6}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.big{font-size:30px}
.slots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;direction:rtl;min-height:56px}
.slot{min-width:48px;height:54px;border-bottom:4px solid #F8B9B6;border-radius:8px;background:#FFF7F8;display:flex;align-items:center;justify-content:center;font:800 28px Rubik;padding:0 6px}
.tile{min-width:48px;height:54px;border-radius:14px;background:#fff;border:3px solid #D4EFE2;font:800 26px Rubik;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-family:'Noto Sans Hebrew',Rubik}
.tile.used{visibility:hidden}
.lblimg{position:relative;width:100%;max-width:520px;margin:auto}.lblimg img{width:100%;display:block;border-radius:14px}
.spot{position:absolute;transform:translate(-50%,-50%);width:9%;aspect-ratio:1;border-radius:50%;border:2.5px dashed #EF406E;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font:800 clamp(14px,4.2vw,24px) Rubik;cursor:pointer;padding:0}
.spot.ok{border:2.5px solid #4FB38C;background:#E5F6EE}
.spot.no{animation:sh .35s}
#cl{display:none;position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:12;background:#EF406E;color:#fff;border:0;border-radius:99px;padding:9px 20px;font:700 15px Rubik,sans-serif;box-shadow:0 4px 0 #D14175;cursor:pointer}body.full #cl{display:block}#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
#end{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(254,246,245,.88)}
#end h2{margin:0;font:800 34px Rubik;color:#EF406E}#end p{margin:0;font-size:18px;font-weight:700}
.wheelbox{position:relative;width:min(92vw,520px);aspect-ratio:1;margin:0 auto}
.wheelbox canvas{width:100%;height:100%;display:block}
.pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid #EF406E;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));z-index:2}
.res{min-height:70px;font:800 34px 'Noto Sans Hebrew',Rubik;color:#B8236B;text-align:center}
.deck{width:min(72vw,300px);aspect-ratio:3/4;perspective:800px;cursor:pointer}
.deck .card{width:100%;height:100%;position:relative;z-index:2}.dstack:before,.dstack:after{content:'';position:absolute;inset:0;border-radius:20px;background:#fff;border:3px solid #FBD9D6;z-index:0}.dstack:before{transform:translate(7px,8px) rotate(2deg)}.dstack:after{transform:translate(-6px,5px) rotate(-2deg);z-index:1}.deck .card.dgo{position:absolute;inset:0;z-index:3;pointer-events:none;animation:dgo .65s ease-in-out forwards}@keyframes dgo{0%{transform:none}40%{transform:translate(70%,6%) rotate(10deg);z-index:3}70%{transform:translate(8%,12%) rotate(2deg);z-index:0}100%{transform:translate(6px,8px) rotate(2deg) scale(.98);z-index:0;opacity:.0}}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:480px;margin-top:8px;touch-action:none}
.slot2{border:3px dashed #F8B9B6;border-radius:18px;padding:5px;display:flex;flex-direction:column;gap:5px;align-items:center;background:#FFF7F8;min-width:0}.slot2.ok{border:3px solid #4FB38C;background:#E5F6EE}
.card.drag{cursor:grab;position:relative;z-index:5}.card.lift{z-index:60;box-shadow:0 12px 26px rgba(0,0,0,.28);cursor:grabbing}.slot2 .card.drag.ok{min-height:60px!important}
.arena{width:100%;max-width:460px;position:relative}.arena .card{width:100%}
.a-quiz,.a-find,.a-tv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.a-tv{border:6px solid #5E5A73;border-radius:20px;padding:10px;background:#EAF1F8}.it.q .card{min-height:96px}
