:root{--pink:#EF406E;--pink2:#D14175;--blush:#FDE1EA;--blush2:#FBC5D6;--mint:#EEF8F3;--mint2:#BFE8D6;--sky:#DDF0FB;--cream:#FDFBD3;--ink:#3A2225;--brown:#8B6755}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Open Sans',sans-serif;color:var(--ink);background:linear-gradient(160deg,#FFF1F5 0%,var(--mint) 55%,var(--sky) 100%);background-attachment:fixed;display:flex;justify-content:center}
h1,h2,.btn,.opt,.chip{font-family:'Rubik','Open Sans',sans-serif}
#app{width:100%;max-width:560px;padding:14px 16px 26px;display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;height:12px;border-radius:12px;background:#fff;border:2px solid var(--blush2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blush2),var(--pink));border-radius:12px;transition:width .35s}
.chip{background:#fff;border:2px solid var(--blush2);border-radius:20px;padding:4px 12px;font-size:15px;color:var(--pink2);font-weight:700;white-space:nowrap}
.mute{height:38px;padding:0 12px;font-family:'Rubik',sans-serif;font-weight:700;font-size:15px;border-radius:20px;border:2px solid var(--blush2);background:#fff;color:var(--pink2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:3px solid var(--blush2);border-radius:28px;padding:16px;box-shadow:0 6px 0 var(--blush2);position:relative;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;border-radius:50%;opacity:.55;z-index:0}
.card:before{width:80px;height:80px;background:var(--mint2);top:-30px;left:-24px}
.card:after{width:46px;height:46px;background:var(--cream);bottom:-14px;right:-10px}
.card>*{position:relative;z-index:1}
.q{font-family:'Rubik',sans-serif;font-weight:700;font-size:22px;line-height:1.35;text-align:center;margin:4px 0 12px}
.pic{display:block;margin:0 auto 12px;max-width:100%;max-height:230px;border-radius:18px;border:3px solid var(--blush2);background:#fff}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:center;font-size:18px;font-weight:700;padding:13px 12px;border-radius:20px;border:3px solid var(--blush2);background:#fff;color:var(--ink);cursor:pointer;line-height:1.3;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.gone{visibility:hidden}
.opt.ok{background:var(--mint2);border-color:#6FCBA2;color:#1d5c44}
.opt.bad{background:#FFD7DF;border-color:var(--pink);color:#9b1d44}
.opt[disabled]{cursor:default}
.hintrow{display:flex;justify-content:center;margin-top:12px;min-height:46px}
.btn{background:linear-gradient(180deg,#F2778F,var(--pink));color:#fff;border:0;border-radius:24px;padding:12px 28px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #c42b57}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c42b57}
.btn.ghost{background:#fff;color:var(--pink2);border:3px solid var(--blush2);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.fb{display:none;margin-top:12px;background:#FFE9EE;border:2px solid var(--pink);border-radius:16px;padding:12px 14px;font-size:17px;text-align:center}.fb b{color:#1d5c44;display:block;margin-top:4px;font-size:21px;font-family:'Rubik',sans-serif}
.hint{margin-top:10px;background:var(--cream);border:2px dashed #E9D77A;border-radius:16px;padding:10px 14px;font-size:16px;text-align:center;display:none}
.next{display:none;justify-content:center;margin-top:14px}
.center{text-align:center}
h1{font-size:30px;color:var(--pink);margin:8px 0}
h2{font-size:24px;color:var(--pink2);margin:6px 0}
.big{font-family:'Rubik',sans-serif;font-weight:700;font-size:54px;color:var(--pink);margin:4px 0}
.miss{text-align:right;margin:10px 0 0;padding:0;list-style:none;font-size:15px}
.miss li{background:var(--blush);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.miss b{display:block;color:var(--pink2)}
.stack{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:14px}
.mw{position:relative;margin-bottom:4px}
.msvg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
.mpic{position:relative;max-width:330px;margin:0 auto 14px}
.mpic img{width:100%;display:block;border-radius:18px;border:3px solid var(--blush2)}
.dot{position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--pink);transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 0 0 4px rgba(239,64,110,.18)}
.dot.ok{background:#6FCBA2;border-color:#3b9a74;box-shadow:none}
.mnames{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px 56px}
.mcol{display:grid;gap:10px;align-content:space-around}
.mn,.mt{font-size:16px;padding:10px 8px}
.opt.sel{background:var(--blush);border-color:var(--pink)}
canvas#c{position:fixed;inset:0;pointer-events:none;z-index:50}

const sBad=()=>tone(200,.3,'triangle',.1);
const sHint=()=>tone(520,.12);
function start(list){order=shuffle(list);if(list===Q){[7,16,25,34].forEach((p,k)=>order.splice(Math.min(p,order.length),0,M[k]))}idx=0;score=0;missed=[];streak=0;show()}
function home(){app.innerHTML=`<div class="card center"><h1>חידון מדעים לעדן</h1><h2>גוף האדם: מערכות, עור, שלד ושרירים</h2><p style="font-size:17px">${Q.length+M.length} שאלות, כל אחת שווה שתי נקודות, ולכן אפשר להגיע ל-${(Q.length+M.length)*2} (100 וגם בונוס). בחידון יש ארבעה משחקי חיבור שבהם מותחים קו. בכל שאלה אפשר ללחוץ על רמז אחד: לפעמים הוא מוריד שתי תשובות לא נכונות (50-50), ולפעמים הוא כותב רמז במילים.</p><div class="stack"><button class="btn" id="go">מתחילים</button></div></div>`;
document.getElementById('go').onclick=()=>{tone(600,.1);start(Q)}}
function hdr(){return `<div class="top"><div class="bar"><i style="width:${idx/order.length*100}%"></i></div><span class="chip">${idx+1} מתוך ${order.length}</span><span class="chip">${score} נק'</span><button class="mute" id="mu" >${muted?'שקט':'צליל'}</button></div>`}
function show(){
 if(idx>=order.length)return end();
 if(order[idx].m)return showMatch(order[idx]);
 answered=false;hintUsed=false;
 const q=order[idx];
 const opts=shuffle([{t:q.a,ok:1},...q.w.map(t=>({t,ok:0}))]);
 app.innerHTML=hdr()+`<div class="card"><div class="q">${q.q}</div>${q.i?`<img class="pic" src="${q.i}" alt="">`:''}<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join('')}</div><div class="hintrow"><button class="btn ghost" id="hb">רמז</button></div><div class="hint" id="ht"></div><div class="fb" id="fb"></div></div><div class="next" id="nx"><button class="btn" id="nb">${idx==order.length-1?'לסיום':'לשאלה הבאה'}</button></div>`;
 document.getElementById('mu').onclick=()=>{muted=!muted;show2()};
 const btns=[...app.querySelectorAll('.opt')];
 btns.forEach(b=>b.onclick=()=>pick(b,opts[+b.dataset.i],btns,opts));
 document.getElementById('hb').onclick=()=>hint(btns,opts,q);
 document.getElementById('nb').onclick=()=>{idx++;show()};
}
function show2(){const m=document.getElementById('mu');if(m){m.textContent=muted?'שקט':'צליל'}}
function hint(btns,opts,q){
 if(answered||hintUsed)return;hintUsed=true;sHint();
 const hb=document.getElementById('hb');hb.disabled=true;
 const ht=document.getElementById('ht');
 if(Math.random()<.5){
  const wrong=shuffle(opts.map((o,i)=>i).filter(i=>!opts[i].ok)).slice(0,2);
  wrong.forEach(i=>btns[i].classList.add('gone'));
  ht.textContent='נשארו שתי תשובות: אחת מהן נכונה';
 }else{ht.textContent='רמז: '+q.h}
 ht.style.display='block';
}
function pick(b,o,btns,opts){
 if(answered||b.classList.contains('gone'))return;answered=true;
 document.getElementById('hb').disabled=true;
 btns.forEach((x,i)=>{x.disabled=true;if(opts[i].ok)x.classList.add('ok')});
 if(o.ok){score+=2;streak++;sOk();if(streak%5==0)confetti(40)}else{b.classList.add('bad');sBad();streak=0;missed.push(order[idx]);const f=document.getElementById('fb');f.innerHTML='לא נכון. התשובה הנכונה:<b>'+order[idx].a+'</b>';f.style.display='block'}
 document.getElementById('nx').style.display='flex';
 if(!o.ok)setTimeout(()=>document.getElementById('nx').scrollIntoView({behavior:'smooth',block:'center'}),150);
}
function showMatch(q){
 answered=false;hintUsed=false;
 const names=shuffle(q.n),tg=q.img?q.t:shuffle(q.t);
 let h=hdr()+`<div class="card"><div class="q">${q.q}</div><div class="mw" id="mw">`;
 if(q.img){h+=`<div class="mpic"><img src="${q.img}" alt="">${tg.map(t=>`<span class="dot" data-id="${t.id}" style="left:${t.x}%;top:${t.y}%"></span>`).join('')}</div><div class="mnames">${names.map(n=>`<button class="opt mn" data-id="${n.id}">${n.t}</button>`).join('')}</div>`}
 else{h+=`<div class="mcols"><div class="mcol">${names.map(n=>`<button class="opt mn" data-id="${n.id}">${n.t}</button>`).join('')}</div><div class="mcol">${tg.map(t=>`<button class="opt mt" data-id="${t.id}">${t.t}</button>`).join('')}</div></div>`}
 h+=`<svg class="msvg" id="sv"></svg></div><div class="hintrow"><button class="btn ghost" id="hb">רמז</button></div><div class="hint" id="ht"></div></div><div class="next" id="nx"><button class="btn" id="nb">${idx==order.length-1?'לסיום':'לשאלה הבאה'}</button></div>`;
 app.innerHTML=h;
 document.getElementById('mu').onclick=()=>{muted=!muted;show2()};
 const mw=document.getElementById('mw'),sv=document.getElementById('sv');
 const ns=[...mw.querySelectorAll('.mn')],ts=[...mw.querySelectorAll(q.img?'.dot':'.mt')];
 let sel=null,lines=[],mistakes=0,left=ns.length,temp=null;
 function anchor(el,isName){const r=el.getBoundingClientRect(),b=mw.getBoundingClientRect();
  let x,y;
  if(el.classList.contains('dot')){x=r.left+r.width/2;y=r.top+r.height/2}
  else if(isName&&q.img){x=r.left+r.width/2;y=r.top}
  else if(isName){x=r.left;y=r.top+r.height/2}
  else{x=r.right;y=r.top+r.height/2}
  return [x-b.left,y-b.top]}
 function draw(){const b=mw.getBoundingClientRect();sv.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);
  sv.innerHTML=lines.concat(temp?[temp]:[]).map(l=>{const [x1,y1]=anchor(l.n,1),[x2,y2]=anchor(l.t,0);const c=l.bad?'#EF406E':'#3b9a74';
   return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="4" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="5" fill="${c}"/>`}).join('')}
 function connect(n,t,auto){n.classList.add('ok');n.disabled=true;t.classList.add('ok');if(t.tagName=='BUTTON')t.disabled=true;lines.push({n,t});left--;draw();
  if(!left){answered=true;score+=mistakes==0?2:mistakes==1?1:0;sOk();confetti(50);document.getElementById('hb').disabled=true;document.getElementById('nx').style.display='flex';top2()}}
 function top2(){const c=app.querySelectorAll('.chip');if(c[1])c[1].textContent=score+" נק'"}
 ns.forEach(n=>n.onclick=()=>{if(n.disabled)return;ns.forEach(x=>x.classList.remove('sel'));n.classList.add('sel');sel=n;tone(520,.06)});
 ts.forEach(t=>t.onclick=()=>{if(!sel||t.classList.contains('ok'))return;
  if(sel.dataset.id==t.dataset.id){const n=sel;sel=null;n.classList.remove('sel');sOk();connect(n,t)}
  else{mistakes++;sBad();streak=0;temp={n:sel,t,bad:1};draw();const n=sel;sel=null;n.classList.remove('sel');setTimeout(()=>{temp=null;draw()},550)}});
 document.getElementById('hb').onclick=()=>{if(hintUsed||answered)return;hintUsed=true;sHint();document.getElementById('hb').disabled=true;
  const n=ns.find(x=>!x.disabled);const t=ts.find(x=>x.dataset.id==n.dataset.id);ns.forEach(x=>x.classList.remove('sel'));sel=null;
  const ht=document.getElementById('ht');ht.textContent='רמז: חיברתי עבורך קו אחד. '+q.h;ht.style.display='block';connect(n,t)};
 document.getElementById('nb').onclick=()=>{idx++;show()};
 addEventListener('resize',draw);setTimeout(draw,50);
 const im=mw.querySelector('img');if(im&&!im.complete)im.onload=draw;
}
function end(){
 const full=order.length===Q.length+M.length,max=order.length*2,pct=Math.round(score/max*100);
 const msg=pct==100?'מושלם! ידעת הכול':pct>=80?'כל הכבוד, כמעט הכול':pct>=60?'יפה מאוד, עוד קצת תרגול':'התחלה טובה, בוא נחזור על מה שפספסנו';
 app.innerHTML=`<div class="card center"><h1>סיימת!</h1><div class="big">${full?score:score+" / "+max}</div><p style="margin:0;font-size:17px">${full?"ציון מתוך 100"+(score>100?", כולל בונוס של "+(score-100)+" נקודות":""):"נקודות"}</p><h2>${msg}</h2>${missed.length?`<p style="font-size:16px;margin:6px 0">שאלות שכדאי לחזור עליהן:</p><ul class="miss">${missed.map(m=>`<li>${m.q}<b>${m.a}</b></li>`).join('')}</ul>`:''}<div class="stack">${missed.length?'<button class="btn" id="rm">לחזור רק על הטעויות</button>':''}<button class="btn ghost" id="ra">לשחק הכול מחדש</button></div></div>`;
 if(pct>=80){confetti(120);sOk()}
 const rm=document.getElementById('rm');if(rm)rm.onclick=()=>start(missed);
 document.getElementById('ra').onclick=()=>start(Q);
}
function confetti(n){
 const c=document.getElementById('c'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#EF406E','#FBC5D6','#BFE8D6','#DDF0FB','#FDFBD3'];
 const p=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*200,r:4+Math.random()*6,vy:2+Math.random()*3,vx:-1+Math.random()*2,c:cols[Math.floor(Math.random()*cols.length)]}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill()});if(++t<150)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
home();
</script></body></html>
