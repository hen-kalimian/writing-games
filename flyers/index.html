<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>פליירים לדוגמה של משתתפות התוכנית</title>
<style>
:root{--pink:#FDE1EA;--pink2:#FBC5D6;--fuc:#D14175;--ink:#2E3A45;--mint:#CDEFE2;--sky:#DCEBFA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Rubik,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff 0%,var(--pink) 55%,var(--mint) 100%);display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;text-align:center;padding:10px 12px 4px;font-weight:700;font-size:clamp(15px,3.6vw,19px);color:var(--fuc)}
.top small{display:block;font-weight:400;color:var(--ink);font-size:clamp(12px,3vw,14px);margin-top:2px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px 52px}
.frame{height:100%;max-width:100%;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.frame a{display:block;height:100%;max-width:100%}
.frame img{height:100%;max-width:100%;object-fit:contain;border-radius:14px;box-shadow:0 6px 22px rgba(209,65,117,.25);background:#fff;border:3px solid #fff;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:2px solid var(--pink2);background:#fff;color:var(--fuc);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:0}
.nav:active{background:var(--pink)}
.nav svg{width:22px;height:22px}
.prev{right:6px}.next{left:6px}
.bar{flex:none;text-align:center;padding:6px 10px 10px}
.cap{font-weight:600;font-size:clamp(14px,3.4vw,17px);min-height:1.4em}
.dots{display:flex;gap:7px;justify-content:center;margin-top:7px;flex-wrap:wrap}
.dots button{width:11px;height:11px;border-radius:50%;border:0;background:var(--pink2);padding:0;cursor:pointer}
.dots button.on{background:var(--fuc);transform:scale(1.25)}
.hint{font-size:12px;color:#5b6772;margin-top:5px}
@media (max-width:420px){.stage{padding:4px 46px}.nav{width:40px;height:40px}}
</style>
</head>
<body>
<div class="top">פליירים לדוגמה של משתתפות התוכנית<small>דפדפי בין הפליירים, ולחצי על פלייר כדי לראות אותו בגדול</small></div>
<div class="stage" id="stage">
  <button class="nav prev" id="prev" aria-label="הפלייר הקודם"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="frame" id="frame"><a id="lnk" href="#" target="_blank" rel="noopener"><img id="img" alt=""></a></div>
  <button class="nav next" id="next" aria-label="הפלייר הבא"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
</div>
<div class="bar"><div class="cap" id="cap"></div><div class="dots" id="dots"></div></div>
<script>
(function(){
  var F=[
    ["f1.jpg","מתקדמים בביטחון"],
    ["f2.jpg","קורס מקיף של הכנה לכיתה א"],
    ["f3.jpg","ללמוד בביטחון"],
    ["f4.jpg","צעדים ראשונים לכיתה א'"],
    ["f5.jpg","לילדי גן \"לחן\" בלבד"],
    ["f6.jpg","צעד בטוח לכיתה א'"],
    ["f7.jpg","ללמוד בביטחון: שיעורים פרטיים"],
    ["f8.jpg","יחד להצלחה ולביטחון"],
    ["f9.jpg","הכנה לכיתה א'"]
  ];
  var i=0,img=document.getElementById('img'),lnk=document.getElementById('lnk'),cap=document.getElementById('cap'),dots=document.getElementById('dots');
  F.forEach(function(_,k){var b=document.createElement('button');b.setAttribute('aria-label','פלייר '+(k+1));b.onclick=function(){go(k)};dots.appendChild(b)});
  function go(n){
    i=(n+F.length)%F.length;
    var src='img/'+F[i][0];
    img.src=src;img.alt=F[i][1];lnk.href=src;
    cap.textContent=(i+1)+' מתוך '+F.length+' · '+F[i][1];
    Array.prototype.forEach.call(dots.children,function(d,k){d.className=k===i?'on':''});
    var p=new Image();p.src='img/'+F[(i+1)%F.length][0];
  }
  document.getElementById('next').onclick=function(){go(i+1)};
  document.getElementById('prev').onclick=function(){go(i-1)};
  document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(i+1);else if(e.key==='ArrowRight')go(i-1)});
  var x0=null,y0=null,sw=false;
  var fr=document.getElementById('stage');
  fr.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;sw=false},{passive:true});
  fr.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){sw=true;go(dx>0?i+1:i-1)}},{passive:true});
  lnk.addEventListener('click',function(e){if(sw){e.preventDefault();sw=false}});
  go(0);
})();
</script>
</body>
</html>
