  for(var y2=1;y2<H;y2++)for(var x3=1;x3<W-1;x3++){var j=y2*W+x3;if(!label[j]||dist[j]===1)continue;var m=Math.min(dist[j-1]+1,dist[j-W]+1,dist[j-W-1]+1,dist[j-W+1]+1);if(m<dist[j])dist[j]=m}
  for(var y3=H-2;y3>=0;y3--)for(var x4=W-2;x4>0;x4--){var j2=y3*W+x4;if(!label[j2]||dist[j2]===1)continue;var m2=Math.min(dist[j2+1]+1,dist[j2+W]+1,dist[j2+W-1]+1,dist[j2+W+1]+1);if(m2<dist[j2])dist[j2]=m2}
  var best=new Int32Array(n),bestD=new Uint16Array(n);
  for(var q2=0;q2<W*H;q2++){var l2=label[q2];if(l2&&dist[q2]!==INF&&dist[q2]>bestD[l2]){bestD[l2]=dist[q2];best[l2]=q2}}
  var adj=[];for(var a=0;a<n;a++)adj.push({});
  for(var y4=1;y4<H-1;y4+=1)for(var x5=1;x5<W-1;x5+=1){
    var p0=y4*W+x5;if(label[p0])continue;
    for(var r=2;r<=5;r+=3){
      if(y4-r<0||y4+r>=H||x5-r<0||x5+r>=W)continue;
      var a1=label[p0-r],a2=label[p0+r],b1=label[p0-r*W],b2=label[p0+r*W];
      if(a1&&a2&&a1!==a2){adj[a1][a2]=1;adj[a2][a1]=1}
      if(b1&&b2&&b1!==b2){adj[b1][b2]=1;adj[b2][b1]=1}
    }
  }
  return {label:label,n:n,area:area,border:border,best:best,bestD:bestD,adj:adj};
}
function assignColors(A,k,minArea){
  var order=[];for(var i=1;i<A.n;i++)if(A.area[i]>=minArea&&!A.border[i])order.push(i);
  order.sort(function(a,b){return A.area[b]-A.area[a]});
  var bg=-1;
  var col={},cnt=[];for(var c=0;c<k;c++)cnt.push(0);
  order.forEach(function(r){
    if(r===bg)return;
    var used={};Object.keys(A.adj[r]).forEach(function(nb){if(col[nb]!==undefined)used[col[nb]]=1});
    var pick=-1,bestC=1e9;
    for(var c2=0;c2<k;c2++){if(used[c2])continue;if(cnt[c2]<bestC){bestC=cnt[c2];pick=c2}}
    if(pick<0)pick=Math.floor(Math.random()*k);
    col[r]=pick;cnt[pick]++;
  });
  return col;
}
function makeLabels(A,asg,CFG,W){
  var out=[],scale=W/645;
  Object.keys(asg).forEach(function(r){
    var ci=asg[r],b=A.best[r],bx=b%W,by=(b/W)|0,rad=A.bestD[r];
    var text=CFG.mode==='numbers'?String(ci+1):CFG.colors[ci].name;
    var fs=CFG.mode==='numbers'?Math.min(30*scale,rad*1.15):Math.min(22*scale,(rad*1.7)/(text.length*.55));
    if(fs<(CFG.mode==='numbers'?10:6.5)*scale)return;
    out.push({x:bx,y:by,t:text,fs:fs});
  });
  return out;
}

var cv=document.getElementById('cv'),cx=cv.getContext('2d');
var W,H,label,A,labels=[],paintCv,paintCx,paint,img=new Image(),ready=false,R=10,dirty=false;
function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)]}
img.onload=function(){
  var sc=Math.min(1,900/img.naturalWidth);
  W=Math.round(img.naturalWidth*sc);H=Math.round(img.naturalHeight*sc);
  cv.width=W;cv.height=H;
  var tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;var tc=tmp.getContext('2d');
  tc.fillStyle='#fff';tc.fillRect(0,0,W,H);tc.drawImage(img,0,0,W,H);
  A=analyze(tc.getImageData(0,0,W,H).data,W,H,170);label=A.label;
  if(CFG.mode!=='free'){
    var scale=W/645,asg=assignColors(A,CFG.k,CFG.minArea*scale*scale);
    labels=makeLabels(A,asg,CFG,W);
  }
  paintCv=document.createElement('canvas');paintCv.width=W;paintCv.height=H;paintCx=paintCv.getContext('2d');
  paint=paintCx.createImageData(W,H);
  R=Math.max(4,Math.round(W*BRUSH));
  ready=true;render();
};
img.src="coloring-a68.jpg";
function render(){
  if(!ready)return;
  paintCx.putImageData(paint,0,0);
  cx.globalCompositeOperation='source-over';cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
  cx.drawImage(paintCv,0,0);
  cx.globalCompositeOperation='multiply';cx.drawImage(img,0,0,W,H);
  cx.globalCompositeOperation='source-over';
  cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='rgba(40,36,60,.82)';
  for(var i=0;i<labels.length;i++){var l=labels[i];cx.font='800 '+Math.round(l.fs)+'px Rubik,Arial,sans-serif';cx.fillText(l.t,l.x,l.y)}
}
function schedule(){if(dirty)return;dirty=true;requestAnimationFrame(function(){dirty=false;render()})}
function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
function regionAt(x,y){
  x=Math.round(x);y=Math.round(y);
  if(x<0||y<0||x>=W||y>=H)return 0;
  var l=label[y*W+x];if(l)return l;
  for(var r=1;r<=10;r++)for(var dy=-r;dy<=r;dy++)for(var dx=-r;dx<=r;dx++){var xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=H)continue;var v=label[yy*W+xx];if(v)return v}
  return 0;
}
function stamp(x,y,reg,col){
  var x0=Math.max(0,Math.floor(x-R)),x1=Math.min(W-1,Math.ceil(x+R)),y0=Math.max(0,Math.floor(y-R)),y1=Math.min(H-1,Math.ceil(y+R));
  var d=paint.data,r2=R*R;
  for(var yy=y0;yy<=y1;yy++)for(var xx=x0;xx<=x1;xx++){
    var dx=xx-x,dy=yy-y;if(dx*dx+dy*dy>r2)continue;
    var idx=yy*W+xx;if(label[idx]!==reg)continue;
    var o=idx*4;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;
  }
}
var drawing=false,reg=0,lx=0,ly=0,col=null,lastSnd=0;
function down(e){
  if(!ready)return;
  var p=pos(e);reg=regionAt(p[0],p[1]);if(!reg)return;
  drawing=true;col=hex(cur);lx=p[0];ly=p[1];
  stamp(lx,ly,reg,col);schedule();
  try{cv.setPointerCapture(e.pointerId)}catch(x){}
}
function move(e){
  if(!drawing)return;
  var p=pos(e),dx=p[0]-lx,dy=p[1]-ly,dist=Math.sqrt(dx*dx+dy*dy),steps=Math.max(1,Math.ceil(dist/(R/3)));
  for(var i=1;i<=steps;i++)stamp(lx+dx*i/steps,ly+dy*i/steps,reg,col);
  lx=p[0];ly=p[1];schedule();
  var n=Date.now();if(n-lastSnd>180){lastSnd=n;window.SFX.step()}
}
function up(){drawing=false}
cv.addEventListener('pointerdown',function(e){e.preventDefault();down(e)});
cv.addEventListener('pointermove',function(e){if(drawing){e.preventDefault();move(e)}});
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);
cv.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
function clearAll(){if(!ready)return;paint.data.fill(0);render()}
var lastC=0;
function clr(){var n=Date.now();if(n-lastC<400)return;lastC=n;clearAll()}
document.getElementById('clear').addEventListener('pointerup',clr);document.getElementById('clear').addEventListener('click',clr);
</script>
