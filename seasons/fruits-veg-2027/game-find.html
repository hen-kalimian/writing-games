<title>אֵיפֹה?</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Open Sans',Arial,sans-serif;color:#5E5A73}
body{background:linear-gradient(180deg,#FFFFFF 0%,#FEF6F5 45%,#F8B9B6 135%);display:flex;justify-content:center}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;background:#FBD9D6;opacity:.55}
.wrap{position:relative;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 14px 12px;gap:8px}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:34px}
.brand{font-family:Rubik,sans-serif;font-weight:700;font-size:13px;color:#5F8DB5;border-bottom:3px solid #EF406E;padding-bottom:2px}
.ico{width:36px;height:36px;border-radius:12px;border:0;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08),0 0 0 2px #FDE1EA;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ico svg{width:20px;height:20px}
.icos{display:flex;gap:8px}
h1{margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:22px;line-height:1.15;text-align:center;color:#5E5A73}
h1 b{color:#EF406E;font-weight:900}
.btn{display:block;margin:0 auto;border:0;border-radius:18px;padding:13px 26px;font-family:Rubik,sans-serif;font-weight:800;font-size:19px;color:#fff;background:#EF406E;box-shadow:0 4px 0 #D14175;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D14175}
.btn.mint{background:#4FB38C;box-shadow:0 4px 0 #3A8F70}
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(254,246,245,.94);text-align:center}
.card{background:#fff;border-radius:26px;padding:20px 18px;box-shadow:0 8px 24px rgba(239,64,110,.14),0 0 0 3px #FDE1EA;max-width:420px;width:100%}
.card h2{margin:6px 0 10px;font-family:Rubik,sans-serif;font-weight:800;font-size:22px;color:#B8236B}
.card p{margin:0 0 14px;font-size:18px;line-height:1.5;font-weight:700}
.card .pic{width:120px;height:120px;margin:0 auto}
.card .pic svg{width:100%;height:100%}
.spk{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.08),0 0 0 3px #B7CDE0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;vertical-align:middle}
.spk svg{width:22px;height:22px}
.spk:active{transform:translateY(2px)}
.spk.on{box-shadow:0 0 0 3px #EF406E}
.say-row{display:flex;align-items:center;justify-content:center;gap:10px}
.hidden{display:none!important}
.conf{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ask{width:100%;background:#fff;border-radius:22px;padding:10px 14px;box-shadow:0 0 0 3px #FDE1EA;text-align:center;flex:0 0 auto}
.ask small{display:block;font-size:13px;font-weight:700;color:#5F8DB5;margin-bottom:4px}
.ask .qrow{display:flex;align-items:center;justify-content:center;gap:12px}
.ask .qtext{font-family:Rubik,sans-serif;font-weight:800;font-size:26px;color:#B8236B;line-height:1.25}
.stage{flex:1;width:100%;display:flex;flex-direction:column;gap:12px;justify-content:flex-start;min-height:0}
.opt{flex:1;min-height:0;border:0;border-radius:28px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.07),0 0 0 4px #FDE1EA;display:flex;align-items:center;justify-content:center;gap:4%;padding:12px;cursor:pointer;position:relative;transition:transform .15s}
.opt:active{transform:scale(.97)}
.opt svg{height:100%;max-height:100%;width:auto;max-width:30%;flex:0 1 auto}
.opt.one svg{max-width:62%}
.opt.big svg{max-width:78%}
.opt.small svg{max-width:34%}
.opt.s3.big svg{max-width:80%}.opt.s3.mid svg{max-width:52%}.opt.s3.small svg{max-width:30%}
.grid4{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.grid4 .opt{min-height:0}
.grid4 .opt svg{max-width:70%}
.opt.ok{box-shadow:0 0 0 6px #4FB38C,0 0 24px rgba(79,179,140,.5);animation:pop .5s}
.opt.no{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.dots{display:flex;gap:6px;justify-content:center;flex:0 0 auto}
.dots i{width:12px;height:12px;border-radius:50%;background:#FBD9D6}
.dots i.on{background:#EF406E}
.big-play{width:110px;height:110px;border-radius:50%;border:0;background:#EF406E;box-shadow:0 7px 0 #D14175;display:flex;align-items:center;justify-content:center;margin:12px auto 0;cursor:pointer}
.big-play svg{width:52px;height:52px}
.praise{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#fff;border-radius:22px;padding:10px 22px;font-family:Rubik,sans-serif;font-weight:900;font-size:28px;color:#4FB38C;box-shadow:0 8px 24px rgba(79,179,140,.3),0 0 0 4px #D7F0E5;pointer-events:none;z-index:15;white-space:nowrap}
.praise.show{animation:pr 1.2s ease forwards}
@keyframes pr{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
</style>
</head>

<div class="bg"><i style="width:220px;height:220px;right:-70px;top:-60px"></i><i style="width:150px;height:150px;left:-50px;bottom:60px"></i><i style="width:90px;height:90px;right:18%;bottom:-30px"></i></div>

<div class="wrap">
 <div class="top"><span class="brand">חן קלימיאן - לדבר עם ילדים</span><span class="icos"><button class="ico" id="mute" aria-label="השתקה"></button><button class="ico" id="full" aria-label="מסך מלא"><svg viewBox="0 0 24 24" fill="none" stroke="#5F8DB5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></span></div>
 <div class="dots" id="dots"></div>
 <div class="ask"><small>שאלו את הילד את השאלות הבאות:</small><div class="qrow"><span class="qtext" id="qtext"></span><button class="spk" id="qspk" type="button" data-say="" aria-label="להשמיע את השאלה"></button></div></div>
 <div class="stage noscroll" id="stage"></div>
 <div class="overlay" id="start"><div class="card"><div class="pic" id="startpic"></div><h2>אֵיפֹה?</h2><button class="big-play" id="go" aria-label="התחלה"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg></button></div></div>
