  cx.fillStyle='#8FD3B6';cx.fillRect(-20,GROUND,W+40,12);
  // puddles
  puddles.forEach(function(p){cx.fillStyle='#8FC1E8';cx.beginPath();cx.ellipse(p.x+p.w/2,GROUND+12,p.w/2,12,0,0,6.3);cx.fill();cx.strokeStyle='#5F8DB5';cx.lineWidth=3;cx.stroke()});
  // falling decor
  fallers.forEach(function(f){cx.save();cx.translate(f.x,f.y);cx.rotate(f.a);cx.globalAlpha=.6;cx.drawImage(imgs[f.k],-12,-12,24,24);cx.restore()});cx.globalAlpha=1;
  // items
  objs.forEach(function(o){var bob=Math.sin((t+o.x)/14)*5;cx.drawImage(imgs[o.art],o.x,o.y+bob,o.s,o.s)});
  // hero
  if(!(hero.inv>0&&Math.floor(hero.inv/5)%2)){
    var sq=hero.onG?Math.sin(t/3)*2:0;
    cx.drawImage(imgs.player,hero.x,hero.y+sq,hero.w,hero.h-sq);
  }
  cx.restore();
}
function loop(){if(ready){if(state==='play')step();if(hero)draw()}requestAnimationFrame(loop)}
function begin(){reset();state='play'}
$('go').addEventListener('click',function(){$('intro').classList.add('hidden');begin()});
['mousedown','touchstart'].forEach(function(ev){$('stage').addEventListener(ev,function(e){jump();if(e.cancelable)e.preventDefault()},{passive:false})});
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});
reset();loop();
</script>
</body>
