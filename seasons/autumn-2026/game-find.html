B5E\" stroke=\"#6B4A3A\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M50 30 C 50 22 52 14 58 8\" stroke=\"#6B4A3A\" stroke-width=\"4\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M56 16 C 66 6 80 10 82 14 C 74 22 62 22 56 16 Z\" fill=\"#7DB36B\" stroke=\"#6B4A3A\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><ellipse cx=\"30\" cy=\"50\" rx=\"6\" ry=\"10\" fill=\"#fff\" fill-opacity=\".35\" transform=\"rotate(15 30 50)\"/></svg>"}};
var $=function(i){return document.getElementById(i)};
window.wireTop();
$('startpic').innerHTML=D.arts.hedgehog;$('endpic').innerHTML=D.arts.hedgehog;
var order=[],idx=0,locked=false,solved=0;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cluster(art,n,cls){var h='';for(var i=0;i<n;i++)h+=D.arts[art];return '<button class="opt '+cls+'">'+h+'</button>'}
function sizeVariant(r){ // big vs small in same card style
  var a=D.arts[r.art];return [ '<button class="opt big" data-ok="'+(r.kind==='big'?1:0)+'">'+a+'</button>', '<button class="opt small" data-ok="'+(r.kind==='small'?1:0)+'">'+a+'</button>' ];
}
function render(){
  var r=D.rounds[order[idx]];var cards=[];
  var dots='';for(var i=0;i<order.length;i++)dots+='<i class="'+(i<=idx?'on':'')+'"></i>';$('dots').innerHTML=dots;
  if(r.kind==='big'||r.kind==='small'){cards=sizeVariant(r)}
  else if(r.kind==='color'){
    cards=['<button class="opt one" data-ok="1">'+D.arts[r.art]+'</button>','<button class="opt one" data-ok="0">'+D.arts[r.other]+'</button>'];
  } else {
    var many=r.want>1;
    cards=['<button class="opt '+(many?'':'one')+'" data-ok="1">'+rep(r.art,many?3:1)+'</button>','<button class="opt '+(many?'one':'')+'" data-ok="0">'+rep(r.art,many?1:3)+'</button>'];
  }
  if(Math.random()<.5)cards.reverse();
  $('stage').innerHTML=cards.join('');
  var bs=$('stage').querySelectorAll('.opt');
  for(var k=0;k<bs.length;k++)(function(b){b.addEventListener('click',function(){pick(b)})})(bs[k]);
  locked=false;
  setTimeout(function(){window.say(r.say)},350);
}
function rep(a,n){var h='';for(var i=0;i<n;i++)h+=D.arts[a];return h}
function pick(b){
  if(locked)return;
  if(b.getAttribute('data-ok')==='1'){
    locked=true;b.classList.add('ok');window.SFX.ok();solved++;
    window.say(D.praise[solved%D.praise.length]);
    setTimeout(function(){idx++;if(idx>=order.length)finish();else render()},1500);
  } else {
    b.classList.add('no');window.SFX.bad();setTimeout(function(){b.classList.remove('no')},450);
    window.say(D.retry);
  }
}
function finish(){$('end').classList.remove('hidden');window.SFX.win();window.confetti(110);setTimeout(function(){window.say(D.done)},400)}
function start(){order=shuffle(D.rounds.map(function(_,i){return i}));idx=0;solved=0;$('end').classList.add('hidden');$('start').classList.add('hidden');render()}
$('go').addEventListener('click',start);
$('again').addEventListener('click',start);
$('ask').addEventListener('click',function(){var r=D.rounds[order[idx]];if(r)window.say(r.say)});
</script>
