*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Open Sans',Arial,sans-serif;color:#5E5A73}
body{background:linear-gradient(180deg,#FFFFFF 0%,#FEF6F5 45%,#F8B9B6 135%);display:flex;justify-content:center}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;background:#FBD9D6;opacity:.55}
.wrap{position:relative;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 14px 12px;gap:8px}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:34px}
.brand{font-family:Rubik,sans-serif;font-weight:700;font-size:13px;color:#5F8DB5;border-bottom:3px solid #EF406E;padding-bottom:2px}
.ico{width:36px;height:36px;border-radius:12px;border:0;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08),0 0 0 2px #FDE1EA;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ico svg{width:20px;height:20px}
.icos{display:flex;gap:8px}
h1{margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:22px;line-height:1.15;text-align:center;color:#5E5A73}
h1 b{color:#EF406E;font-weight:900}
.btn{display:block;margin:0 auto;border:0;border-radius:18px;padding:13px 26px;font-family:Rubik,sans-serif;font-weight:800;font-size:19px;color:#fff;background:#EF406E;box-shadow:0 4px 0 #D14175;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D14175}
.btn.mint{background:#4FB38C;box-shadow:0 4px 0 #3A8F70}
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(254,246,245,.94);text-align:center}
.card{background:#fff;border-radius:26px;padding:20px 18px;box-shadow:0 8px 24px rgba(239,64,110,.14),0 0 0 3px #FDE1EA;max-width:420px;width:100%}
.card h2{margin:6px 0 10px;font-family:Rubik,sans-serif;font-weight:800;font-size:22px;color:#B8236B}
.card p{margin:0 0 14px;font-size:18px;line-height:1.5;font-weight:700}
.card .pic{width:120px;height:120px;margin:0 auto}
.card .pic svg{width:100%;height:100%}
.spk{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.08),0 0 0 3px #B7CDE0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;vertical-align:middle}
.spk svg{width:22px;height:22px}
.spk:active{transform:translateY(2px)}
.spk.on{box-shadow:0 0 0 3px #EF406E}
.say-row{display:flex;align-items:center;justify-content:center;gap:10px}
.hidden{display:none!important}
.conf{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.dots{display:flex;gap:6px;justify-content:center;flex:0 0 auto;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:#FBD9D6}
.dots i.on{background:#EF406E}
.qcard{width:100%;background:#fff;border-radius:24px;padding:14px;box-shadow:0 0 0 3px #FDE1EA;text-align:center;flex:0 0 auto}
.qcard .pic{width:90px;height:90px;margin:0 auto 6px}
.qcard .pic svg{width:100%;height:100%}
.qcard .qrow{display:flex;align-items:center;justify-content:center;gap:12px}
.qcard .qtext{font-family:Rubik,sans-serif;font-weight:800;font-size:23px;color:#B8236B;line-height:1.35}
.opts{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:10px}
.o.oart{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;min-height:0}
.o.oart svg{width:62%;max-height:70%;height:auto}
.o.oart span{font-size:19px}
.o{border:0;border-radius:22px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.07),0 0 0 3px #FDE1EA;padding:14px 12px;font-family:Rubik,sans-serif;font-weight:700;font-size:21px;color:#5E5A73;cursor:pointer;line-height:1.3}
.o:active{transform:translateY(3px)}
.o.ok{box-shadow:0 0 0 5px #4FB38C,0 0 20px rgba(79,179,140,.5);animation:pop .5s}
.o.no{animation:shake .4s;opacity:.55}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.big-play{width:110px;height:110px;border-radius:50%;border:0;background:#EF406E;box-shadow:0 7px 0 #D14175;display:flex;align-items:center;justify-content:center;margin:12px auto 0;cursor:pointer}
.big-play svg{width:52px;height:52px}
</style>

var $=function(i){return document.getElementById(i)};
window.wireTop();
$('startpic').innerHTML=D.arts.hero;$('endpic').innerHTML=D.arts.hero;
var idx=0,locked=false,order=[];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function render(){
  var q=D.questions[order[idx]];
  var dots='';for(var i=0;i<order.length;i++)dots+='<i class="'+(i<=idx?'on':'')+'"></i>';$('dots').innerHTML=dots;
  $('qtext').textContent=q.q;$('qspk').setAttribute('data-say',q.q);
  $('qpic').innerHTML=q.art&&D.arts[q.art]?D.arts[q.art]:'';$('qpic').style.display=q.art&&D.arts[q.art]?'':'none';
  var hasArt=q.options.some(function(o){return o&&typeof o==='object'&&o.art});
  var opts=q.options.map(function(t,i){return {t:t,ok:i===q.answer}});opts=shuffle(opts);
  $('opts').className='opts noscroll'+(hasArt?' grid':'');
  $('opts').innerHTML=opts.map(function(o){
    var t=o.t;
    if(t&&typeof t==='object'){return '<button class="o oart" data-ok="'+(o.ok?1:0)+'">'+(D.arts[t.art]||'')+(t.t?'<span>'+t.t+'</span>':'')+'</button>'}
    return '<button class="o" data-ok="'+(o.ok?1:0)+'">'+t+'</button>';
  }).join('');
  var bs=$('opts').querySelectorAll('.o');
  for(var k=0;k<bs.length;k++)(function(b){var h=function(){pick(b)};b.addEventListener('click',h)})(bs[k]);
  locked=false;
}
function pick(b){
  if(locked)return;
  if(b.getAttribute('data-ok')==='1'){
    locked=true;b.classList.add('ok');window.SFX.ok();window.confetti(26);
    setTimeout(function(){idx++;if(idx>=order.length)finish();else render()},1300);
  } else {b.classList.add('no');window.SFX.bad()}
}
function finish(){$('end').classList.remove('hidden');window.SFX.fan();window.SFX.cheer();window.confetti(260);setTimeout(function(){window.confetti(160)},700)}
function start(){order=shuffle(D.questions.map(function(_,i){return i}));idx=0;$('end').classList.add('hidden');$('start').classList.add('hidden');render()}
$('go').addEventListener('click',start);$('again').addEventListener('click',start);
