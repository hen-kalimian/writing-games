    place(sel);done[sel]=1;nDone++;window.SFX.ok();window.confetti(22);sel=-1;paintChips();
    if(nDone>=D.cities.length)setTimeout(function(){$('end').classList.remove('hidden');window.SFX.fan();window.SFX.cheer();window.confetti(260);setTimeout(function(){window.confetti(160)},700)},700);
  } else {window.SFX.bad();$('map').classList.remove('shake');void $('map').getBoundingClientRect();$('map').classList.add('shake')}
});
function start(){sel=-1;done={};nDone=0;$('pins').innerHTML='';$('end').classList.add('hidden');$('start').classList.add('hidden');chips()}
$('go').addEventListener('click',start);$('again').addEventListener('click',start);
</script>
