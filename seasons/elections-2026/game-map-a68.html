var $=function(i){return document.getElementById(i)};
window.wireTop();
$('startpic').innerHTML=D.hero;$('endpic').innerHTML=D.hero;
var sel=-1,done={},nDone=0;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function chips(){
  var order=shuffle(D.cities.map(function(_,i){return i}));
  $('chips').innerHTML=order.map(function(i){return '<button class="chip'+(done[i]?' done':'')+(sel===i?' sel':'')+'" data-i="'+i+'">'+D.cities[i].name+'</button>'}).join('');
  var bs=$('chips').querySelectorAll('.chip');
  for(var k=0;k<bs.length;k++)(function(b){b.addEventListener('click',function(){var i=+b.getAttribute('data-i');if(done[i])return;sel=i;window.sayForce(D.cities[i].name);paintChips()})})(bs[k]);
}
function paintChips(){var bs=$('chips').querySelectorAll('.chip');for(var k=0;k<bs.length;k++){var i=+bs[k].getAttribute('data-i');bs[k].className='chip'+(done[i]?' done':'')+(sel===i?' sel':'')}}
function place(i){
  var c=D.cities[i];
  var g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.innerHTML='<circle cx="'+c.xy[0]+'" cy="'+c.xy[1]+'" r="7" fill="#EF406E" stroke="#fff" stroke-width="3"/><text x="'+c.xy[0]+'" y="'+(c.xy[1]-12)+'" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="800" font-size="15" fill="#5E5A73" stroke="#fff" stroke-width="3" paint-order="stroke">'+c.name+'</text>';
  $('pins').appendChild(g);
}
$('map').addEventListener('click',function(e){
  if(sel<0)return;
  var r=$('map').getBoundingClientRect(),vb=$('map').viewBox.baseVal;
  var x=(e.clientX-r.left)/r.width*vb.width,y=(e.clientY-r.top)/r.height*vb.height;
  var c=D.cities[sel],dx=x-c.xy[0],dy=y-c.xy[1];
  if(Math.sqrt(dx*dx+dy*dy)<=D.tol){
    place(sel);done[sel]=1;nDone++;window.SFX.ok();window.confetti(22);sel=-1;paintChips();
    if(nDone>=D.cities.length)setTimeout(function(){$('end').classList.remove('hidden');window.SFX.fan();window.SFX.cheer();window.confetti(260);setTimeout(function(){window.confetti(160)},700)},700);
  } else {window.SFX.bad();$('map').classList.remove('shake');void $('map').getBoundingClientRect();$('map').classList.add('shake')}
});
function start(){sel=-1;done={};nDone=0;$('pins').innerHTML='';$('end').classList.add('hidden');$('start').classList.add('hidden');chips()}
$('go').addEventListener('click',start);$('again').addEventListener('click',start);
</script>
