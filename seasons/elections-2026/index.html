<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>בחירות ומדינת ישראל</title><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&family=Open+Sans:wght@500;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(180deg,#fff 0%,#FEF6F5 40%,#F8B9B6 160%) fixed;font-family:'Open Sans',Arial,sans-serif;color:#5E5A73}
body{padding:0 16px 40px}
.wrap{max-width:560px;margin:0 auto}
.brand{display:inline-block;margin:16px 0 4px;font-family:Rubik,sans-serif;font-weight:700;font-size:13px;color:#5F8DB5;border-bottom:3px solid #EF406E;padding-bottom:2px}
h1{font-family:Rubik,sans-serif;font-weight:900;font-size:30px;color:#B8236B;text-align:center;margin:6px 0 4px}
.sub{text-align:center;font-size:16px;line-height:1.55;margin:0 0 18px;font-weight:600}
.card{background:#fff;border-radius:28px;padding:16px;margin:0 0 34px;box-shadow:0 8px 24px rgba(239,64,110,.12),0 0 0 4px #FDE1EA}
.card h2{font-family:Rubik,sans-serif;font-weight:800;font-size:22px;color:#5E5A73;margin:0 0 4px;text-align:center}
.card .hint{text-align:center;font-size:14px;margin:0 0 12px;color:#7A7690}
.tag{display:block;width:fit-content;margin:0 auto 8px;background:#FDE1EA;color:#B8236B;border-radius:14px;padding:3px 14px;font-family:Rubik,sans-serif;font-weight:800;font-size:13px}
.btn{display:block;width:fit-content;margin:12px auto 0;border:0;border-radius:18px;padding:12px 26px;font-family:Rubik,sans-serif;font-weight:800;font-size:18px;color:#fff;background:#EF406E;box-shadow:0 4px 0 #D14175;text-decoration:none;text-align:center}
.btn.mint{background:#4FB38C;box-shadow:0 4px 0 #3A8F70}
.btn.blue{background:#5F8DB5;box-shadow:0 4px 0 #46698A}
.preview{display:block;width:100%;border-radius:14px;box-shadow:0 0 0 2px #FDE1EA;background:#fff}
.frame{display:block;width:100%;border:0;border-radius:18px;background:#fff}
.f-game{aspect-ratio:4/5}
.f-run{aspect-ratio:8/6.6}
.f-color{aspect-ratio:4/5.4}
.f-video{aspect-ratio:16/9}
.soon{text-align:center;padding:30px 10px;font-weight:700;color:#7A7690}
.hero{display:flex;gap:10px;justify-content:center;margin:6px 0 4px}
.agebtn{display:flex;align-items:center;gap:14px;text-decoration:none;color:#5E5A73;background:#fff;border-radius:26px;padding:16px;margin:0 0 16px;box-shadow:0 8px 24px rgba(239,64,110,.12),0 0 0 4px var(--c)}
.agebtn .b{flex:1}
.agebtn b{display:block;font-family:Rubik,sans-serif;font-weight:900;font-size:24px;color:var(--c)}
.agebtn span{font-size:15px;line-height:1.4;font-weight:600}
.agebtn svg{flex:0 0 66px}
.back{display:block;text-align:center;margin:0 0 18px;font-weight:700;font-size:14px;color:#5F8DB5}
</style></head><body><div class="wrap">

<h1>בחירות ומדינת ישראל</h1>
<p class="sub">בקרוב בחירות, ובגנים ובבתי הספר מדברים על המדינה שלנו, על הדגל ועל זה שכל אחד בוחר ומצביע. הכנתי לכן חבילה פשוטה על המדינה שלנו, הדגל וזכות ההצבעה, לכל גיל.</p>
