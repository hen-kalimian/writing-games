<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Open Sans',Arial,sans-serif;color:#5E5A73}
body{background:linear-gradient(180deg,#FFFFFF 0%,#FEF6F5 45%,#F8B9B6 135%);display:flex;justify-content:center}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;background:#FBD9D6;opacity:.55}
.wrap{position:relative;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 14px 12px;gap:8px}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:34px}
.brand{font-family:Rubik,sans-serif;font-weight:700;font-size:13px;color:#5F8DB5;border-bottom:3px solid #EF406E;padding-bottom:2px}
.ico{width:36px;height:36px;border-radius:12px;border:0;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08),0 0 0 2px #FDE1EA;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ico svg{width:20px;height:20px}
.icos{display:flex;gap:8px}
h1{margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:22px;line-height:1.15;text-align:center;color:#5E5A73}
h1 b{color:#EF406E;font-weight:900}
.btn{display:block;margin:0 auto;border:0;border-radius:18px;padding:13px 26px;font-family:Rubik,sans-serif;font-weight:800;font-size:19px;color:#fff;background:#EF406E;box-shadow:0 4px 0 #D14175;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D14175}
.btn.mint{background:#4FB38C;box-shadow:0 4px 0 #3A8F70}
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(254,246,245,.94);text-align:center}
.card{background:#fff;border-radius:26px;padding:20px 18px;box-shadow:0 8px 24px rgba(239,64,110,.14),0 0 0 3px #FDE1EA;max-width:420px;width:100%}
.card h2{margin:6px 0 10px;font-family:Rubik,sans-serif;font-weight:800;font-size:22px;color:#B8236B}
.card p{margin:0 0 14px;font-size:18px;line-height:1.5;font-weight:700}
.card .pic{width:120px;height:120px;margin:0 auto}
.card .pic svg{width:100%;height:100%}
.spk{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.08),0 0 0 3px #B7CDE0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;vertical-align:middle}
.spk svg{width:22px;height:22px}
.spk:active{transform:translateY(2px)}
.spk.on{box-shadow:0 0 0 3px #EF406E}
.say-row{display:flex;align-items:center;justify-content:center;gap:10px}
.hidden{display:none!important}
.conf{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hud{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;font-family:Rubik,sans-serif;font-weight:800;font-size:17px;color:#B8236B}
.hud .it{display:flex;align-items:center;gap:6px}
.hud .it svg{width:26px;height:26px}
#board{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
#cv{border-radius:22px;background:#FFFDF8;box-shadow:0 0 0 4px #FDE1EA,0 8px 22px rgba(239,64,110,.12);touch-action:none}
.pad{direction:ltr;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:5px;justify-content:center;flex:0 0 auto}
.pad button{border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08),0 0 0 3px #FDE1EA;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.pad button:active{transform:translateY(3px)}
.pad svg{width:22px;height:22px}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.how{font-size:15px!important;color:#5F8DB5;font-weight:700}
.card .pic.row{display:flex;gap:10px;justify-content:center;width:auto;height:90px}
.card .pic.row svg{width:90px;height:90px}
</style>
</head>

 </div>
 <div class="overlay" id="intro"><div class="card"><div class="pic row" id="introPic"></div><h2>מְחַפְּשִׂים אֶת הַמַּצָּה</h2><p>עוֹזְרִים לַיּוֹנָה לִמְצֹא אֶת כֹּל חֲתִיכוֹת הַמַּצָּה <button class="spk" type="button" data-say="עוֹזְרִים לַיּוֹנָה לִמְצֹא אֶת כֹּל חֲתִיכוֹת הַמַּצָּה" aria-label="להשמיע"><svg viewBox="0 0 24 24" fill="none" stroke="#5F8DB5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#B7CDE0"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button></p><p class="how">מַחְלִיקִים אֶת הָאֶצְבַּע עַל הַמָּבוֹךְ, אוֹ לוֹחֲצִים עַל הַחִצִּים</p><button class="btn" id="go">מַתְחִילִים</button></div></div>

כָּל הַכָּבוֹד! מָצָאתֶם אֶת כֹּל חֲתִיכוֹת הַמַּצָּה","levelWord":"שָׁלָב"};
var $=function(i){return document.getElementById(i)};
window.wireTop();
$('introPic').innerHTML=D.arts.player+D.arts.item;
$('ico').innerHTML=D.arts.item;$('ico').firstChild.setAttribute('width','26');
var cv=$('cv'),cx=cv.getContext('2d');
var L=0,cols,rows,cell,grid,items,left,pl,clouds,tick=0,anim=null,running=false,startCell;
var imgs={};
function loadImg(key,svg){return new Promise(function(res){var im=new Image();im.onload=function(){imgs[key]=im;res()};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg width="100" height="100" '))})}
Promise.all([loadImg('player',D.arts.player),loadImg('item',D.arts.item),loadImg('enemy',D.arts.enemy)]).then(function(){ready=true});
var ready=false;
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
function genMaze(c,r){
  var g=[];for(var y=0;y<r;y++){g[y]=[];for(var x=0;x<c;x++)g[y][x]={n:1,e:1,s:1,w:1,v:0}}
  var st=[[0,0]];g[0][0].v=1;
  while(st.length){var p=st[st.length-1],x=p[0],y=p[1],nb=[];
   if(y>0&&!g[y-1][x].v)nb.push([x,y-1,'n','s']);
   if(x<c-1&&!g[y][x+1].v)nb.push([x+1,y,'e','w']);
   if(y<r-1&&!g[y+1][x].v)nb.push([x,y+1,'s','n']);
   if(x>0&&!g[y][x-1].v)nb.push([x-1,y,'w','e']);
   if(!nb.length){st.pop();continue}
   var q=nb[Math.floor(rnd()*nb.length)];g[y][x][q[2]]=0;g[q[1]][q[0]][q[3]]=0;g[q[1]][q[0]].v=1;st.push([q[0],q[1]]);
  }
  // remove some extra walls to create loops (pacman feel)
  var extra=Math.floor(c*r*.18);
  for(var k=0;k<extra;k++){var xx=Math.floor(rnd()*(c-1)),yy=Math.floor(rnd()*(r-1));
   if(rnd()<.5){g[yy][xx].e=0;g[yy][xx+1].w=0}else{g[yy][xx].s=0;g[yy+1][xx].n=0}}
  return g;
}
function size(){
  var b=$('board').getBoundingClientRect();var w=b.width,h=b.height;
  cell=Math.floor(Math.min(w/cols,h/rows));if(cell<10)cell=10;
  cv.width=cell*cols;cv.height=cell*rows;cv.style.width=cv.width+'px';cv.style.height=cv.height+'px';
}
function setLevel(n){
  L=n;var lv=D.levels[L];cols=lv.cols;rows=lv.rows;seed=11+L*37+Math.floor(Math.random()*50);
  grid=genMaze(cols,rows);items={};left=0;
  var want=8+L*3,tries=0;while(left<want&&tries<500){tries++;var ix=Math.floor(rnd()*cols),iy=Math.floor(rnd()*rows);if(ix+iy<2||items[ix+','+iy])continue;items[ix+','+iy]=1;left++}
  pl={x:0,y:0,px:0,py:0,f:1};startCell=[0,0];
  clouds=[];var spots=[[cols-1,rows-1],[cols-1,0],[0,rows-1]];
  for(var i=0;i<lv.clouds;i++){var s=spots[i];clouds.push({x:s[0],y:s[1],px:s[0],py:s[1]})}
  $('lvl').textContent=D.levelWord+' '+(L+1);$('cnt').textContent=left;
  size();running=true;draw();
}
function can(x,y,dx,dy){var c=grid[y][x];if(dx===1)return !c.e;if(dx===-1)return !c.w;if(dy===1)return !c.s;if(dy===-1)return !c.n;return false}
function move(dx,dy){
  if(!running||!ready)return;
  if(!can(pl.x,pl.y,dx,dy))return;
  pl.x+=dx;pl.y+=dy;if(dx)pl.f=dx;window.SFX.step();
  var k=pl.x+','+pl.y;if(items[k]){delete items[k];left--;$('cnt').textContent=left;window.SFX.pop()}
  if(left===0)win();else hitCheck();
}
function hitCheck(){for(var i=0;i<clouds.length;i++){if(clouds[i].x===pl.x&&clouds[i].y===pl.y){window.SFX.bad();pl.x=0;pl.y=0;pl.px=0;pl.py=0;flash=12;return true}}return false}
var flash=0;
function cloudStep(){
  clouds.forEach(function(c){
    var opts=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){if(can(c.x,c.y,d[0],d[1]))opts.push(d)});
    // lean toward player
    opts.sort(function(a,b){return (Math.abs(c.x+a[0]-pl.x)+Math.abs(c.y+a[1]-pl.y))-(Math.abs(c.x+b[0]-pl.x)+Math.abs(c.y+b[1]-pl.y))});
    var d=Math.random()<.55?opts[0]:opts[Math.floor(Math.random()*opts.length)];
    if(d){c.x+=d[0];c.y+=d[1]}
  });
  hitCheck();
}
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.fillStyle='#FFFDF8';cx.fillRect(0,0,cv.width,cv.height);
  // floor tiles soft
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){cx.fillStyle=((x+y)%2)?'#FEF6F5':'#FFFFFF';cx.fillRect(x*cell,y*cell,cell,cell)}
  cx.strokeStyle='#8FD3B6';cx.lineWidth=Math.max(4,cell*.12);cx.lineCap='round';
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){var c=grid[y][x],X=x*cell,Y=y*cell;
    cx.beginPath();
    if(c.n){cx.moveTo(X,Y);cx.lineTo(X+cell,Y)}
    if(c.w){cx.moveTo(X,Y);cx.lineTo(X,Y+cell)}
    if(y===rows-1&&c.s){cx.moveTo(X,Y+cell);cx.lineTo(X+cell,Y+cell)}
    if(x===cols-1&&c.e){cx.moveTo(X+cell,Y);cx.lineTo(X+cell,Y+cell)}
    if(!(y===rows-1)&&c.s){cx.moveTo(X,Y+cell);cx.lineTo(X+cell,Y+cell)}
    if(!(x===cols-1)&&c.e){cx.moveTo(X+cell,Y);cx.lineTo(X+cell,Y+cell)}
    cx.stroke();
  }
  var s=cell*.9;
  for(var k in items){var p=k.split(',');cx.drawImage(imgs.item,p[0]*cell+(cell-s*.7)/2,p[1]*cell+(cell-s*.7)/2,s*.7,s*.7)}
  clouds.forEach(function(c){c.px+=(c.x-c.px)*.25;c.py+=(c.y-c.py)*.25;cx.drawImage(imgs.enemy,c.px*cell+cell*.1,c.py*cell+cell*.1,cell*.8,cell*.8)});
  pl.px+=(pl.x-pl.px)*.35;pl.py+=(pl.y-pl.py)*.35;
  if(flash>0){flash--;if(flash%2)cx.globalAlpha=.35}
  cx.save();if(pl.f<0){cx.translate(pl.px*cell+cell*.94,pl.py*cell+cell*.06);cx.scale(-1,1);cx.drawImage(imgs.player,0,0,cell*.88,cell*.88)}else{cx.drawImage(imgs.player,pl.px*cell+cell*.06,pl.py*cell+cell*.06,cell*.88,cell*.88)}cx.restore();cx.globalAlpha=1;
}
function loop(){tick++;if(running&&tick%42===0&&clouds.length)cloudStep();if(ready&&grid)draw();anim=requestAnimationFrame(loop)}
function win(){
  running=false;window.SFX.win();window.confetti(80);
  var lv=D.levels[L],last=(L===D.levels.length-1);
  $('factPic').innerHTML=D.arts[lv.art];$('factTitle').textContent=last?D.done:D.levelWord+' '+(L+1);$('factText').textContent=lv.fact;$('factSpk').setAttribute('data-say',lv.fact);
  $('nextBtn').textContent=last?D.again:D.next;
  $('fact').classList.remove('hidden');
}
$('nextBtn').addEventListener('click',function(){$('fact').classList.add('hidden');setLevel((L+1)%D.levels.length)});
$('go').addEventListener('click',function(){$('intro').classList.add('hidden');setLevel(0)});
// controls
var btns=document.querySelectorAll('.pad button');
for(var i=0;i<btns.length;i++)(function(b){var d=b.getAttribute('data-d').split(',');b.addEventListener('click',function(){move(+d[0],+d[1])})})(btns[i]);
document.addEventListener('keydown',function(e){var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();move(m[0],m[1])}});
var sx=0,sy=0,sw=false;
function sstart(x,y){sx=x;sy=y;sw=true}
function smove(x,y){if(!sw)return;var dx=x-sx,dy=y-sy,t=Math.max(14,cell*.45);
 if(Math.abs(dx)>t||Math.abs(dy)>t){if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);sx=x;sy=y}}
$('board').addEventListener('touchstart',function(e){var t=e.touches[0];sstart(t.clientX,t.clientY)},{passive:true});
$('board').addEventListener('touchmove',function(e){var t=e.touches[0];smove(t.clientX,t.clientY);e.preventDefault()},{passive:false});
$('board').addEventListener('touchend',function(){sw=false});
$('board').addEventListener('mousedown',function(e){sstart(e.clientX,e.clientY)});
window.addEventListener('mousemove',function(e){smove(e.clientX,e.clientY)});
window.addEventListener('mouseup',function(){sw=false});
window.addEventListener('resize',function(){if(grid){size()}});
