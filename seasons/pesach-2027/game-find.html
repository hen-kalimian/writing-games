  var r=D.rounds[order[idx]];var cards=[];
  var dots='';for(var i=0;i<order.length;i++)dots+='<i class="'+(i<=idx?'on':'')+'"></i>';$('dots').innerHTML=dots;
  $('qtext').textContent=r.say;$('qspk').setAttribute('data-say',r.say);
  if(r.kind==='big'||r.kind==='small'){
    var a=D.arts[r.art];
    cards=['<button class="opt big" data-ok="'+(r.kind==='big'?1:0)+'">'+a+'</button>','<button class="opt small" data-ok="'+(r.kind==='small'?1:0)+'">'+a+'</button>'];
  } else if(r.kind==='pick'){
    cards=['<button class="opt one" data-ok="1">'+D.arts[r.art]+'</button>'];
    r.others.forEach(function(o){cards.push('<button class="opt one" data-ok="0">'+D.arts[o]+'</button>')});
  } else if(r.kind==='size3'){
    var a3=D.arts[r.art];var sz=[['big',1],['mid',0],['small',0]];
    cards=sz.map(function(x){var ok=(r.which==='big'&&x[0]==='big')||(r.which==='small'&&x[0]==='small');return '<button class="opt s3 '+x[0]+'" data-ok="'+(ok?1:0)+'">'+a3+'</button>'});
  } else if(r.kind==='odd'){
    var items=[1,1,1,0];items.sort(function(){return Math.random()-.5});
    $('stage').innerHTML='<div class="grid4">'+items.map(function(v){return '<button class="opt one" data-ok="'+(v?0:1)+'">'+D.arts[v?r.art:r.other]+'</button>'}).join('')+'</div>';
    wire();locked=false;return;
  } else if(r.kind==='color'){
    cards=['<button class="opt one" data-ok="1">'+D.arts[r.art]+'</button>','<button class="opt one" data-ok="0">'+D.arts[r.other]+'</button>'];
  } else {
    var many=r.want>1,wn=Math.min(5,Math.max(3,r.want||3));
    cards=['<button class="opt '+(many?'':'one')+'" data-ok="1">'+rep(r.art,many?wn:1)+'</button>','<button class="opt '+(many?'one':'')+'" data-ok="0">'+rep(r.art,many?1:wn)+'</button>'];
  }
  if(Math.random()<.5)cards.reverse();
  $('stage').innerHTML=cards.join('');
  wire();
  locked=false;
}
function wire(){var bs=$('stage').querySelectorAll('.opt');for(var k=0;k<bs.length;k++)(function(b){b.addEventListener('click',function(){pick(b)})})(bs[k])}
function pick(b){
  if(locked)return;
  if(b.getAttribute('data-ok')==='1'){
    locked=true;b.classList.add('ok');window.SFX.ok();solved++;
    window.confetti(26);
    setTimeout(function(){idx++;if(idx>=order.length)finish();else render()},1400);
  } else {
    b.classList.add('no');window.SFX.bad();setTimeout(function(){b.classList.remove('no')},450);
  }
}
function finish(){$('end').classList.remove('hidden');window.SFX.fan();window.SFX.cheer();window.confetti(260);setTimeout(function(){window.confetti(160)},700)}
function start(){order=shuffle(D.rounds.map(function(_,i){return i}));idx=0;solved=0;$('end').classList.add('hidden');$('start').classList.add('hidden');render()}
$('go').addEventListener('click',start);
$('again').addEventListener('click',start);
</script>
