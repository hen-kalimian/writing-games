<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>כותבים אות צ | חן קלימיאן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --mint-bg:#F0FAF5;
  --blue-bg:#F1F6FB;
  --mint:#8FD3B6;
  --mint-deep:#4FB38C;
  --blue:#B7CDE0;
  --blue-deep:#5F8DB5;
  --pink:#EF406E;
  --gold:#D9A441;
  --ink:#2E3A45;
  --muted:#7A8793;
  --line:#CFE0EC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'Open Sans',system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 12%, var(--mint-bg) 0 140px, transparent 141px),
    radial-gradient(circle at 94% 88%, var(--blue-bg) 0 170px, transparent 171px),
    var(--bg);
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:14px;
  -webkit-user-select:none;user-select:none;
}
.card{
  position:relative;
  width:100%;
  max-width:460px;
  background:#fff;
  border:2.5px solid var(--blue);
  border-radius:30px 36px 32px 38px / 36px 30px 38px 32px;
  padding:18px 18px 20px;
  box-shadow:0 10px 30px rgba(95,141,181,.12);
  overflow:hidden;
}
.card.wide{max-width:720px}
.brand{
  display:flex;justify-content:flex-end; /* בעברית זה הצד השמאלי */
  font-family:'Rubik',sans-serif;font-weight:600;font-size:14.5px;color:var(--blue-deep);
  letter-spacing:.2px;
}
.brand .name{position:relative;padding-bottom:4px;direction:rtl}
.brand .name::after{ /* קו תחתון ורוד דק: התבלין היחיד */
  content:"";position:absolute;right:0;bottom:0;width:100%;height:2.5px;border-radius:3px;background:var(--pink);
  transform:rotate(-.6deg);
}
.title{text-align:center;margin:12px 0 2px;font-family:'Rubik',sans-serif;font-weight:700;font-size:25px;line-height:1.2}
.title .hl{color:var(--blue-deep)}
.sub{text-align:center;margin:0 0 10px;font-size:14.5px;color:var(--muted)}

/* Safari/אייפד: touch-action חייב להיות על אלמנט HTML עוטף כדי שגרירה למטה לא תגלול את הדף */
.boardbox{touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none}
svg.board{
  display:block;width:100%;height:auto;
  background:var(--mint-bg);
  border-radius:26px 30px 28px 32px / 30px 26px 32px 28px;
  touch-action:none;cursor:pointer;
}
.guide-line{stroke:var(--line);stroke-width:2;stroke-dasharray:4 8;stroke-linecap:round}
.bed{fill:none;stroke:#DCEBE4;stroke-width:42;stroke-linecap:round;stroke-linejoin:round}
.dash{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 11}
.prog{fill:none;stroke-width:36;stroke-linecap:round;stroke-linejoin:round}
.arrow{fill:none;stroke:#6C98BF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s}
.arrow.off{opacity:0}
.marker .dot{stroke:#fff;stroke-width:3}
.marker text{font-family:'Rubik',sans-serif;font-weight:700;font-size:17px;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.marker.future .dot{fill:var(--blue)}
.marker.now .dot{fill:var(--pink)}
.marker.done{opacity:0;transition:opacity .3s}
.marker .ring{fill:none;stroke:var(--pink);stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center}
.marker.now .ring{animation:pulse 1.6s ease-out infinite}
.marker.drag .ring{animation:none;opacity:0}
@keyframes pulse{0%{transform:scale(.9);opacity:.8}100%{transform:scale(2.1);opacity:0}}
.shake{animation:shake .38s}
@keyframes shake{20%{translate:-5px 0}40%{translate:5px 0}60%{translate:-3px 0}80%{translate:3px 0}}
.demo-dot{fill:var(--gold);stroke:#fff;stroke-width:4;opacity:0}
.demo-trail{fill:none;stroke-width:6;stroke-linecap:round;opacity:.55}
.spark{fill:var(--gold);transform-box:fill-box;transform-origin:center;opacity:0}
.spark.go{animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:scale(.2) rotate(0)}30%{opacity:.9;transform:scale(1.1) rotate(40deg)}100%{opacity:0;transform:scale(1.4) rotate(90deg)}}

.btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
button{
  font-family:'Rubik',sans-serif;font-weight:500;font-size:15px;
  padding:10px 20px;border-radius:999px;cursor:pointer;
  border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue-deep);
  transition:transform .15s, background .2s;
}
button:hover{background:#E6F0F8}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
button.again{border-color:var(--mint-deep);background:var(--mint-bg);color:var(--mint-deep)}
.hidden{display:none!important}

.confetti{position:absolute;pointer-events:none;top:-18px;opacity:0;animation:fall linear forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateY(560px) rotate(260deg)}}

@media (prefers-reduced-motion:reduce){
  .marker.now .ring,.spark.go,.confetti{animation:none}
}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand"><span class="name" id="series"></span></div>
  <h1 class="title" id="title"></h1>
  <p class="sub">עוקבים עם האצבע אחרי הקו, לפי המספרים</p>

  <div class="boardbox" id="boardbox">
  <svg class="board" id="board" role="img" aria-label="לוח כתיבה">
    <g id="guides"></g>
    <g id="layers"></g>
    <g id="markers"></g>
    <g id="demo-layer">
      <path class="demo-trail" id="demo-trail" d=""/>
      <circle class="demo-dot" id="demo-dot" r="12" cx="0" cy="0"/>
    </g>
    <path class="spark" id="spark" d=""/>
  </svg>
  </div>

  <div class="btns">
    <button id="btn-demo" type="button">הראי לי איך</button>
    <button id="btn-reset" type="button">מתחילים מחדש</button>
    <button id="btn-again" type="button" class="again hidden">עוד פעם</button>
  </div>
</main>

const COLORS = ['#4FB38C', '#5F8DB5', '#D9A441', '#8E7CC3'];
const UNI = '#4FB38C';   /* בסיום כל האות בצבע אחיד */
const TOL = 30, START_TOL = 44, N = 40, H = 300;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('board');
const layers = document.getElementById('layers');
const markers = document.getElementById('markers');
const card = document.getElementById('card');

document.getElementById('series').textContent = CFG.series;
document.getElementById('title').innerHTML = CFG.titleHtml;
svg.setAttribute('viewBox', '0 0 ' + CFG.viewW + ' ' + H);
svg.style.aspectRatio = CFG.viewW + ' / ' + H;
if (CFG.viewW > 400) card.classList.add('wide');
document.getElementById('spark').setAttribute('d', CFG.sparkD);
(function guides(){
  const g = document.getElementById('guides');
  (CFG.guides || [40, 260]).forEach(y => {
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('class', 'guide-line');
    l.setAttribute('x1', 18); l.setAttribute('x2', CFG.viewW - 18);
    l.setAttribute('y1', y); l.setAttribute('y2', y);
    g.appendChild(l);
  });
})();

let S = [];
let cur = 0, idx = 0, drawing = false, busy = false, idleTimer = null;

function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function chevron(path, L, len, g){
  const p = path.getPointAtLength(len), q = path.getPointAtLength(len - 8);
  const a = Math.atan2(p.y - q.y, p.x - q.x), w = 0.62, s = 12;
  const x1 = p.x - s * Math.cos(a - w), y1 = p.y - s * Math.sin(a - w);
  const x2 = p.x - s * Math.cos(a + w), y2 = p.y - s * Math.sin(a + w);
  return el('path', { class: 'arrow', d: 'M ' + x1 + ' ' + y1 + ' L ' + p.x + ' ' + p.y + ' L ' + x2 + ' ' + y2 }, g);
}

function build(){
  layers.innerHTML = ''; markers.innerHTML = ''; S = [];
  CFG.strokes.forEach((st, i) => {
    const g = el('g', {}, layers);
    const color = COLORS[(st.num - 1) % COLORS.length];
    const bed = el('path', { d: st.d, class: 'bed' }, g);
    el('path', { d: st.d, class: 'dash' }, g);
    const prog = el('path', { d: st.d, class: 'prog', stroke: color }, g);
    const L = bed.getTotalLength();
    prog.style.strokeDasharray = L;
    prog.style.strokeDashoffset = L;
    prog.style.strokeOpacity = 0;
    const cps = [];
    for (let k = 0; k < N; k++) cps.push(bed.getPointAtLength(L * k / (N - 1)));
    const arrows = L > 130 ? [chevron(bed, L, L * 0.55, g), chevron(bed, L, L - 12, g)] : [chevron(bed, L, L - 10, g)];
    const mk = el('g', { class: 'marker future' }, markers);
    el('circle', { class: 'ring', r: 15, cx: cps[0].x, cy: cps[0].y }, mk);
    el('circle', { class: 'dot', r: 15, cx: cps[0].x, cy: cps[0].y }, mk);
    const t = el('text', { x: cps[0].x, y: cps[0].y + 1 }, mk);
    t.textContent = st.num;
    S.push({ L, cps, prog, mk, arrows, color, g, bed, num: st.num });
  });
  cur = 0; idx = 0; drawing = false;
  refresh();
}

function refresh(){
  if (S[cur]) markers.appendChild(S[cur].mk);   /* העיגול הנוכחי תמיד למעלה */
  S.forEach((s, i) => {
    s.mk.setAttribute('class', 'marker ' + (i < cur ? 'done' : i === cur ? 'now' : 'future'));
    s.arrows.forEach(a => a.classList.toggle('off', i < cur));
  });
}

function toBoard(e){
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function setProg(s, k, smooth){
  const len = s.L * k / (N - 1);
  const tr = smooth ? '.45s ease' : '.06s linear';
  s.prog.style.transition = 'stroke-dashoffset ' + tr;
  s.prog.style.strokeDashoffset = s.L - len;
  s.prog.style.strokeOpacity = k > 0 || smooth ? 1 : 0;
  /* העיגול עם המספר זז יחד עם האצבע */
  const pt = s.cps[k];
  s.mk.style.transition = 'transform ' + tr + ', opacity .3s';
  s.mk.style.transform = 'translate(' + (pt.x - s.cps[0].x) + 'px,' + (pt.y - s.cps[0].y) + 'px)';
}

/* מניעת גלילה של הדף בזמן כתיבה (iOS ו-WebView שלא מכבדים touch-action) */
const boardbox = document.getElementById('boardbox');
['touchstart', 'touchmove'].forEach(ev => boardbox.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));

/* ---------- צליל: המספר נאמר בקול נשי רגיל כשנוגעים בעיגול ---------- */
const AU = {};
if (CFG.audio) for (const k in CFG.audio){ const a = new Audio(CFG.audio[k]); a.preload = 'auto'; AU[k] = a; }
let curAudio = null;
function startSound(num){
  stopSound(true);
  const a = AU[num]; if (!a) return;
  curAudio = a; a.currentTime = 0; a.play().catch(() => {});
}
function moved(){}
function stopSound(reset){
  if (curAudio && reset){ curAudio.pause(); curAudio.currentTime = 0; }
  curAudio = null;
}

/* ---------- ציור באצבע / בעכבר ---------- */
svg.addEventListener('pointerdown', e => {
  if (cur >= S.length) return;
  if (busy) stopDemo();                      /* נוגעים באמצע ההדגמה: ההדגמה נעצרת והכתיבה מתחילה */
  e.preventDefault();
  clearIdle();
  const p = toBoard(e), s = S[cur];
  if (dist(p, s.cps[0]) < START_TOL){
    drawing = true; idx = 0;
    svg.setPointerCapture(e.pointerId);
    s.mk.classList.add('drag');
    setProg(s, 0, false); s.prog.style.strokeOpacity = 1;
    startSound(s.num);
  } else {
    const m = s.mk;
    m.classList.remove('shake'); void m.getBoundingClientRect(); m.classList.add('shake');
    armIdle();
  }
});

svg.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = toBoard(e), s = S[cur];
  let best = idx;
  for (let k = idx + 1; k <= Math.min(idx + 4, N - 1); k++){
    if (dist(p, s.cps[k]) < TOL) best = k;
  }
  if (best !== idx){
    idx = best; setProg(s, idx, false); moved();
    if (idx >= N - 1) finishStroke();
  }
});

function release(){
  if (!drawing) return;
  drawing = false;
  const s = S[cur];
  if (idx >= N - 3) { idx = N - 1; finishStroke(true); return; }
  s.mk.classList.remove('drag');
  setProg(s, 0, true);
  setTimeout(() => { s.prog.style.strokeOpacity = 0; }, 450);
  idx = 0; armIdle();
}
svg.addEventListener('pointerup', release);
svg.addEventListener('pointercancel', release);

function finishStroke(fromRelease){
  if (!fromRelease) drawing = false;
  const s = S[cur];
  setProg(s, N - 1, true);
  s.mk.classList.remove('drag');
  cur++; idx = 0;
  refresh();
  if (cur >= S.length) celebrate(); else armIdle();
}

/* ---------- סיום: נצנוץ וקונפטי עדין, בלי משפט מוקלט (חן: לא נשמע טוב) ---------- */
function celebrate(){
  S.forEach(s => { s.prog.style.transition = 'stroke .7s ease'; s.prog.setAttribute('stroke', UNI); });
  const sp = document.getElementById('spark');
  sp.classList.remove('go'); void sp.getBoundingClientRect(); sp.classList.add('go');
  confetti();
  document.getElementById('btn-again').classList.remove('hidden');
  document.getElementById('btn-demo').classList.add('hidden');
  document.getElementById('btn-reset').classList.add('hidden');
}

function confetti(){
  const cols = ['#FFFFFF', '#F7BFD1', '#C4E8D7', '#FFFFFF', '#F7BFD1', '#C4E8D7', '#FBD9E4'];
  for (let i = 0; i < 34; i++){
    const size = 9 + Math.random() * 9, shape = i % 3, col = cols[i % cols.length];
    const c = document.createElementNS(NS, 'svg');
    c.setAttribute('viewBox', '0 0 20 20'); c.setAttribute('width', size); c.setAttribute('height', size);
    c.setAttribute('class', 'confetti');
    const common = 'fill="' + col + '" stroke="#CFE0EC" stroke-width="1.6" stroke-linejoin="round"';
    c.innerHTML = shape === 0 ? '<circle cx="10" cy="10" r="8.5" ' + common + '/>'
      : shape === 1 ? '<path d="M10 2 L18 17 L2 17 Z" ' + common + '/>'
      : '<rect x="2.5" y="2.5" width="15" height="15" rx="3" ' + common + '/>';
    c.style.cssText = 'right:' + (Math.random() * 94) + '%;animation-duration:' + (2.2 + Math.random() * 1.6) + 's;animation-delay:' + (Math.random() * .6) + 's';
    card.appendChild(c);
    setTimeout(() => c.remove(), 4800);
  }
}

/* ---------- הדגמה: נקודה זהובה שמראה את הכיוון (בלי קול) ---------- */
const demoDot = document.getElementById('demo-dot');
const demoTrail = document.getElementById('demo-trail');

let demoRun = 0;
function stopDemo(){
  demoRun++; busy = false;
  demoDot.style.opacity = 0; demoTrail.setAttribute('d', '');
}
function playStroke(i, dur){
  const run = demoRun;
  return new Promise(res => {
    const s = S[i];
    demoTrail.setAttribute('d', CFG.strokes[i].d);
    demoTrail.setAttribute('stroke', s.color);
    demoTrail.style.strokeDasharray = s.L;
    demoDot.style.opacity = 1;
    const t0 = performance.now();
    (function frame(now){
      const t = Math.min((now - t0) / dur, 1);
      const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const pt = s.bed.getPointAtLength(s.L * e);
      demoDot.setAttribute('cx', pt.x); demoDot.setAttribute('cy', pt.y);
      demoTrail.style.strokeDashoffset = s.L - s.L * e;
      if (run !== demoRun) return res();
      if (t < 1) requestAnimationFrame(frame);
      else setTimeout(() => { demoDot.style.opacity = 0; demoTrail.setAttribute('d', ''); res(); }, 250);
    })(t0);
  });
}

async function demo(all){
  if (busy || drawing) return;
  busy = true; clearIdle();
  const from = all ? 0 : cur, to = all ? S.length : cur + 1;
  const run = demoRun;
  for (let i = from; i < to && i < S.length; i++){
    await playStroke(i, 1500);
    if (run !== demoRun) return;
  }
  busy = false;
  armIdle();
}

function armIdle(){ clearIdle(); idleTimer = setTimeout(() => demo(false), 6000); }
function clearIdle(){ clearTimeout(idleTimer); }

/* ---------- כפתורים ---------- */
document.getElementById('btn-demo').onclick = () => demo(true);
document.getElementById('btn-reset').onclick = reset;
document.getElementById('btn-again').onclick = reset;

function reset(){
  busy = false; clearIdle(); stopSound(true);
  document.getElementById('btn-again').classList.add('hidden');
  document.getElementById('btn-demo').classList.remove('hidden');
  document.getElementById('btn-reset').classList.remove('hidden');
  build();
  setTimeout(() => demo(false), 700);
}

build();
setTimeout(() => demo(false), 900);

/* גישה לבדיקות */
window.__game = { S: () => S, state: () => ({ cur, idx }) };
