<style>
:root{--mint-bg:#F0FAF5;--blue-bg:#F1F6FB;--mint:#8FD3B6;--mint-deep:#4FB38C;--blue:#B7CDE0;--blue-deep:#5F8DB5;--pink:#EF406E;--gold:#D9A441;--ink:#2E3A45;--muted:#7A8793}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#fff}
body{font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(circle at 8% 10%,var(--mint-bg) 0 160px,transparent 161px),radial-gradient(circle at 94% 92%,var(--blue-bg) 0 190px,transparent 191px),#fff}
.top{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex:none}
.brand{position:relative;font-family:Rubik,sans-serif;font-weight:600;font-size:14px;color:var(--blue-deep);padding-bottom:3px}
.brand::after{content:"";position:absolute;right:0;bottom:0;width:100%;height:2.5px;border-radius:3px;background:var(--pink);transform:rotate(-.6deg)}
.tools{display:flex;gap:8px}
.ico{width:34px;height:34px;border-radius:50%;border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue-deep);display:grid;place-items:center;cursor:pointer;padding:0}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#app.rot{inset:auto;top:0;left:100%;width:100vh;height:100vw;transform-origin:top left;transform:rotate(90deg)}
.fsbtn{height:34px;padding:0 14px;border-radius:999px;border:2px solid var(--mint-deep);background:var(--mint-bg);color:var(--mint-deep);font-family:Rubik,sans-serif;font-weight:500;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.fsbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#app.compact .top{position:absolute;top:4px;left:0;right:0;height:32px;z-index:6;pointer-events:none}
#app.compact .top>*{pointer-events:auto}
#app.compact #main{position:absolute;inset:36px 0 0 0;flex:none}
#app.compact .bottom{position:absolute;left:0;right:0;bottom:6px;height:44px;z-index:6;pointer-events:none;justify-content:space-between}
#app.compact .bottom .bar{display:none}
#app.compact .bottom .nav{pointer-events:auto;width:40px;height:40px}
#app.compact .fsbtn{height:28px;font-size:12px;padding:0 10px}
#app.compact .ico{width:28px;height:28px}
#app.compact .brand{font-size:12px}
#main{position:relative;flex:1;overflow:hidden;touch-action:none}
#stage{position:absolute;left:50%;top:50%;width:1024px;height:768px;transform-origin:center center;background:#fff;border-radius:34px 40px 36px 42px / 40px 34px 42px 36px;overflow:hidden;border:6px solid var(--blue);box-shadow:0 14px 40px rgba(95,141,181,.18)}
#stage>*{position:absolute}
.bg{inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.bottom{height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px}
.nav{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--blue);background:#fff;color:var(--blue-deep);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.nav:disabled{opacity:.35;cursor:default}
.nav.pulse{border-color:var(--pink);color:var(--pink);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,64,110,.45)}100%{box-shadow:0 0 0 14px rgba(239,64,110,0)}}
.bar{flex:1;height:10px;border-radius:6px;background:var(--blue-bg);border:1.5px solid var(--blue);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);border-radius:6px;transition:width .4s}
/* מסך התחלה */
#start{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(255,255,255,.92);text-align:center}
#start .box{max-width:340px;padding:24px}
#start h1{font-family:Rubik,sans-serif;font-weight:700;font-size:28px;margin:10px 0 4px}
#start p{margin:0 0 18px;color:var(--muted)}
.play{width:92px;height:92px;border-radius:50%;border:0;background:var(--mint-deep);color:#fff;cursor:pointer;display:grid;place-items:center;margin:0 auto;box-shadow:0 10px 24px rgba(79,179,140,.4)}
.play svg{width:42px;height:42px;fill:#fff}
.btn{font-family:Rubik,sans-serif;font-weight:500;font-size:16px;padding:11px 24px;border-radius:999px;cursor:pointer;border:2px solid var(--mint-deep);background:var(--mint-bg);color:var(--mint-deep)}
/* תפריט אותיות */
.menu{inset:0;background:linear-gradient(180deg,#F7EFFA,#EEF6FB)}
.menu h2{position:absolute;top:40px;left:0;right:0;text-align:center;margin:0;font-family:Rubik,sans-serif;font-weight:700;font-size:44px;color:var(--ink)}
.card{position:absolute;width:300px;height:200px;border-radius:40px 46px 42px 48px / 46px 40px 48px 42px;background:#fff;border:5px solid var(--blue);display:grid;place-items:center;font-family:Rubik,sans-serif;font-weight:700;font-size:150px;line-height:1;cursor:pointer;transition:transform .15s}
.card:hover{transform:scale(1.04)}
.card:active{transform:scale(.97)}
.card .tick{position:absolute;top:10px;left:14px;width:46px;height:46px;border-radius:50%;background:var(--mint-deep);color:#fff;display:none;place-items:center;font-size:28px;font-family:Open Sans}
.card.done .tick{display:grid}
/* וידאו */
.vwrap{inset:0;background:linear-gradient(180deg,#EAF3F8,#F6EEFA);display:grid;place-items:center}
.vwrap video{max-width:94%;max-height:92%;border-radius:26px;background:#000;box-shadow:0 10px 30px rgba(46,58,69,.25)}
.vnext{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:3;display:none}
/* חידונים ופאזל */
svg.ov{inset:0;width:100%;height:100%;touch-action:none}
.hit{fill:transparent;cursor:pointer;pointer-events:all}
.shake{animation:shake .4s}
@keyframes shake{20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:5px 0}}
.piece{cursor:grab}
.piece.lock{cursor:default}
.ghost{stroke:#5F8DB5;stroke-width:3;stroke-dasharray:10 8;opacity:.7;pointer-events:none}
.pop{position:absolute;pointer-events:none;border-radius:50%;border:8px solid #F7BFD1;animation:popr .6s ease-out forwards}
@keyframes popr{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(2.2)}}
.fwrap{inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#F0FAF5,#F1F6FB)}
.fwrap iframe{border:0;width:500px;height:700px;transform-origin:center center}
.confetti{position:absolute;pointer-events:none;top:-20px;opacity:0;animation:fall linear forwards;z-index:15}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateY(860px) rotate(260deg)}}
.end{inset:0;z-index:12;background:rgba(255,255,255,.94);display:grid;place-items:center;text-align:center;font-family:Rubik,sans-serif}
.end h1{font-size:52px;margin:0 0 20px}
@media (prefers-reduced-motion:reduce){.confetti,.nav.pulse,.pop{animation:none}}
#app .top{z-index:30!important}
@media (orientation:portrait){body.framed #app{inset:auto 0;top:50%;bottom:auto;height:max(480px,calc(75vw + 200px));transform:translateY(-50%)}}
@media (max-width:480px){#app .top .brand{display:none}#app .top{justify-content:center}#app .tools{gap:10px}}

#start .play{--bs:clamp(42px,calc(var(--ih,600px)*.115),76px);position:absolute;left:50%;top:50%;width:var(--bs)!important;height:var(--bs)!important;margin:0!important;transform:translate(-50%,-50%);border:4px solid #fff!important;box-shadow:0 8px 20px rgba(209,65,117,.38)!important;animation:gopulse 1.8s ease-in-out infinite}

@keyframes gopulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}

/* ---------- כתיבה באצבע (trace) על אות/ספרה, בשקפי טייני טפ שהוחלפו (חן, 4.10.26) ----------

  const e = document.createElement('div'); e.className = 'end'; e.innerHTML = '<div><h1>כל הכבוד!</h1><button class="btn" id="again">עוד פעם מההתחלה</button></div>';
  stage.appendChild(e); confetti(60); ding();
  e.querySelector('#again').onclick = () => { done.clear(); go(0); };
}

/* ---------- כפתורים ---------- */
$('mute').onclick = () => { muted = !muted; voice.volume = muted ? 0 : 1; $('waves').style.display = muted ? 'none' : ''; };
const fsEl = document.documentElement;
const canFs = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
const standaloneUrl = () => location.href.split('#')[0].replace(/[?].*$/, '') + '?full=1';
let rotOff = false;
function rotCheck(){
  const portraitSmall = !framed && innerHeight > innerWidth && Math.min(innerWidth, innerHeight) < 760;
  $('app').classList.toggle('rot', portraitSmall && !rotOff);
  $('rotbtn').style.display = portraitSmall ? 'flex' : 'none';
  $('rotbtn').lastChild.textContent = rotOff ? 'סיבוב לרוחב' : 'בלי סיבוב';
  fit();
}
$('rotbtn').onclick = () => { rotOff = !rotOff; rotCheck(); };
if (!framed){ $('back').style.display = 'flex'; $('closebtn').style.display = 'flex'; }
function leaveGame(preferClose){
  const home = 'https://www.talkwithkids.co.il/';
  const fallback = () => {
    let r = document.referrer || '';
    if (r && !/github\.io/.test(r) && r.replace(/https?:\/\/[^\/]+\/?/, '')) { location.href = r; return; }
    location.href = home;
  };
  // נפתח בדף חדש באותו חלון: חוזרים אחורה אל השיעור
  if (history.length > 1) {
    history.back();
    setTimeout(() => { if (!document.hidden) fallback(); }, 1200);   // אם לא זז, לא נשארים תקועים
    return;
  }
  // נפתח בלשונית חדשה: סוגרים אותה, ואם הדפדפן לא נותן, חוזרים לאתר
  try { window.close(); } catch (e) {}
  setTimeout(fallback, 400);
}
$('back').onclick = () => leaveGame(false);   // חזרה לעמוד השיעור שממנו הגענו (באותו חלון)
$('closebtn').onclick = () => leaveGame(true); // סגירת החלון (אם נפתח בלשונית נפרדת)
addEventListener('resize', rotCheck); addEventListener('orientationchange', () => setTimeout(rotCheck, 200));
async function goFull(){
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if (isFs){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (canFs){
    try {
      await (fsEl.requestFullscreen ? fsEl.requestFullscreen() : fsEl.webkitRequestFullscreen());
      try { await screen.orientation.lock('landscape'); } catch (e) {}
      return;
    } catch (e) {}
  }
  if (framed){   // מנסים לעבור לדף חדש באותו חלון (אז כפתור חזור בדפדפן מחזיר לשיעור); אם נחסם, נפתחת לשונית חדשה
    try { window.top.location.href = standaloneUrl(); return; } catch (e) {}
    window.open(standaloneUrl(), '_blank');
  }
}
$('fs').onclick = goFull;
document.addEventListener('fullscreenchange', rotCheck); document.addEventListener('webkitfullscreenchange', rotCheck);
$('gofs').onclick = async () => { await goFull(); $('go').click(); };
$('go').onclick = () => { tone([440], .02, .0001); $('start').style.display = 'none'; voice.src = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA'; voice.play().catch(() => {}); rotCheck(); go(0); };
rotCheck();
if (/[?&]autostart/.test(location.search)) { $('go').click(); }
window.__ab = { go: go, cur: () => cur, state: () => ({ cur, done: [...done] }) };
</script>
<script>(function(){var s=document.getElementById('start'),g=document.getElementById('go');if(s&&g)s.addEventListener('click',function(e){if(e.target!==g&&!g.contains(e.target))g.click()})})();</script>
