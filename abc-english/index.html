<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>כותבים ABC באנגלית | חן קלימיאן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --pink-bg:#FEF1F3;
  --pink-soft:#F7BFD1;
  --pink:#EF406E;
  --mint-bg:#F0FAF5;
  --mint:#8FD3B6;
  --mint-deep:#4FB38C;
  --blue:#B7CDE0;
  --blue-bg:#F1F6FB;
  --blue-deep:#5F8DB5;
  --gold:#D9A441;
  --ink:#2E3A45;
  --muted:#7A8793;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 8% 12%, var(--pink-bg) 0 150px, transparent 151px),
    radial-gradient(circle at 94% 88%, var(--mint-bg) 0 170px, transparent 171px),
    var(--bg);
  min-height:100vh;display:grid;place-items:center;padding:8px;
  -webkit-user-select:none;user-select:none;
}
.card{
  position:relative;width:100%;max-width:720px;background:#fff;
  border:2.5px solid var(--pink-soft);
  border-radius:30px 36px 32px 38px / 36px 30px 38px 32px;
  padding:14px 16px 18px;box-shadow:0 10px 30px rgba(239,64,110,.10);overflow:hidden;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icons{display:flex;gap:6px}
.icon{width:34px;height:34px;padding:0;border-radius:50%;display:grid;place-items:center;border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue-deep);cursor:pointer}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{font-family:'Rubik',sans-serif;font-weight:600;font-size:14.5px;color:var(--blue-deep);letter-spacing:.2px}
.brand .name{position:relative;padding-bottom:4px;direction:rtl;display:inline-block}
.brand .name::after{content:"";position:absolute;right:0;bottom:0;width:100%;height:2.5px;border-radius:3px;background:var(--pink);transform:rotate(-.6deg)}
.title{text-align:center;margin:8px 0 2px;font-family:'Rubik',sans-serif;font-weight:700;font-size:25px;line-height:1.2}
.title .hl{color:var(--pink);direction:ltr;unicode-bidi:isolate;font-size:30px;letter-spacing:2px}
.sub{text-align:center;margin:0 0 8px;font-size:14.5px;color:var(--muted)}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin:4px 0 8px;direction:ltr}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--blue-bg);border:1.5px solid var(--blue)}
.dots i.done{background:var(--mint-deep);border-color:var(--mint-deep)}
.dots i.now{background:var(--pink);border-color:var(--pink);transform:scale(1.25)}

.boardbox{touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none}
svg.board{display:block;width:100%;height:auto;background:var(--pink-bg);border-radius:26px 30px 28px 32px / 30px 26px 32px 28px;touch-action:none;cursor:pointer}
.ln-top,.ln-base{stroke:#F2A9BE;stroke-width:2.5;stroke-linecap:round}
.ln-mid{stroke:#9FC3DD;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}
.ln-desc{stroke:#C9DCE9;stroke-width:1.6;stroke-dasharray:2 8;stroke-linecap:round}
.ln-sep{stroke:#fff;stroke-width:3;stroke-linecap:round}
.bed{fill:none;stroke:#E4EEF0;stroke-width:25;stroke-linecap:round;stroke-linejoin:round}
.dash{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1 10}
.prog{fill:none;stroke-width:21;stroke-linecap:round;stroke-linejoin:round}
.arrow{fill:none;stroke:#6C98BF;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s}
.arrow.off{opacity:0}
.marker .dot{stroke:#fff;stroke-width:3}
.marker.future .dot{fill:var(--blue)}
.marker.now .dot{fill:var(--pink)}
.marker.done{opacity:0;transition:opacity .3s}
.marker .ring{fill:none;stroke:var(--pink);stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center}
.marker.now .ring{animation:pulse 1.6s ease-out infinite}
.marker.drag .ring{animation:none;opacity:0}
@keyframes pulse{0%{transform:scale(.9);opacity:.8}100%{transform:scale(2.1);opacity:0}}
.shake{animation:shake .38s}
@keyframes shake{20%{translate:-5px 0}40%{translate:5px 0}60%{translate:-3px 0}80%{translate:3px 0}}
.demo-dot{fill:var(--gold);stroke:#fff;stroke-width:4;opacity:0}
.demo-trail{fill:none;stroke-width:6;stroke-linecap:round;opacity:.55}
.spark{fill:var(--gold);transform-box:fill-box;transform-origin:center;opacity:0}
.spark.go{animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:scale(.2) rotate(0)}30%{opacity:.9;transform:scale(1.1) rotate(40deg)}100%{opacity:0;transform:scale(1.4) rotate(90deg)}}

.btns{display:flex;justify-content:center;gap:8px;flex-wrap:nowrap;margin-top:12px;min-height:44px}.btns button{padding:10px 14px;font-size:14.5px;white-space:nowrap}
button{font-family:'Rubik',sans-serif;font-weight:500;font-size:15px;padding:10px 20px;border-radius:999px;cursor:pointer;border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue-deep);transition:transform .15s, background .2s}
button:hover{background:#E6F0F8}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
button.again{border-color:var(--mint-deep);background:var(--mint-bg);color:var(--mint-deep)}
.hidden{display:none!important}
.confetti{position:absolute;pointer-events:none;top:-18px;opacity:0;animation:fall linear forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateY(620px) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){.marker.now .ring,.spark.go,.confetti{animation:none}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="top">
    <div class="icons">
      <button class="icon" id="btn-mute" type="button" aria-label="השתקה" title="השתקה"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="cross" class="hidden" d="M17 9l5 6M22 9l-5 6"/></svg></button>
      <button class="icon" id="btn-fs" type="button" aria-label="מסך מלא" title="מסך מלא"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="brand"><span class="name" id="series"></span></div>
  </div>
  <h1 class="title" id="title"></h1>
  <p class="sub" id="sub">קודם האות הגדולה ואחר כך הקטנה, עוקבים עם האצבע אחרי הקו</p>
  <div class="dots" id="dots"></div>

  <div class="boardbox" id="boardbox">
  <svg class="board" id="board" role="img" aria-label="לוח כתיבה">
    <g id="guides"></g>
    <g id="layers"></g>
    <g id="markers"></g>
    <g id="demo-layer">
      <path class="demo-trail" id="demo-trail" d=""/>
      <circle class="demo-dot" id="demo-dot" r="11" cx="0" cy="0"/>
    </g>
    <path class="spark" id="spark" d=""/>
  </svg>
  </div>

  <div class="btns">
    <button id="btn-demo" type="button">הראי לי איך</button>
    <button id="btn-reset" type="button">מתחילים מחדש</button>
    <button id="btn-again" type="button" class="again hidden">לשחק שוב</button>
  </div>
</main>

  busy = false; armIdle();
}
function armIdle(){ clearIdle(); idleTimer = setTimeout(() => demo(false), 6000); }
function clearIdle(){ clearTimeout(idleTimer); }

/* ---------- כפתורים ---------- */
document.getElementById('btn-demo').onclick = () => demo(true);
document.getElementById('btn-reset').onclick = () => { stopDemo(); clearIdle(); build(); setTimeout(() => demo(false), 600); };
document.getElementById('btn-again').onclick = () => { stopDemo(); stage = 0; build(); setTimeout(() => demo(false), 600); };
document.getElementById('btn-mute').onclick = () => {
  muted = !muted;
  document.getElementById('wave').classList.toggle('hidden', muted);
  document.getElementById('cross').classList.toggle('hidden', !muted);
  if (muted) for (const k in AU) AU[k].pause();
};
const fsBtn = document.getElementById('btn-fs');
if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) fsBtn.classList.add('hidden');
fsBtn.onclick = () => {
  const d = document, r = d.documentElement;
  try { if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (r.requestFullscreen || r.webkitRequestFullscreen).call(r); } catch (e) {}
};

layout(); build();
setTimeout(() => demo(false), 900);
addEventListener('resize', () => { const st = innerWidth < 600; if (st !== STACK && !drawing && !busy){ STACK = st; layout(); build(); } });
window.__game = { S: () => S, state: () => ({ stage, cur, idx, finished }), goto: n => { stage = n; build(); }, letters: () => LETTERS.length };
</script>
