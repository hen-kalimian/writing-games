<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>אולפן ההקלטות של חן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* אולפן ההקלטות (חן, 21.10.26): חן מקליטה בקול שלה הנחיות, מילים ועידוד, וההקלטות נכנסות למשחקים במקום הקול הממוחשב */
:root{--mint:#CDEFE2;--mint-deep:#7CC9B0;--mint-wash:#EEF9F5;--sky:#BFE3F4;--sky-deep:#6FAFD2;--sky-wash:#EFF8FD;--pink:#F9D4DF;--pink-deep:#E98FAB;--pink-wash:#FDF0F4;--rose:#B8236B;--ink:#4B5B69;--muted:#7A8995;--bg:#FBFDFE}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,Arial,sans-serif}
body{padding:0 16px 60px}
header{max-width:760px;margin:0 auto;padding:22px 0 8px;text-align:center}
h1{margin:0;font-size:26px;color:var(--rose)}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
.bar{height:12px;border-radius:8px;background:var(--pink-wash);border:1.5px solid var(--pink);overflow:hidden;margin:14px auto 4px;max-width:420px}
.bar i{display:block;height:100%;background:var(--pink-deep);width:0;transition:width .4s}
.cnt{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:8px;justify-content:center;margin:16px auto 6px;flex-wrap:wrap}
.tabs button{font:600 15px Rubik,Arial;border:2px solid var(--pink);background:#fff;color:var(--ink);border-radius:22px;padding:9px 16px;cursor:pointer}
.tabs button.on{background:var(--pink);border-color:var(--pink-deep);color:var(--rose)}
main{max-width:760px;margin:0 auto}
.secnote{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 14px;line-height:1.5}
.item{background:#fff;border:2px solid var(--pink);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:0 3px 10px rgba(233,143,171,.12)}
.item.done{border-color:var(--mint-deep);background:linear-gradient(#fff,var(--mint-wash))}
.item.sent{border-color:var(--sky-deep)}
.nik{font-size:30px;line-height:1.55;font-weight:500;text-align:center;margin:2px 0 8px;color:#3b4855}
.when{font-size:14px;color:var(--muted);text-align:center;margin:0 0 10px;line-height:1.5}
.games{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.g{flex:0 0 auto;width:96px;border:1.5px solid var(--sky);border-radius:12px;background:var(--sky-wash);padding:4px;cursor:pointer;font:500 11px Rubik,Arial;color:var(--ink);text-align:center}
.g img{display:block;width:100%;height:120px;object-fit:cover;object-position:top;border-radius:8px;background:#fff}
.g span{display:block;margin-top:3px;line-height:1.25;max-height:2.5em;overflow:hidden}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{font:600 16px Rubik,Arial;border-radius:26px;padding:11px 18px;border:2px solid var(--pink-deep);background:#fff;color:var(--rose);cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:46px}
.btn.rec{background:var(--pink-deep);color:#fff}
.btn.rec.live{background:#d9486f;border-color:#d9486f;animation:pulse 1s infinite}
.btn.save{background:var(--mint-deep);border-color:var(--mint-deep);color:#fff}
.btn.soft{border-color:var(--sky-deep);color:#2f6f93}
.btn[disabled]{opacity:.45;cursor:default}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(217,72,111,.18)}}
.dot{width:12px;height:12px;border-radius:50%;background:currentColor;display:inline-block}
.st{text-align:center;font-size:14px;margin-top:8px;min-height:20px;color:var(--muted)}
.st.ok{color:#2f8f6f;font-weight:600}.st.err{color:#c0392b;font-weight:600}
.lock{max-width:520px;margin:40px auto;text-align:center;background:#fff;border:2px solid var(--pink);border-radius:20px;padding:24px;font-size:17px;line-height:1.6}
#modal{position:fixed;inset:0;background:rgba(40,50,60,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:20px;width:min(560px,100%);height:min(86vh,820px);display:flex;flex-direction:column;overflow:hidden;border:2px solid var(--pink)}
#modal .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1.5px solid var(--pink);font-weight:600;font-size:15px}
#modal iframe{flex:1;border:0;width:100%}
#modal .x{font:600 15px Rubik,Arial;border:2px solid var(--pink-deep);background:#fff;color:var(--rose);border-radius:20px;padding:6px 14px;cursor:pointer}
.grp{background:#fff;border:2px solid var(--pink);border-radius:20px;padding:12px 12px 4px;margin:0 0 16px}
.grp h3{margin:2px 0 6px;text-align:center;font-size:30px;color:var(--rose);letter-spacing:6px}
.item.srow{border:1.5px solid var(--pink);border-radius:14px;padding:10px;margin:0 0 8px;box-shadow:none}
.srow .nik{font-size:32px;margin:0;letter-spacing:2px}
.srow .hint{text-align:center;font-size:13px;color:var(--muted);direction:ltr}
.srow .row{margin-top:6px;gap:6px}.srow .btn{font-size:14px;padding:8px 12px;min-height:40px}
.item.mini{display:flex;align-items:center;gap:8px;padding:7px 12px;margin:0 0 6px;border:1.5px solid var(--mint-deep);border-radius:12px;background:var(--mint-wash);box-shadow:none;cursor:pointer;font-size:15px;line-height:1.4}
.item.mini .v{flex:none;width:20px;height:20px;border-radius:50%;background:var(--mint-deep);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.item.mini .v svg{width:13px;height:13px}
.item.mini .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.mini .mx{flex:none;font-size:12px;color:var(--muted)}
.tip{max-width:760px;margin:0 auto 12px;background:var(--sky-wash);border:1.5px solid var(--sky);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.55}
</style>
</head>
<body>
<header>
  <h1>אולפן ההקלטות של חן</h1>
  <p class="sub">לחצי "הקלטה", קראי את השורה ולחצי "עצירה". ההקלטה נשמרת לבד אחרי 3 שניות ונכנסת לכל המשחקים שמופיעים מתחת לשורה. רוצה לנסות שוב? לחצי "הקלטה מחדש".</p>
  <div class="bar"><i id="bar"></i></div>
  <div class="cnt" id="cnt"></div>
</header>
<div class="tip" id="tip">טיפ להקלטה נקייה: חדר שקט, הטלפון במרחק כף יד מהפה, ושנייה של שקט לפני ואחרי שמדברים (אני חותכת את השקט לבד).</div>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div id="modal"><div class="box"><div class="top"><span id="mt"></span><span><button class="x" id="mo" type="button">פתיחה בלשונית</button> <button class="x" id="mx" type="button">סגירה</button></span></div><iframe id="mf" allow="autoplay; fullscreen"></iframe></div></div>
<script type="module">
const $ = id => document.getElementById(id);
const CLIENT_ID = '058da38e-a911-4b84-876e-e5efedfa9ae9', COL = 'StudioRecordings';
const SENT = 'hen-studio-sent', KEYS = 'hen-studio-k';
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} } };
// הקישור של חן נושא מפתח אישי, כך שרק ההקלטות שלה נכנסות למשחקים
let secret = (location.hash.match(/k=([\w-]+)/) || [])[1] || store.get(KEYS, '');
if (secret) { store.set(KEYS, secret); if (location.hash) history.replaceState(null, '', location.pathname + location.search); }
if (!secret) { $('main').innerHTML = '<div class="lock">האולפן נפתח רק מהקישור האישי ששלחתי לך.</div>'; $('tabs').remove(); $('tip').remove(); throw 0; }

const SECS = [{ id: 'kb', name: 'קוראים בקלות', note: 'ההנחיות שהילדים שומעים במשחקים של קוראים בקלות. כל הנחיה נכנסת לכל המשחקים שמופיעים מתחתיה (וגם למשחקים אחרים עם אותה הנחיה). לחיצה על משחק פותחת אותו.' },
  { id: 'syl', name: 'הברות לפי ניקוד', note: 'הקלטה אחת לכל צליל. כל מה שבשורה נשמע אותו דבר (קָמָץ ופַּתָּח, כּ ו-ק), ולכן מספיקה הקלטה אחת לכולם. במשחקים, לחיצה על אריח עם ההברה משמיעה את הקול שלך. המשחקים שבהם יש הברות של האות מופיעים מתחת לאות.' },
  { id: 'words', name: 'מילים מהשאלות', note: 'המילים שמופיעות בשאלות של קוראים בקלות. ליד תמונה יופיע רמקול שמשמיע את המילה בקול שלך. מילה שהילד צריך לקרוא בעצמו נשמעת רק אחרי שענה נכון, כדי שלא יגלה את התשובה לפני שקרא.' },
  { id: 'answers', name: 'מילים בתשובות', note: 'המילים שבאפשרויות התשובה, מסודרות לפי משחק. כל מילה נשמעת בקול שלך אחרי שהילד בחר בה נכון. אפשר להקליט בהדרגה.' },
  { id: 'names', name: 'שמות האותיות', note: 'שם האות נשמע במשחק "מתחו קו אל האות הזהה" בכל נגיעה ובכל התאמה. עד שתקליטי, נשמע קול ממוחשב.' },
  { id: 'more', name: 'הנחיות במשחקים נוספים', note: 'הנחיות של הפאזלים ושל משחק מתיחת הקו. לחיצה על המשחק פותחת אותו.' },
  { id: 'all', name: 'עידוד וצלילים', note: 'מילים וצלילים שנשמעים בכל המשחקים. כל הכבוד, נסו שוב, סיום משחק וגרירת פריטים. עד שתקליטי, המשחקים נשארים כמו היום.' }];
let D, HEN = {}, sent = store.get(SENT, {}), sec = store.get('hen-studio-sec', 'kb');
const [d, h] = await Promise.all([fetch('items.json?v=' + Date.now()).then(r => r.json()), fetch('../play/assets/hen/index.json?v=' + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({}))]);
D = d; HEN = h;
const G = Object.fromEntries(D.games.map(g => [g.n, g]));

function status(it) { return HEN[it.k] && (!sent[it.id] || HEN[it.k] >= sent[it.id]) ? 'done' : sent[it.id] ? 'sent' : ''; }
function progress() { const n = D.items.filter(i => status(i)).length; $('bar').style.width = (100 * n / D.items.length) + '%'; $('cnt').textContent = 'הוקלטו ' + n + ' מתוך ' + D.items.length; }
function tabs() { $('tabs').innerHTML = SECS.map(s => { const all = D.items.filter(i => i.sec === s.id), n = all.filter(i => status(i)).length; return '<button type="button" data-s="' + s.id + '" class="' + (s.id === sec ? 'on' : '') + '">' + s.name + ' (' + n + '/' + all.length + ')</button>' }).join(''); }
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const opened = {};
function card(it) {
  const st = status(it);
  if (st && !opened[it.id]) return '<section class="item mini" id="' + it.id + '" data-a="open" title="לחיצה פותחת להקלטה מחדש"><span class="v"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l5 5L19 7"/></svg></span><span class="mt">' + esc(it.nik) + '</span><span class="mx">' + (st === 'done' ? 'בוצע' : 'נשמר') + '</span></section>';
  const gs = (it.games || []).map(n => G[n]).filter(Boolean);
  return '<section class="item ' + st + '" id="' + it.id + '"><div class="nik">' + esc(it.nik) + '</div>' +
    (it.when && gs.length ? '<div class="when">' + esc(it.when) + '</div>' : '') + (gs.length ? '<div class="when">נשמע ב-' + gs.length + ' משחקים' + (gs.length > 1 ? ', אפשר לגלול הצידה' : '') + '</div><div class="games">' + gs.map(g => '<button type="button" class="g" data-g="' + g.n + '"><img loading="lazy" src="th/' + g.n + '.jpg" alt=""><span>' + esc(g.title) + '</span></button>').join('') + '</div>' : '<div class="when">' + esc(it.when || '') + '</div>') +
    '<div class="row"><button type="button" class="btn rec" data-a="rec"><span class="dot"></span><span>' + (st ? 'הקלטה מחדש' : 'הקלטה') + '</span></button>' +
    '<button type="button" class="btn soft" data-a="play" disabled>להשמיע את מה שהקלטתי</button>' +
    '<button type="button" class="btn save" data-a="save" disabled>לשמור עכשיו</button></div>' +
    '<div class="row">' + (st === 'done' ? '<button type="button" class="btn soft" data-a="mine">להשמיע את הקול שלך במשחק</button>' : '') +
    (it.sec === 'kb' && !st ? '<button type="button" class="btn soft" data-a="tts">להשמיע את הקול הממוחשב שיש היום</button>' : '') + '</div>' +
    '<div class="st ' + (st === 'done' ? 'ok' : '') + '">' + (st === 'done' ? 'בקול שלך במשחקים' : st === 'sent' ? 'נשמר. ייכנס למשחקים בעוד כמה דקות' : '') + '</div></section>';
}
function srow(it) {
  const st = status(it);
  if (st && !opened[it.id]) return '<section class="item mini" id="' + it.id + '" data-a="open" title="לחיצה פותחת להקלטה מחדש"><span class="v"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l5 5L19 7"/></svg></span><span class="mt">' + esc(it.nik) + '</span><span class="mx">' + (st === 'done' ? 'בוצע' : 'נשמר') + '</span></section>';
  return '<section class="item srow ' + st + '" id="' + it.id + '"><div class="nik">' + esc(it.nik) + '</div><div class="hint">' + esc(it.hint) + '</div>' +
    '<div class="row"><button type="button" class="btn rec" data-a="rec"><span class="dot"></span><span>' + (st ? 'הקלטה מחדש' : 'הקלטה') + '</span></button>' +
    '<button type="button" class="btn soft" data-a="play" disabled>להשמיע</button><button type="button" class="btn save" data-a="save" disabled>לשמור עכשיו</button>' +
    (st === 'done' ? '<button type="button" class="btn soft" data-a="mine">הקול שלך במשחק</button>' : '') + '</div>' +
    '<div class="st ' + (st === 'done' ? 'ok' : '') + '">' + (st === 'done' ? 'בקול שלך במשחקים' : st === 'sent' ? 'נשמר. ייכנס למשחקים בעוד כמה דקות' : '') + '</div></section>';
}
function sylHtml() {
  const by = {}; D.items.filter(i => i.sec === 'syl').forEach(i => (by[i.grp] = by[i.grp] || []).push(i));
  return Object.values(by).map(l => { const gs = [...new Set(l.flatMap(i => i.games || []))].map(n => G[n]).filter(Boolean);
    return '<div class="grp"><h3>' + esc(l[0].grpName) + '</h3>' + (gs.length ? '<div class="when">מופיע ב-' + gs.length + ' משחקים</div><div class="games">' + gs.map(g => '<button type="button" class="g" data-g="' + g.n + '"><img loading="lazy" src="th/' + g.n + '.jpg" alt=""><span>' + esc(g.title) + '</span></button>').join('') + '</div>' : '') + l.map(srow).join('') + '</div>'; }).join('');
}
function ansHtml() {
  const by = new Map(); D.items.filter(i => i.sec === 'answers').forEach(i => { const g = (i.games || [])[0]; if (!by.has(g)) by.set(g, []); by.get(g).push(i); });
  return [...by.entries()].map(([n, l]) => { const g = G[n]; return '<div class="grp">' + (g ? '<div class="games" style="justify-content:center"><button type="button" class="g" data-g="' + g.n + '"><img loading="lazy" src="th/' + g.n + '.jpg" alt=""><span>' + esc(g.title) + '</span></button></div>' : '') + l.map(srow).join('') + '</div>'; }).join('');
}
function render() { tabs(); progress(); const s = SECS.find(x => x.id === sec) || SECS[0]; $('main').innerHTML = '<p class="secnote">' + s.note + '</p>' + (s.id === 'syl' ? sylHtml() : s.id === 'answers' ? ansHtml() : D.items.filter(i => i.sec === s.id).map(s.id === 'names' ? srow : card).join('')); }
render();

// ===== הקלטה =====
let rec = null, chunks = [], recItem = null, takes = {}, stream = null, player = new Audio(), t0 = 0, tmr = 0;
const MIME = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
function setSt(id, msg, cls) { const e = document.querySelector('#' + id + ' .st'); if (e) { e.className = 'st ' + (cls || ''); e.textContent = msg; } }
const auto = {};
async function startRec(id) {
  if (rec) { stopRec(); if (recItem === id) return; }
  if (auto[id]) { clearInterval(auto[id]); delete auto[id]; }
  try { stream = stream && stream.active ? stream : await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true, channelCount: 1 } }); }
  catch (e) { setSt(id, 'צריך לאשר לדפדפן להשתמש במיקרופון, ואז ללחוץ שוב על הקלטה', 'err'); return; }
  player.pause(); chunks = []; recItem = id;
  rec = new MediaRecorder(stream, MIME ? { mimeType: MIME, audioBitsPerSecond: 128000 } : undefined);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const b = new Blob(chunks, { type: rec.mimeType || MIME || 'audio/mp4' }); takes[id] = b; const s = document.getElementById(id); s.querySelector('[data-a=play]').disabled = false; s.querySelector('[data-a=save]').disabled = false; let left = 3; setSt(id, 'נשמר אוטומטית בעוד ' + left + ' שניות. רוצה לנסות שוב? לחצי "הקלטה מחדש"'); auto[id] = setInterval(() => { left--; if (left > 0) setSt(id, 'נשמר אוטומטית בעוד ' + left + ' שניות. רוצה לנסות שוב? לחצי "הקלטה מחדש"'); else { clearInterval(auto[id]); delete auto[id]; save(id); } }, 1000); rec = null; };
  rec.start(); t0 = Date.now();
  const s = document.getElementById(id), b = s.querySelector('[data-a=rec]'); b.classList.add('live'); b.lastChild.textContent = 'עצירה';
  clearInterval(tmr); tmr = setInterval(() => { const sec = Math.floor((Date.now() - t0) / 1000); setSt(id, 'מקליטה... ' + sec + ' שניות'); if (sec >= 30) stopRec(); }, 250);
}
function stopRec() { clearInterval(tmr); if (!rec) return; const s = document.getElementById(recItem); if (s) { const b = s.querySelector('[data-a=rec]'); b.classList.remove('live'); b.lastChild.textContent = 'הקלטה מחדש'; } try { rec.stop() } catch (e) {} }
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
let wix = null;
async function client() {
  if (wix) return wix;
  const [{ createClient, OAuthStrategy }, { items }] = await Promise.all([import('https://esm.sh/@wix/sdk@1.21.16'), import('https://esm.sh/@wix/data@1.0.525')]);
  wix = createClient({ auth: OAuthStrategy({ clientId: CLIENT_ID }), modules: { items } }); return wix;
}
async function save(id) {
  const it = D.items.find(i => i.id === id), blob = takes[id]; if (!blob) return; delete takes[id];
  const el0 = () => document.getElementById(id), btn = el0() && el0().querySelector('[data-a=save]'); if (btn) btn.disabled = true; setSt(id, 'שומרת...');
  try {
    const audio = await b64(blob); if (audio.length > 480000) throw new Error('long');
    const c = await client();
    await c.items.insert(COL, { title: secret, itemId: id, k: it.k, text: it.nik, mime: blob.type, audio, synced: false });
    sent[id] = Date.now(); store.set(SENT, sent);
    delete opened[id]; tabs(); progress(); const s = el0(); if (s) s.outerHTML = (/^(syl|names|answers)$/.test(it.sec) ? srow : card)(it);
  } catch (e) { takes[id] = blob; const b2 = el0() && el0().querySelector('[data-a=save]'); if (b2) b2.disabled = false; setSt(id, e.message === 'long' ? 'ההקלטה ארוכה מדי. נסי שוב קצת יותר קצר' : 'השמירה לא הצליחה. בדקי שיש אינטרנט ולחצי שוב על שמירה', 'err'); console.error(e); }
}
function play(src) { player.pause(); player.src = src; player.currentTime = 0; player.play().catch(() => {}); }
