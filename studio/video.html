<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הקלטה עם הסרטון</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffafb;--ink:#2b3138;--muted:#6a737c;--pink:#ef406e;--pink-wash:#fde1ea;--pink-line:#fbc5d6;--mint:#a8e6cf;--mint-deep:#3f9a79;--sky:#cfe7f3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(800px 380px at 90% -10%,#fde9ef,transparent 70%),radial-gradient(600px 320px at 0 0,#eef8f3,transparent 65%),var(--bg);color:var(--ink);font:500 16px/1.5 Rubik,Arial,sans-serif;padding:env(safe-area-inset-top) 14px 40px}
header{text-align:center;padding:18px 0 6px}
h1{margin:0;font:800 24px Rubik,Arial}h1 span{color:var(--pink)}
.sub{color:var(--muted);margin:6px auto 0;max-width:560px;font-size:15px}
.back{display:inline-block;margin:10px 0 0;color:#b8236b;font-weight:700;text-decoration:none}
h2{font:700 17px Rubik,Arial;margin:22px 0 8px;color:#b8236b}
.grid{display:grid;grid-template-columns:1fr;gap:10px;max-width:640px;margin:0 auto}
.tile{background:#fff;border:2px solid var(--pink-line);border-radius:18px;padding:12px;text-align:center;cursor:pointer;font:inherit;color:inherit;position:relative}
.tile b{display:block;font-size:16px}.tile small{color:var(--muted)}
.tile.done{background:#effaf5;border-color:var(--mint)}.tile.done::after{content:"✓ הוקלט";position:absolute;top:6px;inset-inline-start:8px;font-size:12px;color:var(--mint-deep);font-weight:700}
.wrap{max-width:640px;margin:0 auto}
.lock{max-width:520px;margin:60px auto;text-align:center;font-size:18px}
#stage{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none;padding:env(safe-area-inset-top) 12px 24px}
#stage.on{display:block}
#dock{position:sticky;bottom:0;background:var(--bg);padding:4px 0 10px;z-index:6;box-shadow:0 -8px 12px -8px rgba(43,49,56,.25)}
.top{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:8px auto}
.top button{font:700 14px Rubik,Arial}.top b{font-size:14px;text-align:center;flex:1;padding:0 8px}
.xbtn{border:2px solid var(--pink-line);background:var(--pink-wash);border-radius:14px;padding:7px 14px;cursor:pointer;color:var(--ink)}
.page{position:relative;max-width:min(980px,100%);margin:6px auto;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px -12px rgba(43,49,56,.35);background:#fff}
.page img{display:block;width:100%;height:auto}
#hl{position:absolute;background:var(--mint);mix-blend-mode:multiply;border-radius:2.2%;display:none}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,250,251,.82);font:800 120px Rubik,Arial;color:var(--pink)}
.hint{text-align:center;max-width:640px;margin:6px auto;color:var(--muted)}
.bar{max-width:640px;margin:6px auto;height:8px;background:#f3d3dd;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--pink)}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:640px;margin:10px auto}
.btn{font:800 17px Rubik,Arial;border:0;border-radius:16px;padding:13px 22px;cursor:pointer;background:var(--pink);color:#fff}
.btn.soft{background:var(--pink-wash);color:var(--ink);border:2px solid var(--pink-line)}
.btn:disabled{opacity:.45}
.btn.live{background:#c0264f}
.st{text-align:center;min-height:24px;font-weight:700}.st.err{color:#c0264f}.st.ok{color:var(--mint-deep)}
</style>
</head>
<body>
<header>
  <h1>הקלטה <span>עם הסרטון</span></h1>
  <p class="sub">בוחרים חלק, לוחצים "הקלטה", ואחרי ספירה לאחור קוראים יחד עם המלבן הירוק שזז על העמוד. ההקלטה נשמרת לבד.</p>
  <a class="back" href="./index.html">חזרה לאולפן</a>
</header>
<main class="wrap" id="main"></main>
<div id="stage">
  <div class="top"><button class="xbtn" id="close" type="button">חזרה לרשימה</button><b id="ttl"></b><span></span></div>
  <div class="page" id="pg"><img id="img" alt=""><div id="hl"></div><div id="cd"></div></div>
  <div id="dock"><div class="hint" id="hint"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="st" id="st"></div>
  <div class="ctl" id="ctl"></div></div>
</div>
<script type="module">
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} } };
const CLIENT_ID = '058da38e-a911-4b84-876e-e5efedfa9ae9', COL = 'StudioRecordings', SENT = 'hen-vid-sent';
let secret = (location.hash.match(/k=([\w-]+)/) || [])[1] || store.get('hen-studio-k', '');
if (secret) { store.set('hen-studio-k', secret); if (location.hash) history.replaceState(null, '', location.pathname + location.search); }
if (!secret) { $('main').innerHTML = '<div class="lock">הדף נפתח רק מהקישור האישי של האולפן.</div>'; throw 0; }
const sent = store.get(SENT, {});
const COUNT = 3;
let signs = [], data = {}, cur = null, rec = null, stream = null, chunks = [], take = null, raf = 0, autoT = 0, running = false;

async function load() {
  signs = await (await fetch('vid/index.json?v=' + Date.now())).json();
  for (const s of signs) data[s.code] = await (await fetch('vid/scenes_' + s.code + '.json?v=' + Date.now())).json();
  home();
}
function home() {
  $('main').innerHTML = signs.map(s => {
    const sc = data[s.code].scenes.filter(x => !x.hidden), g = st => sc.filter(x => x.stage === st);
    const tiles = list => '<div class="grid">' + list.map(x => `<button class="tile ${sent[x.id] ? 'done' : ''}" data-id="${x.id}"><b>${x.title}</b><small>כ-${Math.round(x.dur)} שניות ברצף</small></button>`).join('') + '</div>';
    return `<h2>${s.name}</h2>${tiles(sc)}`;
  }).join('');
}
document.addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) openScene(t.dataset.id); });
function findScene(id) { for (const k in data) { const s = data[k].scenes.find(x => x.id === id); if (s) return s; } }
function setSt(m, c) { $('st').className = 'st ' + (c || ''); $('st').textContent = m || ''; }
function openScene(id) {
  cur = findScene(id); take = null; $('img').src = cur.img; $('ttl').textContent = cur.title; $('hint').textContent = cur.hint; $('hl').style.display = 'none'; $('prog').style.width = '0';
  setSt(sent[id] ? 'כבר הוקלט. אפשר להקליט שוב והחדש יחליף' : '', sent[id] ? 'ok' : ''); controls('idle'); $('stage').classList.add('on'); scrollTo(0, 0);
}
function controls(mode) {
  const c = $('ctl');
  if (mode === 'idle') c.innerHTML = '<button class="btn soft" id="bWatch">צפייה בלי הקלטה</button><button class="btn" id="bRec">הקלטה</button>';
  if (mode === 'run') c.innerHTML = '<button class="btn live" id="bStop">עצירה</button>';
  if (mode === 'done') c.innerHTML = '<button class="btn soft" id="bPlay">האזנה</button><button class="btn soft" id="bAgain">הקלטה מחדש</button><button class="btn" id="bSave">שמירה עכשיו</button>';
  if (mode === 'saved') c.innerHTML = '<button class="btn soft" id="bAgain">הקלטה מחדש</button><button class="btn" id="bNext">לחלק הבא</button>';
}
function draw(t) {
  const [W, H] = data[signOf(cur)].size, hl = $('hl');
  const s = cur.steps.find(x => t >= x.t0 && t < x.t1);
  if (!s) { hl.style.display = 'none'; return; }
  const px = s.px ?? 16, py = 14;
  hl.style.cssText = `background:${s.color || 'var(--mint)'};display:block;left:${(s.x0 - px) / W * 100}%;top:${(s.y0 - py) / H * 100}%;width:${(s.x1 - s.x0 + 2 * px) / W * 100}%;height:${(s.y1 - s.y0 + 2 * py) / H * 100}%`;
  try { const st = $('stage'), pg = $('pg'), cy = (s.y0 + s.y1) / 2 / H * pg.offsetHeight, key = Math.round(cy / 40); if (key !== draw.k) { draw.k = key; st.scrollTo({ top: pg.offsetTop + cy - (st.clientHeight - 150) * 0.4, behavior: 'smooth' }); } } catch (e) {}
}
const signOf = sc => sc.id.slice(1, 3);
function play(withRec) {
  return new Promise(async res => {
    running = true; let off = 0;
    if (withRec) {
      try { stream = stream && stream.active ? stream : await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true, channelCount: 1 } }); }
      catch (e) { stream = null; setSt('המיקרופון לא נפתח. באייפון: לחצי על aA בשורת הכתובת, הגדרות אתר, מיקרופון, אפשר, ורענני.', 'err'); running = false; controls('idle'); return res(null); }
      try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
      const MIME = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
      chunks = []; rec = new MediaRecorder(stream, MIME ? { mimeType: MIME, audioBitsPerSecond: 64000 } : undefined);
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      rec.start();
    }
    const t0 = performance.now(); $('cd').style.display = 'flex';
    for (let n = COUNT; n > 0; n--) { $('cd').textContent = n; await new Promise(r => setTimeout(r, 1000)); if (!running) break; }
    $('cd').style.display = 'none';
    if (!running) return finish(withRec, 0, res, true);
    const start = performance.now(); off = (start - t0) / 1000;
    const tick = () => {
      if (!running) return finish(withRec, off, res, true);
      const t = (performance.now() - start) / 1000; draw(t); $('prog').style.width = Math.min(100, t / cur.dur * 100) + '%';
      if (t >= cur.dur) { running = false; return finish(withRec, off, res); }
      raf = requestAnimationFrame(tick);
    };
    tick();
  });
}
function finish(withRec, off, res, aborted) {
  running = false; cancelAnimationFrame(raf); $('hl').style.display = 'none'; $('cd').style.display = 'none';
  if (!withRec) { setSt('', ''); controls('idle'); return res(null); }
  rec.onstop = () => {
    take = { blob: new Blob(chunks, { type: rec.mimeType || 'audio/mp4' }), off };
    try { stream.getTracks().forEach(t => t.stop()); } catch (e) {} stream = null;
    if (aborted) { setSt('עצרת באמצע. אפשר להקליט מחדש.', 'err'); controls('done'); return res(take); }
    let left = 3; setSt('נשמר אוטומטית בעוד ' + left + ' שניות. רוצה לנסות שוב? לחצי "הקלטה מחדש"');
    controls('done'); clearInterval(autoT);
    autoT = setInterval(() => { left--; if (left <= 0) { clearInterval(autoT); save(); } else setSt('נשמר אוטומטית בעוד ' + left + ' שניות. רוצה לנסות שוב? לחצי "הקלטה מחדש"'); }, 1000);
    res(take);
  };
  try { rec.stop(); } catch (e) { res(null); }
}
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
let wix = null;
async function client() {
  if (wix) return wix;
  const [{ createClient, OAuthStrategy }, { items }] = await Promise.all([import('https://esm.sh/@wix/sdk@1.21.16'), import('https://esm.sh/@wix/data@1.0.525')]);
  wix = createClient({ auth: OAuthStrategy({ clientId: CLIENT_ID }), modules: { items } }); return wix;
}
async function save() {
  if (!take) return; clearInterval(autoT); const tk = take, id = cur.id; setSt('שומרת...');
  try {
    const audio = await b64(tk.blob); if (audio.length > 12000000) throw new Error('long');
    const c = await client();
    // הקלטה ארוכה נשמרת בכמה שורות (מגבלת גודל לשורה). כל חלק מתחיל במכפלה של 4 כדי שאפשר יהיה לפענח כל חלק לבד
    const CH = 380000, n = Math.ceil(audio.length / CH), takeId = Date.now().toString(36);
    for (let i = 0; i < n; i++) {
      if (n > 1) setSt('שומרת... חלק ' + (i + 1) + ' מתוך ' + n);
      for (let tr = 0; ; tr++) { try { await c.items.insert(COL, { title: secret, itemId: id, k: id, text: 'vid off=' + tk.off.toFixed(3) + ' take=' + takeId + ' part=' + (i + 1) + '/' + n, mime: tk.blob.type, audio: audio.slice(i * CH, (i + 1) * CH), synced: false }); break; } catch (er) { if (tr >= 2) throw er; setSt('מנסה לשמור שוב...'); await new Promise(r => setTimeout(r, 1500)); } }
    }
    sent[id] = Date.now(); store.set(SENT, sent); take = null; setSt('נשמר. כל הכבוד!', 'ok'); controls('saved'); home();
  } catch (e) { console.error('save failed', e && (e.message || JSON.stringify(e)), e && e.details ? JSON.stringify(e.details) : ''); setSt(e.message === 'long' ? 'ההקלטה ארוכה מדי לשמירה' : 'השמירה לא הצליחה. בדקי שיש אינטרנט ולחצי "שמירה עכשיו"', 'err'); controls('done'); }
}
document.addEventListener('click', async e => {
  const id = e.target.id; if (!id) return;
  if (id === 'bRec') { setSt(''); controls('run'); play(true); }
  if (id === 'bWatch') { controls('run'); await play(false); controls('idle'); }
  if (id === 'bAgain') { clearInterval(autoT); take = null; setSt(''); controls('run'); play(true); }
  if (id === 'bStop') running = false;
  if (id === 'bSave') save();
  if (id === 'bPlay' && take) { clearInterval(autoT); try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} const a = new Audio(URL.createObjectURL(take.blob)); a.play().catch(() => setSt('ההשמעה לא עבדה', 'err')); setSt('מנגן... (השמירה האוטומטית נעצרה, לחצי "שמירה עכשיו" כשרוצה)'); }
  if (id === 'bNext') { const sc = data[signOf(cur)].scenes.filter(x => !x.hidden), i = sc.findIndex(x => x.id === cur.id); if (i + 1 < sc.length) openScene(sc[i + 1].id); else $('close').click(); }
  if (id === 'close') { running = false; cancelAnimationFrame(raf); clearInterval(autoT); try { if (rec && rec.state === 'recording') rec.stop(); } catch (e) {} try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {} stream = null; $('stage').classList.remove('on'); home(); }
});
window.__vid = { data: () => data, openScene, play, getTake: () => take };
load();
</script>
</body>
</html>
