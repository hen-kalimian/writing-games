<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ברוכה הבאה למועדון האימהות</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:'Open Sans','Rubik',sans-serif;color:#1e2a31;
    background:linear-gradient(160deg,#fff 0%,#fdeef3 45%,#eaf7f1 75%,#eaf4fb 100%);padding:24px 16px 48px;}
  #wrap{max-width:720px;margin:0 auto;text-align:center;}
  .logo{width:150px;max-width:44vw;height:auto;display:block;margin:0 auto 10px;}
  h1{font-family:'Rubik',sans-serif;font-size:clamp(22px,5.4vw,32px);line-height:1.35;color:#d14175;margin:6px 0 4px;}
  .sub{font-family:'Rubik',sans-serif;font-size:clamp(18px,4.4vw,24px);color:#3a8e69;font-weight:500;margin:0 0 20px;}
  .video{width:100%;max-width:400px;margin:0 auto;border-radius:20px;overflow:hidden;
    background:#fdeef3;border:3px solid #fbd0de;box-shadow:0 10px 30px rgba(209,65,117,.15);line-height:0;}
  .video video{width:100%;height:auto;aspect-ratio:9/16;display:block;background:#fdeef3;}
  .cta{margin-top:28px;background:#fff;border:2px solid #cfeadd;border-radius:20px;padding:22px 16px;
    box-shadow:0 4px 16px rgba(58,142,105,.1);}
  .cta p{margin:0 0 14px;font-family:'Rubik',sans-serif;font-size:clamp(16px,4.2vw,19px);font-weight:500;color:#386380;}
  .btn{display:inline-block;background:#d14175;color:#fff;text-decoration:none;font-family:'Rubik',sans-serif;
    font-weight:700;font-size:clamp(16px,4.2vw,19px);padding:15px 30px;border-radius:14px;
    box-shadow:0 6px 16px rgba(209,65,117,.3);transition:transform .15s;}
  .btn:hover{transform:translateY(-2px);background:#ae2f5f;}
  .foot{margin-top:26px;font-size:12px;color:#6c808c;}
</style>
</head>
<body>
<div id="wrap">
  <img class="logo" src="img/logo.png" alt="חן קלימיאן - לדבר עם ילדים">
  <h1>ברוכה הבאה למועדון האימהות</h1>
  <p class="sub">צפי בסרטון היכרות קצר:</p>
  <div class="video">
    <video controls playsinline preload="metadata" poster="video/club-welcome-poster.jpg" src="video/club-welcome.mp4" title="ברוכה הבאה למועדון האימהות"></video>
  </div>
  <div class="cta">
    <p>לכל התכנים של המועדון לחצי כאן</p>
    <a class="btn" target="_top" href="./">לכניסה לבית המועדון</a>
  </div>
  <div class="foot">talkwithkids.co.il</div>
</div>
</body>
</html>
